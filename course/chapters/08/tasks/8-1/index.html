<!doctype html>
<html lang="zh-CN">
<head><script data-lab-shell>/* 三维区底色（全课程统一）：近白中性灰，适合印刷教材截图；深色模式用深石墨色。
 * 取值以 shared/lab-shell/lab-shell.css 里的 --stage-bg / --stage-floor / --stage-shadow 为准（深浅色一起切换）；
 * 页面样式还没载入时（运行时才挂外壳的页面、第二章被嵌入前的原版实验页）用下面同值的后备。
 * 用法：StageTone.bg() → '#f5f6f8'；StageTone.color(THREE) → THREE.Color；
 *       StageTone.paint(scene, THREE) 设底色并让雾跟着变；StageTone.contactShadow(THREE, {size}) 模型下方的柔和接触阴影。
 * 第二章：原版实验页被嵌入时，外壳把自己的取值经 postMessage 传进来（embed-bridge.js 调 StageTone.use）。
 */
(() => {
  'use strict';
  if (window.StageTone) return;
  const FALLBACK = {
    light: {bg: '#f5f6f8', floor: '#eceef1', shadow: 'rgba(28,36,48,.20)'},
    dark: {bg: '#1a1f27', floor: '#222833', shadow: 'rgba(0,0,0,.55)'},
  };
  const root = document.documentElement;
  let cache = null, override = null;
  const theme = () => (root.dataset.theme === 'dark' ? 'dark' : 'light');
  const read = () => {
    const t = theme(), f = FALLBACK[t], cs = getComputedStyle(root);
    const v = n => cs.getPropertyValue(n).trim();
    return {theme: t, bg: v('--stage-bg') || f.bg, floor: v('--stage-floor') || f.floor, shadow: v('--stage-shadow') || f.shadow, ...(override?.[t] || {})};
  };
  const get = () => (cache && cache.theme === theme() ? cache : (cache = read()));
  addEventListener('course-theme-change', () => { cache = null; });

  /* 电脑上（鼠标操作、宽屏）让三维画布保留最后一帧，“保存三维截图”随时读得到；
     不少页面是“画面有变化才重画”，不保留的话读到的是空白。手机上不开，省一次每帧拷贝。 */
  try {
    if (matchMedia('(pointer:fine) and (min-width:901px)').matches) {
      const original = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        return original.call(this, type, /^(webgl|webgl2|experimental-webgl)$/.test(type) ? {...(attrs || {}), preserveDrawingBuffer: true} : attrs);
      };
    }
  } catch { /* 保持默认 */ }

  /* 三维截图：把 root 里正在显示的三维画布存成一张 PNG（铺统一底色，不含页面上的按钮和文字标签）。
     画布内容只在“刚画完的那一帧”里读得到，所以排在页面自己的绘制之后读；读到空白就催一次重绘、下一帧再试。 */
  const blank = canvas => {
    const probe = document.createElement('canvas'); probe.width = probe.height = 24;
    const g = probe.getContext('2d', {willReadFrequently: true}); g.drawImage(canvas, 0, 0, 24, 24);
    const d = g.getImageData(0, 0, 24, 24).data;
    for (let i = 3; i < d.length; i += 4) if (d[i]) return false;
    return true;
  };
  function capture(scope = document.body, {scale = 1} = {}) {
    const list = [...scope.querySelectorAll('canvas')].filter(c => { const r = c.getBoundingClientRect(); return r.width > 80 && r.height > 80 && getComputedStyle(c).visibility !== 'hidden'; });
    const canvas = list.sort((a, b) => (b.dataset.engine ? 1 : 0) - (a.dataset.engine ? 1 : 0) || b.width * b.height - a.width * a.height)[0];
    return new Promise(resolve => {
      if (!canvas) return resolve(null);
      let tries = 0;
      const grab = () => {
        try {
          if (blank(canvas) && ++tries < 8) { if (tries === 1 || tries === 4) dispatchEvent(new Event('resize')); return requestAnimationFrame(grab); }
          const out = document.createElement('canvas'); out.width = Math.round(canvas.width * scale); out.height = Math.round(canvas.height * scale);
          const g = out.getContext('2d'); g.fillStyle = get().bg; g.fillRect(0, 0, out.width, out.height);
          g.imageSmoothingQuality = 'high'; g.drawImage(canvas, 0, 0, out.width, out.height);
          resolve(out.toDataURL('image/png'));
        } catch { resolve(null); }
      };
      requestAnimationFrame(grab);
    });
  }

  window.StageTone = {
    get, capture,
    bg: () => get().bg,
    floor: () => get().floor,
    /** 底色的 THREE.Color（传入页面自己的 THREE，模块化页面也能用）。 */
    color: (T = window.THREE, key = 'bg') => new T.Color(get()[key]),
    /** 设场景底色，雾（若有）随底色。返回 scene 便于链式调用。 */
    paint(scene, T = window.THREE) {
      if (!scene) return scene;
      const c = get().bg;
      if (scene.background?.isColor) scene.background.set(c); else scene.background = new T.Color(c);
      if (scene.fog?.color) scene.fog.color.set(c);
      return scene;
    },
    /** 模型下方的柔和接触阴影：一张径向渐变贴图的平面（不受光照影响，深浅色自动换）。
     *  size 为直径（场景单位），up 为 'y' 或 'z'（哪个轴朝上）。返回 Mesh，自己 position 到模型脚下。 */
    contactShadow(T = window.THREE, {size = 1, up = 'y', strength = 1} = {}) {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d'), grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, 'rgba(0,0,0,1)'); grad.addColorStop(.45, 'rgba(0,0,0,.55)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
      const tex = new T.CanvasTexture(c);
      const mat = new T.MeshBasicMaterial({map: tex, color: 0x000000, transparent: true, depthWrite: false, toneMapped: false});
      const mesh = new T.Mesh(new T.PlaneGeometry(size, size), mat);
      if (up === 'y') mesh.rotation.x = -Math.PI / 2;
      mesh.renderOrder = -1; mesh.userData.contactShadow = true;
      const tone = () => { mat.opacity = (theme() === 'dark' ? .5 : .16) * strength; };
      tone(); addEventListener('course-theme-change', tone);
      return mesh;
    },
    /** 外部指定取值（第二章嵌入时由外壳传入）；传 null 取消。 */
    use(values) { override = values; cache = null; },
    refresh() { cache = null; return get(); },
  };
})();
</script>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>8-1 安全操作｜智能建筑机械与机器人</title>
<style>/* 8-1 页面自身样式：三维现场铺满外壳三维区；危险标签、载入提示。外壳样式在 shared/lab-shell。 */
html, body { margin:0; height:100%; }
.c8-site { position:relative; width:100%; height:100vh; overflow:hidden; background:#dfe9f3; touch-action:none; outline:none; }
.c8-site canvas { display:block; width:100%; height:100%; cursor:grab; }
.c8-site:focus-visible { box-shadow:inset 0 0 0 3px rgba(36,103,201,.5); }
.c8-labels { position:absolute; inset:0; pointer-events:none; z-index:2; }
.c8-labels[hidden] { display:none; }
.c8-pin {
  position:absolute; left:0; top:0; pointer-events:auto; cursor:pointer; white-space:nowrap;
  padding:4px 10px; border-radius:999px; border:1.5px solid #f0a020; background:rgba(255,250,238,.94); color:#7a4b00;
  font:600 12.5px/1.3 "PingFang SC","Microsoft YaHei",sans-serif; box-shadow:0 2px 10px rgba(30,40,60,.18);
}
.c8-pin::after { content:""; position:absolute; left:50%; bottom:-7px; width:2px; height:6px; margin-left:-1px; background:#f0a020; }
.c8-pin.fixed { border-color:#2467c9; color:#1c4f9a; background:rgba(238,245,255,.95); }
.c8-pin.fixed::after { background:#2467c9; }
.c8-pin.ok { border-color:#1f8a5b; color:#15663f; background:rgba(234,248,240,.95); }
.c8-pin.ok::after { background:#1f8a5b; }
.c8-pin.on { box-shadow:0 0 0 3px rgba(240,160,32,.35), 0 2px 10px rgba(30,40,60,.2); transform-origin:center; font-size:13.5px; }
.c8-loading, .c8-fallback {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:3; margin:0;
  padding:10px 16px; border-radius:12px; background:rgba(255,255,255,.9); color:#29435d; font:14px "PingFang SC","Microsoft YaHei",sans-serif; box-shadow:0 4px 18px rgba(20,40,70,.15);
}
.c8-fallback { max-width:80%; text-align:center; }
.c8-loading { top:auto; bottom:16px; transform:translateX(-50%); font-size:13px; }
html[data-theme="dark"] .c8-site { background:#1b2738; }
html[data-theme="dark"] .c8-pin { background:rgba(46,36,16,.92); color:#ffd391; }
html[data-theme="dark"] .c8-pin.fixed { background:rgba(20,36,60,.92); color:#a9ccff; border-color:#8abaff; }
html[data-theme="dark"] .c8-pin.ok { background:rgba(16,44,32,.92); color:#8fe0b6; border-color:#5cc597; }
html[data-theme="dark"] :is(.c8-loading, .c8-fallback) { background:rgba(20,32,48,.9); color:#d7e5f5; }
</style>
<style data-lab-shell>/* 第二章任务页：一屏放下（16:9 屏幕不出现纵向滚动），菜单两层，蓝白配色。 */
:root {
  --course-bg:#edf4fc; --course-surface:#fff; --course-ink:#193550; --course-muted:#57718b;
  --course-line:#cbdbea; --course-accent:#2467c9; --blue-soft:#e6f0ff;
  --accent-2:#1c55ad; --surface-2:#f5f8fd; --hair:#e1eaf4;
  --ok:#1f8a5b; --ok-soft:#e5f6ee; --ok-line:#a8dcc2; --warn:#c77a12; --warn-soft:#fdf2e1; --bad:#c2413b; --bad-soft:#fbe7e5;
  --focus:#f0a020;
  --shadow-sm:0 1px 2px rgba(18,44,78,.06);
  --shadow:0 1px 2px rgba(18,44,78,.05), 0 6px 22px rgba(18,44,78,.08);
  --shadow-lg:0 10px 34px rgba(18,44,78,.18);
  --page-bg:radial-gradient(60% 70% at 100% 0,#d9e7f9 0,transparent 62%),linear-gradient(180deg,#f3f7fc 0%,#e7eff9 100%);
  /* 全课程两种字体：正文（苹方 / 微软雅黑）与数字（编号、读数；与首页同一种窄体数字） */
  --font-ui:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC","Segoe UI",system-ui,sans-serif;
  --font-num:"DIN Alternate",Bahnschrift,"Roboto Condensed","Avenir Next Condensed","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
html[data-theme="dark"] {
  --accent-2:#b5d3ff; --surface-2:#1d324b; --hair:#2b4562;
  --ok:#5cc597; --ok-soft:#173a2d; --ok-line:#2f6b51; --warn:#f0b35a; --warn-soft:#3b2d16; --bad:#f08079; --bad-soft:#3d1f1f;
  --shadow-sm:0 1px 2px rgba(0,0,0,.25); --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.28); --shadow-lg:0 12px 34px rgba(0,0,0,.45);
  --page-bg:radial-gradient(60% 70% at 100% 0,#1b3a63 0,transparent 62%),linear-gradient(180deg,#0d1a2b 0%,#10223a 100%);
}
/* 三维区（全课程统一）：近白中性灰底，模型下方柔和接触阴影；也是印刷教材截图的底色。
   --stage-floor 给场景里的真实地面（桥面、楼板、房间）用，与底色衔接；--stage-ink/chip 是三维区里的小字和浮签。
   shared/lab-shell/stage-tone.js 把这些值交给三维场景（第二章经 postMessage 传进嵌入页），改值只改这里及该文件的同值后备。 */
:root, [data-stage-tone="light"] {
  --stage-bg:#f5f6f8; --stage-floor:#eceef1; --stage-shadow:rgba(28,36,48,.20);
  --stage-ink:#4f5b6b; --stage-chip:rgba(255,255,255,.86); --stage-chip-line:rgba(25,40,60,.10);
}
html[data-theme="dark"], [data-stage-tone="dark"] {
  --stage-bg:#1a1f27; --stage-floor:#222833; --stage-shadow:rgba(0,0,0,.55);
  --stage-ink:#b8c3d1; --stage-chip:rgba(30,36,46,.86); --stage-chip-line:rgba(255,255,255,.10);
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; }
body {
  display:grid; grid-template-rows:auto auto minmax(0,1fr); height:100vh; height:100dvh; overflow:hidden;
  background:var(--page-bg); color:var(--course-ink);
  font:15px/1.55 var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; transition:background .15s, border-color .15s, color .15s, box-shadow .15s, transform .15s; }
:focus-visible { outline:3px solid color-mix(in srgb, var(--course-accent) 60%, transparent); outline-offset:2px; }

/* —— 页头：本章任务 —— */
.c2-top {
  display:flex; align-items:center; gap:14px; height:50px; padding:0 18px;
  background:var(--course-surface); border-bottom:1px solid var(--hair); box-shadow:var(--shadow-sm);
}
.c2-back {
  display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px 0 10px; border-radius:16px;
  color:var(--course-ink); text-decoration:none; font-weight:700; white-space:nowrap; font-size:15px; background:var(--surface-2);
}
.c2-back:hover { color:var(--course-accent); background:var(--blue-soft); }
.c2-back-chapter { margin-left:4px; padding-left:9px; border-left:1px solid var(--hair); color:var(--course-muted); font-weight:500; font-size:13.5px; }
@media (max-width:1280px) { .c2-back-chapter { display:none; } }
.c2-tasks { display:flex; gap:2px; margin:0 auto; padding:3px; border-radius:12px; background:var(--surface-2); overflow-x:auto; }
.c2-tasks a { padding:5px 16px; border-radius:9px; color:var(--course-muted); text-decoration:none; white-space:nowrap; font-size:15px; }
.c2-tasks a:hover { color:var(--course-accent); }
.c2-tasks a[aria-current="page"] { background:var(--course-surface); color:var(--course-accent); font-weight:700; box-shadow:var(--shadow-sm); }
.c2-top .course-theme-toggle { margin-left:0 !important; height:32px !important; min-height:32px !important; border-radius:16px !important; }

/* —— 工位条 —— */
.c2-bar { display:flex; align-items:center; gap:20px; padding:12px 18px 10px; }
.c2-title { display:flex; align-items:center; gap:10px; min-width:0; }
.c2-task-id {
  display:inline-flex; align-items:center; height:26px; padding:0 10px; border-radius:13px;
  background:var(--course-accent); color:#fff; font-weight:700; font-size:14px; white-space:nowrap;
}
html[data-theme="dark"] .c2-task-id { color:#0f1d2e; }
.c2-title h1 { margin:0; font-size:24px; line-height:1.2; font-weight:800; letter-spacing:.5px; white-space:nowrap; }
.c2-stations { display:flex; gap:8px; margin-left:auto; }
.c2-station {
  display:flex; align-items:center; gap:9px; height:42px; padding:0 16px 0 7px;
  border:1px solid var(--hair); border-radius:12px; background:var(--course-surface); box-shadow:var(--shadow-sm);
  color:var(--course-ink); font-size:16px; white-space:nowrap;
}
.c2-station:hover { border-color:var(--course-accent); transform:translateY(-1px); }
.c2-station[aria-selected="true"] {
  background:linear-gradient(135deg,#3a82e4,#1f5bbd); border-color:transparent; color:#fff; font-weight:700;
  box-shadow:0 6px 16px rgba(36,103,201,.32);
}
html[data-theme="dark"] .c2-station[aria-selected="true"] { background:linear-gradient(135deg,#8abaff,#5f97ea); color:#0f1d2e; }
.c2-num { display:grid; place-items:center; width:28px; height:28px; border-radius:9px; background:var(--blue-soft); color:var(--course-accent); font:800 17px/1 var(--font-num); }
.c2-station[aria-selected="true"] .c2-num { background:rgba(255,255,255,.22); color:inherit; }
.c2-check { display:none; width:18px; height:18px; border-radius:50%; background:var(--ok); color:#fff; font-size:11px; font-weight:800; place-items:center; }
.c2-station.done .c2-check { display:grid; }
.c2-station[aria-selected="true"].done .c2-check { background:#fff; color:var(--ok); }

/* —— 主体：三维区 + 面板 —— */
.c2-main { display:grid; grid-template-columns:minmax(0,1fr) clamp(360px,27vw,450px); gap:14px; padding:0 18px 16px; min-height:0; }
.c2-stage {
  display:flex; flex-direction:column; min-height:0; overflow:hidden; border-radius:16px;
  border:1px solid var(--hair); background:var(--course-surface); box-shadow:var(--shadow);
}
.c2-view { position:relative; flex:1 1 auto; min-height:0; background:var(--stage-bg); }
.c2-frame { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:transparent; }
.c2-loading {
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  color:var(--course-muted); font-size:15px; background:var(--stage-bg); pointer-events:none; z-index:1;
}
.c2-spinner { width:30px; height:30px; border-radius:50%; border:3px solid var(--blue-soft); border-top-color:var(--course-accent); animation:c2-spin .8s linear infinite; }
@keyframes c2-spin { to { transform:rotate(360deg); } }
.c2-tools { position:absolute; left:12px; top:12px; display:flex; gap:6px; flex-wrap:wrap; max-width:64%; z-index:2; }
.c2-tool {
  height:34px; padding:0 12px; border-radius:10px; border:1px solid color-mix(in srgb, var(--hair) 70%, transparent);
  background:color-mix(in srgb, var(--course-surface) 88%, transparent); backdrop-filter:blur(8px);
  color:var(--course-ink); font-size:14px; white-space:nowrap; box-shadow:var(--shadow-sm);
}
.c2-tool:hover { border-color:var(--course-accent); color:var(--course-accent); }
.c2-tool[aria-pressed="true"] { background:var(--blue-soft); border-color:color-mix(in srgb, var(--course-accent) 55%, transparent); color:var(--course-accent); font-weight:700; }
.c2-toolseg {
  padding:3px; border-color:color-mix(in srgb, var(--hair) 70%, transparent) !important;
  background:color-mix(in srgb, var(--course-surface) 88%, transparent) !important; backdrop-filter:blur(8px); box-shadow:var(--shadow-sm);
}
.c2-toolseg button { height:28px; font-size:14px; padding:0 10px; }
.c2-hint {
  position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:2; pointer-events:none;
  max-width:min(80%,560px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  padding:5px 14px; border-radius:999px; font-size:14px; line-height:1.4; color:var(--stage-ink);
  background:var(--stage-chip); border:1px solid var(--stage-chip-line); backdrop-filter:blur(6px);
  transition:opacity .6s ease, transform .6s ease;
}
.c2-hint.gone { opacity:0; transform:translate(-50%,-6px); }

/* 全屏：外壳统一一个按钮，钉在三维区右上角；全屏的是整块三维区（含上方选择条和提示条） */
.c2-fs {
  position:absolute; right:12px; top:12px; z-index:5; width:34px; height:34px; padding:0; display:grid; place-items:center;
  border-radius:10px; border:1px solid var(--stage-chip-line); background:var(--stage-chip); backdrop-filter:blur(8px);
  color:var(--course-ink); box-shadow:var(--shadow-sm);
}
.c2-fs:hover { color:var(--course-accent); border-color:var(--course-accent); }
.c2-fs svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.c2-fs .c2-fs-out, .c2-stage.c2-full .c2-fs .c2-fs-in { display:none; }
.c2-stage.c2-full .c2-fs .c2-fs-out { display:block; }
.c2-stage:fullscreen { border:0; border-radius:0; box-shadow:none; width:100%; height:100%; }
.c2-stage:fullscreen::backdrop { background:var(--stage-bg); }
/* 浏览器不支持全屏接口时：铺满窗口 */
.c2-stage.c2-full-fallback { position:fixed !important; inset:0 !important; z-index:2147483000 !important; width:auto !important; height:auto !important; border-radius:0; border:0; }

.c2-part {
  position:absolute; right:12px; top:56px; z-index:3; width:min(300px,42%); padding:11px 34px 11px 13px; border-radius:12px;
  background:var(--course-surface); border:1px solid var(--hair); border-left:4px solid var(--focus);
  box-shadow:var(--shadow-lg); display:flex; flex-direction:column; gap:3px;
}
.c2-part strong { font-size:16px; }
.c2-part span { color:var(--course-muted); font-size:14px; line-height:1.5; }
.c2-x { position:absolute; right:6px; top:4px; border:0; background:none; font-size:18px; color:var(--course-muted); }

/* 三维区底部：运行控制 + 读数（不压在模型上） */
.c2-strip {
  flex:0 0 auto; display:flex; align-items:stretch; gap:10px; padding:8px 10px;
  border-top:1px solid var(--hair); background:var(--course-surface);
}
.c2-strip:has(.c2-transport:empty):has(.c2-readouts:empty) { display:none; }
.c2-transport { display:flex; align-items:center; gap:6px; flex:0 0 auto; padding-right:4px; }
.c2-transport:empty { display:none; }
.c2-transport .c2-tool { box-shadow:none; background:var(--surface-2); border-color:transparent; backdrop-filter:none; height:34px; }
.c2-transport .c2-tool:hover { background:var(--blue-soft); }
.c2-play {
  height:38px; min-width:96px; padding:0 16px; border-radius:11px; border:0;
  background:linear-gradient(135deg,#3a82e4,#1f5bbd); color:#fff; font-weight:700; font-size:15.5px;
  box-shadow:0 4px 12px rgba(36,103,201,.3);
}
.c2-play:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(36,103,201,.36); }
.c2-play[aria-pressed="true"] { background:linear-gradient(135deg,#4c5f78,#33465e); box-shadow:0 4px 12px rgba(30,45,65,.25); }
html[data-theme="dark"] .c2-play { background:linear-gradient(135deg,#8abaff,#5f97ea); color:#0f1d2e; }
.c2-readouts { display:flex; gap:6px; flex:1 1 auto; min-width:0; }
.c2-read {
  flex:1 1 0; min-width:84px; display:flex; flex-direction:column; justify-content:center; padding:4px 12px;
  border-radius:11px; background:var(--surface-2);
}
.c2-read-label { color:var(--course-muted); font-size:13.5px; white-space:nowrap; }
.c2-val { display:flex; align-items:baseline; gap:4px; white-space:nowrap; overflow:hidden; }
.c2-val b { font:700 25px/1.15 var(--font-num); font-variant-numeric:tabular-nums; color:var(--course-ink); }
.c2-val small { color:var(--course-muted); font-size:13.5px; }

/* —— 操作面板 —— */
.c2-panel {
  display:flex; flex-direction:column; gap:12px; min-height:0; overflow:auto; padding:16px 16px 14px;
  border-radius:16px; border:1px solid var(--hair); background:var(--course-surface); box-shadow:var(--shadow); scrollbar-width:thin;
}
.c2-head-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.c2-head-name { display:flex; align-items:center; gap:9px; min-width:0; }
.c2-head-num {
  flex:0 0 30px; height:30px; border-radius:10px; display:grid; place-items:center; font:800 18px/1 var(--font-num); color:#fff;
  background:linear-gradient(135deg,#3a82e4,#1f5bbd); box-shadow:0 3px 8px rgba(36,103,201,.3);
}
html[data-theme="dark"] .c2-head-num { color:#0f1d2e; background:linear-gradient(135deg,#8abaff,#5f97ea); }
.c2-panel-head h2 { margin:0; font-size:21px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.c2-panel-head p { margin:6px 0 0; color:var(--course-muted); font-size:15px; line-height:1.55; }
.c2-redo { height:30px; padding:0 11px; border-radius:15px; border:1px solid var(--hair); background:var(--surface-2); color:var(--course-muted); font-size:13.5px; white-space:nowrap; }
.c2-redo:hover { color:var(--course-accent); border-color:var(--course-accent); }
.c2-panel-body { display:flex; flex-direction:column; gap:14px; }
.c2-group { display:flex; flex-direction:column; gap:8px; }
.c2-group h3 { margin:0; font-size:15px; color:var(--accent-2); font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.c2-h3-text { display:flex; align-items:center; gap:7px; }
.c2-h3-text::before { content:""; width:4px; height:14px; border-radius:2px; background:var(--course-accent); }
.c2-row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.c2-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; }
.c2-btn {
  height:36px; padding:0 14px; border-radius:10px; border:1px solid var(--hair);
  background:var(--course-surface); color:var(--course-ink); white-space:nowrap; box-shadow:var(--shadow-sm);
}
.c2-btn:hover:not(:disabled) { border-color:var(--course-accent); color:var(--course-accent); }
.c2-btn:disabled { opacity:.45; cursor:not-allowed; }
.c2-btn.c2-primary { background:linear-gradient(135deg,#3a82e4,#1f5bbd); border-color:transparent; color:#fff; font-weight:700; box-shadow:0 4px 12px rgba(36,103,201,.28); }
.c2-btn.c2-primary:hover:not(:disabled) { color:#fff; transform:translateY(-1px); }
html[data-theme="dark"] .c2-btn.c2-primary { background:linear-gradient(135deg,#8abaff,#5f97ea); color:#0f1d2e; }
.c2-btn.c2-small { height:32px; padding:0 12px; }
.c2-btn[aria-pressed="true"] { background:var(--blue-soft); border-color:var(--course-accent); color:var(--course-accent); font-weight:700; }
.c2-seg { display:flex; padding:3px; gap:3px; border-radius:11px; background:var(--surface-2); border:1px solid var(--hair); }
.c2-seg button { flex:1; height:32px; padding:0 8px; border:0; border-radius:8px; background:none; color:var(--course-muted); white-space:nowrap; }
.c2-seg button:hover { color:var(--course-accent); }
.c2-seg button[aria-checked="true"] { background:var(--course-surface); color:var(--course-accent); font-weight:700; box-shadow:0 1px 4px rgba(18,44,78,.14); }
.c2-speed { padding:2px; border-radius:10px; }
.c2-speed button { height:30px; padding:0 10px; font-size:14px; }

/* 滑块：已走过的一段用主色填充 */
.c2-slider { display:flex; flex-direction:column; gap:3px; min-width:0; }
.c2-slider-top { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:15px; }
.c2-slider output {
  font-weight:700; color:var(--course-accent); font-variant-numeric:tabular-nums; white-space:nowrap;
  background:var(--blue-soft); padding:0 8px; border-radius:8px; font:700 16px/24px var(--font-num);
}
.c2-slider input[type="range"] {
  -webkit-appearance:none; appearance:none; width:100%; height:22px; margin:0; background:transparent; cursor:pointer; --p:50%;
}
.c2-slider input[type="range"]::-webkit-slider-runnable-track {
  height:6px; border-radius:3px; background:linear-gradient(to right, var(--course-accent) var(--p), var(--hair) var(--p));
}
.c2-slider input[type="range"]::-moz-range-track { height:6px; border-radius:3px; background:var(--hair); }
.c2-slider input[type="range"]::-moz-range-progress { height:6px; border-radius:3px; background:var(--course-accent); }
.c2-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance:none; width:18px; height:18px; margin-top:-6px; border-radius:50%;
  background:#fff; border:3px solid var(--course-accent); box-shadow:0 2px 6px rgba(18,44,78,.25);
}
.c2-slider input[type="range"]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid var(--course-accent); }
.c2-slider input[type="range"]:hover::-webkit-slider-thumb { transform:scale(1.12); }

.c2-switch {
  display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 10px 0 6px; border-radius:10px;
  border:1px solid var(--hair); background:var(--course-surface); font-size:14.5px; white-space:nowrap;
}
.c2-knob { position:relative; width:30px; height:18px; border-radius:10px; background:var(--course-line); transition:background .15s; }
.c2-knob::after { content:""; position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
.c2-switch[aria-checked="true"] .c2-knob { background:var(--course-accent); }
.c2-switch[aria-checked="true"] .c2-knob::after { transform:translateX(12px); }
.c2-chips { display:flex; flex-wrap:wrap; gap:6px; }
.c2-chip { height:32px; padding:0 13px; border-radius:16px; border:1px solid var(--hair); background:var(--course-surface); font-size:14.5px; white-space:nowrap; box-shadow:var(--shadow-sm); }
.c2-chip:hover { border-color:var(--course-accent); color:var(--course-accent); }
.c2-chip[aria-pressed="true"] { background:var(--focus); border-color:var(--focus); color:#2b1a00; font-weight:700; }
.c2-chip.done { background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok); font-weight:700; }

/* 试一试：挑战卡 */
.c2-count { color:var(--course-accent); font:700 17px/1 var(--font-num); font-variant-numeric:tabular-nums; }
.c2-progress { height:5px; border-radius:3px; background:var(--hair); overflow:hidden; }
.c2-progress span { display:block; height:100%; width:0; border-radius:3px; background:linear-gradient(90deg,#3fb27f,#1f8a5b); transition:width .4s ease; }
.c2-challenges { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.c2-challenge {
  display:flex; gap:9px; align-items:flex-start; padding:9px 10px; border-radius:12px; min-width:0;
  border:1px solid var(--hair); background:var(--course-surface); box-shadow:var(--shadow-sm);
  transition:border-color .2s, background .2s, transform .2s;
}
.c2-mark {
  flex:0 0 30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:16px; line-height:1;
  background:linear-gradient(135deg,#eaf2ff,#d9e8ff); color:var(--course-accent); font-weight:800;
}
html[data-theme="dark"] .c2-mark { background:var(--blue-soft); }
.c2-ch-text { display:flex; flex-direction:column; gap:1px; min-width:0; }
.c2-ch-text b { font-size:15px; line-height:1.35; font-weight:700; }
.c2-ch-text span { color:var(--course-muted); font-size:13.5px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.c2-ch-go {
  align-self:flex-start; margin-top:5px; height:26px; padding:0 10px; border-radius:13px; border:0;
  background:var(--course-accent); color:#fff; font-size:13.5px; font-weight:700;
}
html[data-theme="dark"] .c2-ch-go { color:#0f1d2e; }
.c2-challenge.done { background:var(--ok-soft); border-color:var(--ok-line); }
.c2-challenge.done .c2-mark { background:var(--ok); color:#fff; animation:c2-pop .45s ease; }
.c2-challenge.done .c2-ch-text span { color:var(--ok); font-weight:700; }
.c2-challenge.done .c2-ch-go { display:none; }
@keyframes c2-pop { 0% { transform:scale(.6); } 60% { transform:scale(1.18); } 100% { transform:scale(1); } }

.c2-choice, .c2-predict { display:flex; flex-direction:column; gap:6px; padding:10px 12px; border-radius:12px; background:var(--surface-2); border:1px solid var(--hair); }
.c2-prompt { margin:0; font-weight:700; font-size:15px; }
.c2-options { display:flex; gap:6px; flex-wrap:wrap; }
.c2-opt { flex:1 1 auto; min-height:34px; padding:4px 12px; border-radius:9px; border:1px solid var(--hair); background:var(--course-surface); }
.c2-opt:hover:not(:disabled) { border-color:var(--course-accent); }
.c2-opt.right { background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:700; }
.c2-opt.wrong { background:var(--bad-soft); border-color:var(--bad); color:var(--bad); text-decoration:line-through; }
.c2-opt:disabled:not(.right):not(.wrong) { opacity:.5; }
.c2-predict.c2-inline { flex-direction:row; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:8px 12px; }
.c2-predict.c2-inline .c2-row { flex-wrap:nowrap; }
.c2-predict.c2-inline input { width:72px; }
.c2-predict input { width:100px; height:34px; padding:0 10px; border-radius:9px; border:1px solid var(--hair); background:var(--course-surface); font-size:16px; font-weight:700; }
.c2-predict input.right { border-color:var(--ok); background:var(--ok-soft); }
.c2-predict input.wrong { border-color:var(--bad); background:var(--bad-soft); }
.c2-unit { color:var(--course-muted); }
.c2-note { margin:0; color:var(--course-muted); font-size:14px; line-height:1.5; }
.c2-big { font-size:16px; font-weight:700; }
.c2-banner {
  display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 12px; border-radius:12px;
  background:linear-gradient(135deg,#fff4dc,#ffe9bf); border:1px solid #f3cf87; color:#6b4300; font-size:14px; font-weight:700;
}
html[data-theme="dark"] .c2-banner { background:#3b2d16; border-color:#6b5124; color:#f6d38f; }
.c2-quiet { color:var(--course-muted); }

/* 模型来源与许可：面板最底下一个 ⓘ，点开才显示，不占正文 */
.c2-credit { position:relative; margin-top:auto; display:flex; justify-content:flex-end; }
.c2-credit-btn {
  height:26px; padding:0 10px; border-radius:13px; border:1px solid transparent; background:none;
  color:var(--course-muted); font-size:13.5px; display:inline-flex; align-items:center; gap:5px;
}
.c2-credit-btn:hover, .c2-credit-btn[aria-expanded="true"] { color:var(--course-accent); border-color:var(--hair); background:var(--surface-2); }
.c2-credit-btn i { font-style:normal; display:grid; place-items:center; width:16px; height:16px; border-radius:50%; border:1.5px solid currentColor; font-size:11px; font-weight:800; line-height:1; }
.c2-credit-pop {
  position:absolute; right:0; bottom:32px; z-index:6; width:min(320px,100%); padding:10px 12px; border-radius:12px;
  background:var(--course-surface); border:1px solid var(--hair); box-shadow:var(--shadow-lg);
  font-size:14px; line-height:1.55; color:var(--course-ink);
}
.c2-credit-pop p { margin:0; }
.c2-credit-pop p + p { margin-top:4px; }
.c2-credit-pop a { color:var(--course-accent); }

/* 提示条：在三维区下方弹出，几秒后收起 */
.c2-feedback {
  position:absolute; left:50%; top:56px; transform:translateX(-50%); z-index:4; max-width:min(640px,80%);
  display:flex; align-items:center; gap:10px; font-size:15px; line-height:1.55; border-radius:14px;
}
.c2-feedback:empty { display:none; }
.c2-feedback:not(:empty) {
  padding:10px 14px 10px 10px; background:var(--course-surface); color:var(--course-ink);
  border:1px solid var(--hair); box-shadow:var(--shadow-lg); animation:c2-rise .25s ease;
}
@keyframes c2-rise { from { opacity:0; transform:translate(-50%,-8px); } to { opacity:1; transform:translate(-50%,0); } }
.c2-toast-icon { flex:0 0 26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:14px; background:var(--blue-soft); color:var(--course-accent); }
.c2-feedback.ok .c2-toast-icon { background:var(--ok); color:#fff; }
.c2-feedback.warn .c2-toast-icon { background:var(--warn); color:#fff; }
.c2-feedback .c2-next { margin:0 0 0 4px; flex:0 0 auto; height:32px; }

/* 外壳布局写死：放进第三章等已有页面时，不受页面里 main / aside / header / section 等通用规则影响 */
html.lab-shell body > .c2-top { grid-row:1; position:static; width:auto; max-width:none; margin:0; }
html.lab-shell body > .c2-bar { grid-row:2; position:static; width:auto; max-width:none; margin:0; }
html.lab-shell body > .c2-main {
  grid-row:3; grid-template-rows:minmax(0,1fr); grid-template-areas:none; grid-auto-flow:row;
  position:static; width:auto; max-width:none; height:auto; max-height:none; margin:0;
}
html.lab-shell .c2-main > :is(.c2-stage, .c2-panel) {
  grid-row:1; grid-area:auto; position:relative; width:auto; height:auto; max-height:none; min-width:0; margin:0; float:none;
}
html.lab-shell .c2-main > .c2-stage { grid-column:1; }
html.lab-shell .c2-main > .c2-panel { grid-column:2; }

/* ===== 视觉润色（与首页同一套语言）：图纸网格底、玻璃页头、柔和分层投影 ===== */
:root { --grid-line:rgba(36,103,201,.045); --shadow:0 1px 2px rgba(18,44,78,.05), 0 10px 30px rgba(18,44,78,.09); }
html[data-theme="dark"] { --grid-line:rgba(138,186,255,.04); }
body::before {
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(var(--grid-line) 1px,transparent 1px) 0 -1px/28px 28px, linear-gradient(90deg,var(--grid-line) 1px,transparent 1px) -1px 0/28px 28px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%); mask-image:linear-gradient(180deg,#000,transparent 70%);
}
.c2-top { background:color-mix(in srgb, var(--course-surface) 82%, transparent); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2); }
.c2-tasks { border:1px solid var(--hair); }
.c2-tasks a { transition:color .15s, background .15s; }
.c2-task-id { font-family:var(--font-num); font-size:15px; letter-spacing:.02em; box-shadow:0 3px 8px rgba(36,103,201,.28); background:linear-gradient(135deg,#3a82e4,#1f5bbd); }
html[data-theme="dark"] .c2-task-id { background:linear-gradient(135deg,#8abaff,#5f97ea); }
.c2-title h1 { letter-spacing:.02em; }
.c2-stage, .c2-panel { border-radius:18px; border-color:color-mix(in srgb, var(--hair) 80%, transparent); }
.c2-station { border-radius:13px; }
.c2-station .c2-num { transition:background .15s; }
/* 面板标题下一道淡淡的分隔，标题区和控件区分开 */
.c2-panel-head { padding-bottom:12px; border-bottom:1px solid var(--hair); }
.c2-h3-text::before { height:15px; background:linear-gradient(180deg,#3a82e4,#1f5bbd); }
.c2-challenge { border-radius:13px; }
.c2-challenge:hover { border-color:color-mix(in srgb, var(--course-accent) 45%, var(--hair)); transform:translateY(-1px); box-shadow:0 6px 16px rgba(18,44,78,.08); }
.c2-read { border:1px solid color-mix(in srgb, var(--hair) 70%, transparent); }
.c2-progress { height:6px; }

/* 保存三维截图：在全屏按钮下面，鼠标移进三维区才出现；全屏时停手 2.5 秒，两个按钮一起隐去 */
.c2-shot {
  position:absolute; right:12px; top:52px; z-index:5; width:34px; height:34px; padding:0; display:grid; place-items:center;
  border-radius:10px; border:1px solid var(--stage-chip-line); background:var(--stage-chip); backdrop-filter:blur(8px);
  color:var(--course-ink); box-shadow:var(--shadow-sm); opacity:0; transition:opacity .2s, color .15s, border-color .15s;
}
.c2-shot svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.c2-view:hover .c2-shot, .c2-shot:focus-visible, .c2-shot.busy { opacity:1; }
.c2-shot:hover { color:var(--course-accent); border-color:var(--course-accent); }
.c2-shot.busy { pointer-events:none; color:var(--course-accent); }
.c2-view:has(.c2-part:not([hidden])) .c2-shot { display:none; }
.c2-fs { transition:opacity .3s, color .15s, border-color .15s; }
.c2-stage.c2-full.c2-idle :is(.c2-fs, .c2-shot) { opacity:0; }

/* ===== 大屏（1680px 以上的教室大屏、投影、外接显示器）：整体放大一档，面板加宽，不再显得又小又空 ===== */
@media (min-width:1680px) and (min-height:860px) {
  body { font-size:16.5px; }
  .c2-top { height:60px; padding:0 28px; gap:18px; }
  .c2-back { height:38px; padding:0 15px 0 13px; border-radius:19px; font-size:16.5px; }
  .c2-back-chapter { font-size:15px; }
  .c2-tasks { padding:4px; border-radius:14px; }
  .c2-tasks a { padding:7px 20px; border-radius:10px; font-size:16.5px; }
  .c2-top .course-theme-toggle { height:38px !important; min-height:38px !important; border-radius:19px !important; font-size:15px !important; }
  .c2-bar { padding:16px 28px 14px; gap:24px; }
  .c2-task-id { height:32px; padding:0 13px; border-radius:16px; font-size:17px; }
  .c2-title { gap:13px; }
  .c2-title h1 { font-size:29px; }
  .c2-stations { gap:10px; }
  .c2-station { height:50px; padding:0 20px 0 9px; gap:11px; font-size:18px; border-radius:15px; }
  .c2-num { width:33px; height:33px; border-radius:10px; font-size:20px; }
  .c2-main { grid-template-columns:minmax(0,1fr) clamp(470px,27vw,560px); gap:18px; padding:0 28px 24px; }
  .c2-tools { left:16px; top:16px; gap:8px; }
  .c2-tool { height:40px; padding:0 15px; border-radius:12px; font-size:15.5px; }
  .c2-toolseg button { height:32px; font-size:15.5px; padding:0 13px; }
  .c2-hint { top:18px; font-size:15.5px; padding:6px 17px; }
  .c2-fs { right:16px; top:16px; width:40px; height:40px; border-radius:12px; }
  .c2-shot { right:16px; top:62px; width:40px; height:40px; border-radius:12px; }
  .c2-fs svg, .c2-shot svg { width:21px; height:21px; }
  .c2-part { right:16px; top:68px; width:min(360px,42%); padding:14px 38px 14px 16px; }
  .c2-part strong { font-size:18px; }
  .c2-part span { font-size:15.5px; }
  .c2-feedback { top:68px; font-size:16.5px; }
  .c2-strip { padding:11px 13px; gap:12px; }
  .c2-play { height:46px; min-width:116px; font-size:17.5px; border-radius:13px; }
  .c2-transport .c2-tool { height:42px; }
  .c2-read { padding:7px 16px; border-radius:13px; min-width:100px; }
  .c2-read-label, .c2-val small { font-size:15px; }

/* 窄屏（手机、平板竖屏）：页头两行（返回 + 深浅色 / 本章任务横向滑动），工位条横向滑动，
   三维区在上、读数两列、面板在下，整页上下滚动。字号放大一档，按钮与滑块按手指大小。 */
@media (max-width:900px) {
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }

  html body .c2-top #course-theme-toggle.course-theme-toggle { height:38px !important; min-height:38px !important; border-radius:19px !important; font-size:14px !important; padding:0 14px !important; }
  .c2-tasks { margin:0; order:3; width:100%; scrollbar-width:none; scroll-snap-type:x proximity; }

  .c2-bar { flex-direction:column; align-items:stretch; gap:10px; padding:12px 12px 10px; }

  .c2-station { flex:1 0 auto; height:42px; font-size:15px; scroll-snap-align:center; }
  .c2-main { display:flex; flex-direction:column; gap:12px; padding:0 12px calc(18px + env(safe-area-inset-bottom)); }
  .c2-stage { height:auto; min-height:0; }
  .c2-view { flex:none; height:clamp(320px,60vh,520px); }
  /* 视角按钮排成一行、横向滑动，不再折成几行压在模型上 */
  .c2-tools { left:8px; top:8px; max-width:calc(100% - 60px); gap:5px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .c2-tools::-webkit-scrollbar { display:none; }
  .c2-tools > * { flex:0 0 auto; }
  .c2-tools .c2-seg { flex-wrap:nowrap; }
  .c2-tool { height:36px; }
  .c2-toolseg button { height:30px; }
  .c2-fs { right:8px; top:8px; width:38px; height:38px; }
  .c2-part { right:8px; left:8px; top:auto; bottom:8px; width:auto; }
  .c2-feedback { top:52px; max-width:calc(100% - 16px); width:max-content; }
  .c2-strip { flex-wrap:wrap; padding:10px; }
  .c2-transport { flex:1 1 100%; flex-wrap:wrap; padding-right:0; }
  .c2-play { height:42px; flex:1 1 auto; font-size:15px; }
  .c2-transport .c2-tool { height:42px; padding:0 14px; }
  .c2-readouts { flex-wrap:wrap; flex:1 1 100%; }
  .c2-read { flex:1 1 40%; padding:6px 12px; }
  .c2-read-label, .c2-val small { font-size:13px; }
  .c2-val b { font-size:22px; }
  .c2-panel { overflow:visible; padding:16px 14px 14px; gap:12px; }
  .c2-panel-head h2 { font-size:19px; }
  .c2-panel-head h2 { white-space:normal; }
  .c2-panel-head p { font-size:14.5px; }
  .c2-redo { height:34px; padding:0 13px; border-radius:17px; font-size:13.5px; }
  .c2-group h3 { font-size:15px; }
  .c2-btn { height:42px; padding:0 16px; }
  .c2-btn.c2-small { height:38px; }
  .c2-seg button { height:38px; }
  .c2-speed button { height:34px; font-size:14px; }
  .c2-slider-top { font-size:15px; }
  .c2-slider input[type="range"] { height:34px; }
  .c2-slider input[type="range"]::-webkit-slider-thumb { width:26px; height:26px; margin-top:-10px; }
  .c2-slider input[type="range"]::-moz-range-thumb { width:20px; height:20px; }
  .c2-switch { height:38px; font-size:14.5px; }
  .c2-chip { height:36px; padding:0 14px; border-radius:18px; font-size:14.5px; }
  .c2-challenge { padding:10px 11px; gap:10px; }
  .c2-mark { flex-basis:32px; height:32px; font-size:17px; }
  .c2-ch-text b { font-size:15px; }
  .c2-ch-text span { font-size:13.5px; -webkit-line-clamp:3; }
  .c2-ch-go { height:32px; padding:0 13px; border-radius:16px; font-size:13.5px; }
  .c2-opt { min-height:44px; }

  .c2-shot { display:none; }

@media (max-width:520px) {

}
/* 手机横屏：三维区占大半屏高 */
@media (max-width:900px) and (orientation:landscape) { .c2-view { height:clamp(240px,74vh,420px); } }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }

/* 第三章：原页面元素放进统一外壳后的补充样式。外壳本身的样式在 shared/lab-shell/lab-shell.css。 */

/* 原页面的三维区铺满外壳三维区 */
html.lab-native .c2-native-stage {
  position:absolute !important; inset:0 !important; width:100% !important; height:100% !important;
  max-width:none !important; max-height:none !important; min-height:0 !important;
  margin:0 !important; border:0 !important; border-radius:0 !important; box-shadow:none !important;
}
/* 三维区统一底色（--stage-bg，见 lab-shell.css）：原页面的三维区本身铺底色，
   它与三维画布之间的各层容器一律透明——原来的渐变、网格、色调底都不再露出。
   three.js 画布带 data-engine 属性，用它找出“装着三维画布的那几层”。 */
html.lab-native .c2-view, html.lab-native .c2-native-stage { background:var(--stage-bg) !important; }
html.lab-native .c2-native-stage :has(canvas[data-engine]),
html.lab-native .c2-native-stage canvas[data-engine] { background:transparent !important; }

/* 三维区上方一排：模型选择 */
.c2-stage-top {
  flex:0 0 auto; display:flex; align-items:stretch; gap:8px; padding:8px 10px;
  border-bottom:1px solid var(--hair); background:var(--course-surface); overflow-x:auto; scrollbar-width:thin;
}
.c2-stage-top:empty, .c2-stage-top:not(:has(> :not([hidden]))) { display:none; }
.c2-stage-top > * { margin:0 !important; }

/* 面板里的原有控件：统一字体与圆角，去掉原来的卡片外框 */
html.lab-native .c2-panel :is(button, input, select) { font-family:inherit; }
html.lab-native .c2-panel [data-c2-adopted] { margin-left:0; margin-right:0; max-width:100%; }
html.lab-native .c2-group > [data-c2-adopted]:is(section, div, aside) { box-shadow:none; }
html.lab-native .c2-panel .c3-note { margin:0; color:var(--course-muted); font-size:14px; line-height:1.5; }

/* 停止按钮：始终醒目 */
html.lab-native .c2-panel .c3-stop { width:100%; }

/* 3-1：关节点动行在较矮窗口里收紧 */
@media (max-height:720px) {
  html.lab-native .c2-panel .joint-row { min-height:0 !important; padding-top:1px !important; padding-bottom:1px !important; }
  html.lab-native .c2-panel .constraint-cards button { padding-top:4px !important; padding-bottom:4px !important; }
}

/* ===== 统一控件样式：搬进面板和底栏的原控件，与第二章同一套外观 ===== */
html.lab-native :is(.c2-panel, .c2-strip) :is(button.primary, button.outline, button.text-button, .compare-buttons button, .path-buttons button, .target-buttons button, .teach-toolbar button, .challenge-actions button) {
  height:36px; padding:0 14px; border-radius:10px; font-size:14.5px; font-weight:600; white-space:nowrap;
  display:inline-flex; align-items:center; justify-content:center; gap:4px; margin:0; cursor:pointer;
  transition:background .15s, border-color .15s, color .15s, box-shadow .15s, transform .15s;
}
html.lab-native :is(.c2-panel, .c2-strip) button.primary {
  border:0; color:#fff; background:linear-gradient(135deg,#3a82e4,#1f5bbd); box-shadow:0 4px 12px rgba(36,103,201,.28);
}
html.lab-native :is(.c2-panel, .c2-strip) button.primary:hover:not(:disabled) { transform:translateY(-1px); }
html[data-theme="dark"].lab-native :is(.c2-panel, .c2-strip) button.primary { background:linear-gradient(135deg,#8abaff,#5f97ea); color:#0f1d2e; }
html.lab-native :is(.c2-panel, .c2-strip) button.outline {
  border:1px solid var(--hair); background:var(--course-surface); color:var(--course-ink); box-shadow:var(--shadow-sm);
}
html.lab-native :is(.c2-panel, .c2-strip) button.outline:hover:not(:disabled) { border-color:var(--course-accent); color:var(--course-accent); }
html.lab-native :is(.c2-panel, .c2-strip) button.text-button {
  height:30px; padding:0 10px; border:0; background:var(--surface-2); color:var(--course-accent); box-shadow:none; font-weight:600;
}
html.lab-native :is(.c2-panel, .c2-strip) button.text-button:hover:not(:disabled) { background:var(--blue-soft); }
html.lab-native :is(.c2-panel, .c2-strip) button:disabled { opacity:.45; cursor:not-allowed; transform:none; }
html.lab-native :is(.c2-panel, .c2-strip) :is(.compare-buttons, .path-buttons, .target-buttons, .teach-toolbar, .challenge-actions) {
  display:flex; flex-wrap:wrap; gap:6px; margin:0;
}

/* 停止：所有页面同一种红色按钮 */
html.lab-native :is(.c2-panel, .c2-strip) :is(button.stop, button.stop-button, .c3-stop) {
  height:36px; padding:0 14px; border-radius:10px; border:1px solid #f1b8b4; background:var(--bad-soft); color:var(--bad);
  font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:none; cursor:pointer;
}
html.lab-native :is(.c2-panel, .c2-strip) :is(button.stop, button.stop-button):hover { background:var(--bad); color:#fff; }
html.lab-native :is(.c2-panel, .c2-strip) :is(button.stop, button.stop-button) kbd {
  font:600 12px/1 var(--font-num); padding:3px 5px; border-radius:5px; border:1px solid currentColor; opacity:.7; background:none;
}
html[data-theme="dark"].lab-native :is(.c2-panel, .c2-strip) :is(button.stop, button.stop-button) { border-color:#6b3434; }

/* 滑轨：已走过的一段填主色（--p 由 chapter3-shell.js 跟随数值更新） */
html.lab-native :is(.c2-panel, .c2-strip) input[type="range"] {
  -webkit-appearance:none; appearance:none; height:22px; margin:0; background:transparent; cursor:pointer; --p:50%; min-width:0;
}
html.lab-native :is(.c2-panel, .c2-strip) input[type="range"]::-webkit-slider-runnable-track {
  height:6px; border-radius:3px; background:linear-gradient(to right, var(--course-accent) var(--p), var(--hair) var(--p));
}
html.lab-native :is(.c2-panel, .c2-strip) input[type="range"]::-moz-range-track { height:6px; border-radius:3px; background:var(--hair); }
html.lab-native :is(.c2-panel, .c2-strip) input[type="range"]::-moz-range-progress { height:6px; border-radius:3px; background:var(--course-accent); }
html.lab-native :is(.c2-panel, .c2-strip) input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance:none; width:16px; height:16px; margin-top:-5px; border-radius:50%;
  background:#fff; border:3px solid var(--course-accent); box-shadow:0 2px 5px rgba(18,44,78,.25);
}
html.lab-native :is(.c2-panel, .c2-strip) input[type="range"]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#fff; border:3px solid var(--course-accent); }

/* 输入框、下拉框、读数 */
html.lab-native :is(.c2-panel, .c2-strip) :is(select, input[type="number"], input[type="text"]) {
  height:32px; padding:0 8px; border-radius:9px; border:1px solid var(--hair); background:var(--course-surface); color:var(--course-ink); font-size:14.5px; min-width:0;
}
html.lab-native :is(.c2-panel, .c2-strip) :is(select, input[type="number"], input[type="text"]):focus { outline:none; border-color:var(--course-accent); box-shadow:0 0 0 3px var(--blue-soft); }
html.lab-native :is(.c2-panel, .c2-strip) input[type="checkbox"] { width:16px; height:16px; accent-color:var(--course-accent); }
html.lab-native :is(.c2-panel, .c2-strip) output { font-family:var(--font-num); font-weight:700; color:var(--course-accent); font-variant-numeric:tabular-nums; }

/* 小号原地切换（如“按住连续 / 单步点动”） */
html.lab-native :is(.c2-panel, .c2-strip) .segmented { display:flex; gap:3px; padding:3px; border-radius:10px; background:var(--surface-2); border:1px solid var(--hair); }
html.lab-native :is(.c2-panel, .c2-strip) .segmented button { flex:1; height:30px; padding:0 10px; border:0; border-radius:7px; background:none; color:var(--course-muted); font-size:14px; white-space:nowrap; cursor:pointer; }
html.lab-native :is(.c2-panel, .c2-strip) .segmented button.active { background:var(--course-surface); color:var(--course-accent); font-weight:700; box-shadow:0 1px 3px rgba(18,44,78,.14); }

/* 点动行（3-1 关节行；3-2 在底栏另有排法） */
html.lab-native .c2-panel .joint-rows { display:flex; flex-direction:column; gap:5px; }

  border-radius:10px !important; background:var(--surface-2) !important; border:1px solid transparent !important; box-shadow:none !important;
}

}

html.lab-native .c2-panel .joint-top { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--course-muted); }

/* 卡片式选择（约束连接、六轴卡片）：与挑战卡同一种卡片 */
html.lab-native .c2-panel :is(.constraint-cards, .axis-cards) button {
  border-radius:12px !important; border:1px solid var(--hair) !important; background:var(--course-surface) !important; box-shadow:var(--shadow-sm) !important; cursor:pointer;
}
html.lab-native .c2-panel :is(.constraint-cards, .axis-cards) button.active { border-color:var(--course-accent) !important; background:var(--blue-soft) !important; box-shadow:0 0 0 1px var(--course-accent) inset !important; }
html.lab-native .c2-panel .constraint-cards { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
html.lab-native .c2-panel .constraint-cards button { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:0 8px; padding:6px 9px; text-align:left; }
html.lab-native .c2-panel .constraint-cards b { grid-row:1 / span 2; font-size:20px; font-weight:800; color:var(--course-accent); }
html.lab-native .c2-panel .constraint-cards small { color:var(--course-muted); font-size:13px; }

/* 区间控件、目标点、障碍编辑 */
html.lab-native .c2-panel .range-control label { display:flex; justify-content:space-between; font-size:14.5px; }
html.lab-native .c2-panel .range-control input { width:100%; }
html.lab-native .c2-panel .range-control p { margin:0; font-size:14px; color:var(--course-muted); }
html.lab-native .c2-panel .target-inputs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
html.lab-native .c2-panel .target-inputs label { display:flex; align-items:center; gap:4px; font-weight:700; font-size:14px; color:var(--course-muted); }
html.lab-native .c2-panel .target-inputs input { width:100%; }
html.lab-native .c2-panel .target-panel { display:flex; flex-direction:column; gap:6px; }
html.lab-native .c2-panel :is(#targetInfo, #pathInfo) { margin:0; font-size:14px; color:var(--course-muted); }
html.lab-native .c2-panel .path-results { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:14px; }
html.lab-native .c2-panel .path-results span { padding:2px 8px; border-radius:8px; background:var(--surface-2); }
html.lab-native .c2-panel .path-controls { display:flex; flex-direction:column; gap:6px; }
html.lab-native .c2-panel .obstacle-editor { display:flex; flex-direction:column; gap:4px; }

html.lab-native .c2-panel .obstacle-editor label { display:grid; grid-template-columns:22px 1fr 44px; align-items:center; gap:6px; font-size:14px; font-weight:700; color:var(--course-muted); }

/* 8-1：三维区上方的六类危险选择条 */
.c8-hazards { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:6px; width:100%; }
.c8-hazards[hidden] { display:none; }
.c8-hazards button {
  display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:7px; align-items:center;
  min-width:0; height:auto; padding:6px 9px; margin:0; text-align:left; cursor:pointer;
  border-radius:12px; border:1px solid var(--hair); background:var(--course-surface); color:var(--course-ink);
  box-shadow:var(--shadow-sm); font:inherit; transition:border-color .15s, background .15s;
}
.c8-hazards button:hover { border-color:var(--course-accent); }
.c8-hazards button[aria-checked="true"] { border-color:var(--course-accent); background:var(--blue-soft); box-shadow:0 0 0 1px var(--course-accent) inset; }
.c8-hazards .c8-ico { grid-row:span 2; font-size:18px; line-height:1; }
.c8-hazards b { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.c8-hazards button[aria-checked="true"] b { color:var(--course-accent); }
.c8-dots { display:flex; gap:3px; font-style:normal; }
.c8-dots em { width:14px; height:4px; border-radius:2px; background:var(--hair); }
.c8-dots em.on { background:var(--warn); }
.c8-hazards button.ok .c8-dots em { background:var(--ok); }

/* 面板：当前危险卡 */
.c8-card { padding:11px 12px; border-radius:12px; background:var(--surface-2); border:1px solid var(--hair); }
.c8-card-head { display:flex; align-items:center; gap:8px; }
.c8-card-head .c8-ico { font-size:18px; }
.c8-card-head b { font-size:15px; }
.c8-tag { margin-left:auto; padding:2px 8px; border-radius:10px; font-size:12px; background:var(--hair); color:var(--course-muted); }
.c8-tag.mid { background:var(--warn-soft); color:var(--warn); }
.c8-tag.ok { background:var(--ok-soft); color:var(--ok); }
.c8-card p { margin:6px 0 0; font-size:13.5px; line-height:1.55; color:var(--course-ink); }
.c8-card .c8-do { display:flex; gap:8px; color:var(--course-muted); }
.c8-card .c8-do span { flex:none; padding:0 6px; border-radius:6px; font-size:12px; line-height:20px; background:var(--blue-soft); color:var(--course-accent); }
.c2-group .c2-row { margin-top:8px; }
.c2-group .c2-row .c2-btn { flex:1; }

/* 发现记录：六格 */
.c8-found { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
.c8-found span { padding:6px 4px; border-radius:9px; border:1px dashed var(--course-line); text-align:center; font-size:12.5px; color:var(--course-muted); }
.c8-found span.on { border:1px solid var(--ok-line); background:var(--ok-soft); color:var(--ok); font-weight:700; }

/* 现场运行状态 + 急停 */
.c8-run { display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:10px; align-items:center; padding:7px 12px; border-radius:12px; background:var(--surface-2); border:1px solid var(--hair); }
.c8-run i { grid-row:span 2; width:12px; height:12px; border-radius:50%; background:var(--course-muted); }
.c8-run.on i { background:var(--ok); box-shadow:0 0 0 4px var(--ok-soft); animation:c8-pulse 1.2s ease-in-out infinite; }
.c8-run.ready i { background:var(--course-accent); box-shadow:0 0 0 4px var(--blue-soft); }
.c8-run.off i { background:var(--bad); }
.c8-run b { font-size:14px; }
.c8-run span { font-size:12.5px; color:var(--course-muted); }
@keyframes c8-pulse { 50% { opacity:.45; } }
@media (prefers-reduced-motion: reduce) { .c8-run.on i { animation:none; } }
.c2-group .c2-row:has(> .c8-run) { margin-top:0; align-items:stretch; flex-wrap:nowrap; }
.c2-group .c2-row > .c8-run { flex:1; }
.c2-group .c2-row .c2-btn.c8-stop { flex:0 0 84px; height:auto; min-height:44px; font-size:15px; letter-spacing:2px; }
.c2-btn.c8-stop { border-color:#c2413b; background:#c2413b; color:#fff; font-weight:700; }
.c2-btn.c8-stop:hover:not(:disabled) { color:#fff; border-color:#c2413b; filter:brightness(1.08); }

/* 复位前核对 */
.c8-checks { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.c8-check { display:flex; flex-direction:column; gap:1px; padding:5px 10px; border-radius:10px; background:var(--surface-2); border:1px solid var(--hair); font-size:12.5px; color:var(--course-muted); }
.c8-check b { font-size:14px; color:var(--course-ink); }
.c8-check.ok { border-color:var(--ok-line); background:var(--ok-soft); }
.c8-check.ok b { color:var(--ok); }
.c8-check.no b { color:var(--warn); }

/* 未找到的危险：问号 */
.c8-hazards .c8-ico.q { display:grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--hair); color:var(--course-muted); font-size:12px; font-weight:800; }
.c8-hazards button:not(.found) b { color:var(--course-muted); font-weight:500; }
.c8-card.empty p { margin:0; color:var(--course-muted); }
.c8-card .c8-do.ev span { background:var(--ok-soft); color:var(--ok); }

/* 能量隔离三行 */
.c8-energy { display:grid; gap:6px; }
.c8-erow { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; padding:6px 10px; border-radius:12px; border:1px solid var(--hair); background:var(--surface-2); }
.c8-erow.no { border-color:color-mix(in srgb, var(--warn) 45%, var(--hair)); }
.c8-erow.ok { border-color:var(--ok-line); background:var(--ok-soft); }
.c8-eico { font-size:20px; line-height:1; }
.c8-einfo { display:flex; flex-direction:column; min-width:0; }
.c8-einfo b { font-size:14px; }
.c8-einfo span { font-size:12.5px; color:var(--warn); }
.c8-erow.ok .c8-einfo span { color:var(--ok); }
.c8-erow .c2-btn { min-width:84px; }

/* 复查进度：六格 */
.c8-steps { display:grid; grid-template-columns:repeat(6, 1fr); gap:5px; }
.c8-steps span { display:grid; place-items:center; height:30px; border-radius:9px; border:1px dashed var(--course-line); font-size:15px; opacity:.45; }
.c8-steps span.f { opacity:1; border:1px solid color-mix(in srgb, var(--warn) 55%, transparent); background:var(--warn-soft); }
.c8-steps span.mid { opacity:1; border:1px solid color-mix(in srgb, var(--course-accent) 55%, transparent); background:var(--blue-soft); }
.c8-steps span.ok { opacity:1; border:1px solid var(--ok-line); background:var(--ok-soft); }
.c8-check.no b { color:var(--warn); }

<script>/* 8-1 安全操作：现场暂停推演的状态模型（纯函数，三维场景和面板都只读它）。
 * 流程：巡查找出六处危险 → 急停 → 能量隔离（断电挂锁、泄压、吊物落地）→ 逐项处置并复查 → 撤锁送电、急停复位、单独启动。
 * 所有危险与处置均为课堂案例，不给通用安全距离，也不代表真实作业放行。
 */
(function (g) {
  'use strict';
  const hazards = [
    {id: 'electric', label: '临时用电', icon: '⚡',
      finding: '配电箱引出的电缆外皮破损，泡在积水里。',
      fix: '更换破损电缆，架空敷设',
      needs: 'power', evidence: '新电缆已架空，离开积水；绝缘外皮完好。'},
    {id: 'swing', label: '回转碰撞', icon: '🚜',
      finding: '人员通道穿过挖掘机回转范围。',
      fix: '设回转隔离围挡，人员通道改道',
      evidence: '围挡把回转范围圈起来，新通道绕开了它。'},
    {id: 'belt', label: '外露传动', icon: '⚙',
      finding: '钢筋加工机的皮带轮防护罩拆下没装回。',
      fix: '装回皮带防护罩',
      needs: 'power', evidence: '防护罩已装回并固定，手够不到皮带和带轮。'},
    {id: 'load', label: '悬吊物', icon: '🏗',
      finding: '塔吊吊着钢筋捆，下方就是人员通道。',
      fix: '吊物落在垫木上，拉警戒带',
      needs: 'load', evidence: '钢筋捆已平稳落在垫木上，下方区域已拉警戒。'},
    {id: 'opening', label: '楼面洞口', icon: '🕳',
      finding: '楼面预留洞口没有盖板和护栏。',
      fix: '盖上盖板，四周装防护栏杆',
      evidence: '盖板已固定，四周防护栏杆封闭。'},
    {id: 'pressure', label: '残余压力', icon: '💨',
      finding: '喷涂机已关，管路压力表仍有读数，接头在渗漏。',
      fix: '更换渗漏的管路接头',
      needs: 'pressure', evidence: '压力表回零后更换接头，复查无渗漏。'},
  ];
  const ids = hazards.map(h => h.id);
  const map = (v) => Object.fromEntries(ids.map(id => [id, v]));
  const byId = id => hazards.find(h => h.id === id);

  const initial = () => ({
    running: true, latched: false, armed: false, started: false,
    power: 'on', pressure: true, load: 'hung',
    found: map(false), fixed: map(false), verified: map(false),
    selected: null, message: '现场还在运行。先别动手，找出六处危险。', error: false, seq: 0,
  });

  const count = (s, k) => ids.filter(id => s[k][id]).length;
  const allVerified = s => ids.every(id => s.verified[id]);
  const energyLeft = s => (s.power === 'on' ? 1 : 0) + (s.pressure ? 1 : 0) + (s.load === 'hung' ? 1 : 0);

  function reduce(state, ev) {
    if (ev.type === 'restart-case') return initial();
    const s = JSON.parse(JSON.stringify(state));
    s.seq = (state.seq || 0) + 1; s.error = false; s.code = '';
    const ok = msg => { s.message = msg; return s; };
    const fail = (msg, code) => { s.message = msg; s.error = true; s.code = code || 'blocked'; return s; };
    const h = ev.id ? byId(ev.id) : null;

    switch (ev.type) {
      case 'select':
        if (!h) return s;
        s.selected = h.id;
        return ok(s.found[h.id] ? h.finding : '这处还没在巡查里找到。');
      case 'find':
        if (!h) return ok('这里没有发现问题，再看看别处。');
        s.selected = h.id;
        if (s.found[h.id]) return ok(h.finding);
        s.found[h.id] = true;
        return ok('找到了：' + h.finding);
      case 'estop':
        if (!s.running && s.latched) return ok('急停已经按下并锁住了。');
        s.running = false; s.latched = true; s.armed = false;
        return ok('急停按下：机械全部停住。但电、压力和吊物还在，要分别隔离。');
      case 'isolate': {
        if (s.running) return fail('设备还在运行：先按急停，再动手隔离。', 'running');
        if (ev.target === 'power') {
          if (s.power === 'locked') return ok('配电箱已经断电挂锁。');
          s.power = 'locked'; return ok('断开总闸，挂上个人锁和“禁止合闸”牌。');
        }
        if (ev.target === 'pressure') {
          if (!s.pressure) return ok('管路已经泄压，压力表为零。');
          if (s.power !== 'locked') return fail('先断电挂锁，防止喷涂机在泄压时被再次启动。', 'order');
          s.pressure = false; return ok('打开泄压阀，压力表指针回到零。');
        }
        if (ev.target === 'load') {
          if (s.load === 'down') return ok('钢筋捆已经落在垫木上。');
          s.load = 'down'; return ok('吊钩慢慢下放，钢筋捆平稳落在垫木上。');
        }
        return s;
      }
      case 'fix': {
        if (!h) return s;
        if (!s.found[h.id]) return fail('这处危险还没在巡查里找到。', 'notfound');
        if (s.running) return fail('设备还在运行，不能上去处置：先按急停。', 'running');
        if (h.needs === 'power' && s.power !== 'locked') return fail('电还没断：先到配电箱断电挂锁。', 'energy');
        if (h.needs === 'pressure' && s.pressure) return fail('管路还有压力，拆接头会喷出来：先泄压。', 'energy');
        if (h.needs === 'load' && s.load !== 'down') return fail('钢筋捆还吊在空中：先让吊物落地。', 'energy');
        if (s.fixed[h.id]) return ok(h.label + '已处置，去核对复查。');
        s.fixed[h.id] = true; s.verified[h.id] = false;
        return ok(h.fix + '。处置完了，还要复查。');
      }
      case 'verify':
        if (!h) return s;
        if (!s.fixed[h.id]) return fail('还没处置，不能只点“复查”把危险勾掉。', 'notfixed');
        s.verified[h.id] = true;
        return ok('复查通过：' + h.evidence);
      case 'unlock':
        if (s.power === 'on') return ok('电源本来就是通的。');
        if (!allVerified(s)) return fail('还有危险没复查，不能撤锁送电。', 'unverified');
        s.power = 'on'; return ok('确认人员撤离，本人取下自己的锁，合闸送电。');
      case 'reset':
        if (!s.latched) return ok(s.running ? '设备在运行，没有需要复位的急停。' : '急停已经复位。');
        if (!allVerified(s)) return fail('还有危险没复查，急停复位被拦下。', 'unverified');
        s.latched = false; s.armed = true; s.running = false;
        return ok('急停已复位：设备仍然静止，等单独的启动指令。');
      case 'start':
        if (s.latched) return fail('急停还锁着：先复位。', 'latched');
        if (!s.armed) return fail('还没复位，不能启动。', 'latched');
        if (s.power !== 'on') return fail('配电箱还挂着锁，没有送电。', 'power');
        if (s.running) return ok('现场已经在运行。');
        s.running = true; s.started = true;
        return ok('鸣笛示警后启动：现场按新通道恢复作业。');
      default:
        return s;
    }
  }

  const api = {hazards, ids, initial, reduce, count, allVerified, energyLeft};
  g.SafetyModel = api;
  if (typeof module !== 'undefined') module.exports = api;
})(typeof window === 'undefined' ? globalThis : window);

<script>/* 8-1：把状态模型和三维现场接起来，对外提供 window.SafetyLab（面板 stations.js 只通过它读写）。 */
(() => {
  'use strict';
  const M = window.SafetyModel, host = document.getElementById('site');
  let state = M.initial();
  const listeners = new Set();
  const scene = window.SiteScene.create(host);
  if (!scene.webgl) {
    const note = document.createElement('p'); note.className = 'c8-fallback';
    note.textContent = '这台设备打不开三维画面。可以在上方逐个点危险名称来巡查，右侧面板照常操作。';
    host.append(note);
  }

  function dispatch(ev) {
    state = M.reduce(state, ev);
    scene.update(state);
    listeners.forEach(fn => { try { fn(state, ev); } catch (err) { console.warn(err); } });
    return state;
  }

  // 三维里点到的东西：急停桩直接急停；危险设备算“找到”；空地给一句提示；点标签只是选中并近看
  scene.onPick = (id, fromLabel) => {
    if (id === 'estop') { dispatch({type: 'estop'}); return; }
    if (fromLabel) { dispatch({type: 'select', id}); scene.focus(id); return; }
    dispatch({type: 'find', id});
  };

  const theme = () => scene.theme?.(document.documentElement.dataset.theme === 'dark');
  theme();
  addEventListener('course-theme-change', () => setTimeout(theme));
  new MutationObserver(theme).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

  scene.update(state);
  window.SafetyLab = {
    model: M, scene,
    state: () => JSON.parse(JSON.stringify(state)),
    dispatch,
    onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    stage: () => scene.stats?.() || {webgl: false},
  };
})();
</script>

      const a = document.createElement('a'); a.href = url;
      a.download = `${cfg.task}-${cfg.stations[current]?.name || '三维'}-${two(stamp.getHours())}${two(stamp.getMinutes())}${two(stamp.getSeconds())}.png`;
      document.body.append(a); a.click(); a.remove();
      ctx?.feedback?.('三维截图已保存。想要更大的图，先点全屏再存。', 'ok');
    };
    shot.addEventListener('click', () => {
      shot.classList.add('busy');
      if (frame) frame.contentWindow?.postMessage({c2: 'cmd', op: 'capture'}, '*');
      else (window.StageTone?.capture?.(view) || Promise.resolve(null)).then(saveShot);
    });
    document.addEventListener('fullscreenchange', () => { syncFs(); relayout(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && stageBox.classList.contains('c2-full-fallback')) setFull(false); });
    syncFs();

    /* 操作提示：只出现一次，第一次拖动、滚轮或几秒后淡出 */
    let hintDone = false, hintTimer = 0;
    const dismissHint = () => { if (hintDone) return; hintDone = true; clearTimeout(hintTimer); hint.classList.add('gone'); setTimeout(() => { hint.hidden = true; }, 700); };
    for (const type of ['pointerdown', 'wheel']) view.addEventListener(type, dismissHint, {passive: true, capture: true});
    window.addEventListener('blur', () => { if (document.activeElement === frame) dismissHint(); }); // 第二章：在 iframe 里的第一次操作

    let current = -1, ctx = null, frame = null, cleanup = [], floorAll = () => {};
    const tabButtons = cfg.stations.map((s, i) => {
      const b = h('button', 'c2-station'); b.type = 'button'; b.setAttribute('role', 'tab');
      b.append(h('span', 'c2-num', String(i + 1)), h('span', 'c2-name', s.name), h('span', 'c2-check', '✓'));
      b.addEventListener('click', () => select(i));
      b.addEventListener('keydown', e => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault(); const j = (i + (e.key === 'ArrowRight' ? 1 : -1) + cfg.stations.length) % cfg.stations.length;
        select(j); tabButtons[j].focus();
      });
      tabs.append(b);
      return b;
    });
    const syncTabs = () => tabButtons.forEach((b, i) => {
      b.setAttribute('aria-selected', String(i === current)); b.tabIndex = i === current ? 0 : -1;
      b.classList.toggle('done', Boolean(progress[cfg.stations[i].id]));
