    const next = h('button', 'c2-btn c2-primary c2-next', '去下一站 →'); next.type = 'button';
    const credit = h('div', 'c2-credit'); credit.hidden = true;
    panel.append(head, body, credit);
    view.append(feedback);
    let toastTimer = 0;
    main.append(stageBox, panel);
    /* 原页面里暂时不用的控件停放处（仍在文档里，原有程序照常工作） */
    const parking = h('div', 'c2-parking'); parking.hidden = true;
    document.body.append(top, bar, main, parking);
    if (native) {
      loading.hidden = true;
      if (cfg.stage) { cfg.stage.classList.add('c2-native-stage'); view.prepend(cfg.stage); }
      if (cfg.stageTop) { const topRow = h('div', 'c2-stage-top'); topRow.append(...[].concat(cfg.stageTop).filter(Boolean)); stageBox.prepend(topRow); }
      if (cfg.redo === false) redo.hidden = true;
    }

    /* 全屏：整块三维区（三维视图 + 上方选择条 + 提示条）。进出全屏都补发 resize，Esc 退出。 */
    const full = () => document.fullscreenElement === stageBox || stageBox.classList.contains('c2-full-fallback');
    const relayout = () => { for (const t of [0, 80, 300]) setTimeout(() => { dispatchEvent(new Event('resize')); frame?.contentWindow?.postMessage({c2: 'cmd', op: 'resize'}, '*'); }, t); };
    const syncFs = () => {
      const on = full();
      stageBox.classList.toggle('c2-full', on);
      fs.setAttribute('aria-pressed', String(on));
      fs.setAttribute('aria-label', on ? '退出全屏' : '全屏查看三维模型');
      fs.title = on ? '退出全屏（Esc）' : '全屏';
    };
    const setFull = async on => {
      if (on === full()) return;
      if (document.fullscreenEnabled && stageBox.requestFullscreen) {
        try { if (on) await stageBox.requestFullscreen(); else await document.exitFullscreen(); return; } catch { /* 改用铺满窗口 */ }
      }
      stageBox.classList.toggle('c2-full-fallback', on); syncFs(); relayout();
    };
    fs.addEventListener('click', () => setFull(!full()));
    /* 全屏时停手 2.5 秒，右上角按钮自动隐去——整屏截图里只有模型和它自己的标注 */
    let idleTimer = 0;
    const wake = () => { stageBox.classList.remove('c2-idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => stageBox.classList.add('c2-idle'), 2500); };
    for (const name of ['pointermove', 'pointerdown', 'keydown']) stageBox.addEventListener(name, wake, {passive: true});
    wake();
    const saveShot = url => {
      shot.classList.remove('busy');
      if (!url) { ctx?.feedback?.('这个画面暂时存不了，试试全屏后用系统截图。', 'warn'); return; }
      const stamp = new Date(), two = n => String(n).padStart(2, '0');
      const a = document.createElement('a'); a.href = url;
      a.download = `${cfg.task}-${cfg.stations[current]?.name || '三维'}-${two(stamp.getHours())}${two(stamp.getMinutes())}${two(stamp.getSeconds())}.png`;
      document.body.append(a); a.click(); a.remove();
      ctx?.feedback?.('三维截图已保存。想要更大的图，先点全屏再存。', 'ok');
    };
    shot.addEventListener('click', () => {
      shot.classList.add('busy');
      if (frame) frame.contentWindow?.postMessage({c2: 'cmd', op: 'capture'}, '*');
      else (window.StageTone?.capture?.(view) || Promise.resolve(null)).then(saveShot);
    });
    document.addEventListener('fullscreenchange', () => { syncFs(); relayout(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && stageBox.classList.contains('c2-full-fallback')) setFull(false); });
    syncFs();

    /* 操作提示：只出现一次，第一次拖动、滚轮或几秒后淡出 */
    let hintDone = false, hintTimer = 0;
    const dismissHint = () => { if (hintDone) return; hintDone = true; clearTimeout(hintTimer); hint.classList.add('gone'); setTimeout(() => { hint.hidden = true; }, 700); };
    for (const type of ['pointerdown', 'wheel']) view.addEventListener(type, dismissHint, {passive: true, capture: true});
    window.addEventListener('blur', () => { if (document.activeElement === frame) dismissHint(); }); // 第二章：在 iframe 里的第一次操作

    let current = -1, ctx = null, frame = null, cleanup = [], floorAll = () => {};
    const tabButtons = cfg.stations.map((s, i) => {
      const b = h('button', 'c2-station'); b.type = 'button'; b.setAttribute('role', 'tab');
      b.append(h('span', 'c2-num', String(i + 1)), h('span', 'c2-name', s.name), h('span', 'c2-check', '✓'));
      b.addEventListener('click', () => select(i));
      b.addEventListener('keydown', e => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault(); const j = (i + (e.key === 'ArrowRight' ? 1 : -1) + cfg.stations.length) % cfg.stations.length;
        select(j); tabButtons[j].focus();
      });
      tabs.append(b);
      return b;
    });
    const syncTabs = () => tabButtons.forEach((b, i) => {
      b.setAttribute('aria-selected', String(i === current)); b.tabIndex = i === current ? 0 : -1;
      b.classList.toggle('done', Boolean(progress[cfg.stations[i].id]));
      if (i === current) reveal(tabs, b);
    });

    /* 嵌入模式：与原版实验页通信（只用 postMessage，file:// 打开也能用） */
    window.addEventListener('message', e => {
      const d = e.data;
      if (!d || d.c2 !== 'lab' || !frame || e.source !== frame.contentWindow) return;
      if (d.type === 'ready' || (d.type === 'state' && ctx && !ctx.lab.ready)) { loading.hidden = true; sendTheme(); ctx?._ready(); }
      if (d.type === 'state') ctx?._state(d.data);
      if (d.type === 'shot') saveShot(d.url);
    });
    // 主题和三维区底色一起传给原版实验页，嵌入的三维视图与外壳同一底色
    const sendTheme = () => frame?.contentWindow?.postMessage({c2: 'cmd', op: 'theme', value: window.CourseTheme?.get?.() || 'light', stage: stageTones()}, '*');
    window.addEventListener('course-theme-change', sendTheme);

    // 原页面的控件始终留在文档里（原程序可能随时读写它们），换工位时先放回停放处
    function parkAll() { for (const root of [body, readBox]) root.querySelectorAll('[data-c2-adopted]').forEach(n => parking.append(n)); }

    function select(i, fromHash, fromPage) {
      if (i === current) return;
      cleanup.forEach(f => f()); cleanup = [];
      current = i;
      const s = cfg.stations[i];
      if (!fromHash) history.replaceState(null, '', '#' + s.id);
      const ht = h('div', 'c2-head-row'), name = h('div', 'c2-head-name');
      name.append(h('span', 'c2-head-num', String(i + 1)), h('h2', '', s.name));
      ht.append(name, redo);
      head.replaceChildren(ht, h('p', '', s.lead || ''));
      parkAll();
      body.replaceChildren(); clearTimeout(toastTimer); feedback.textContent = ''; feedback.className = 'c2-feedback';
      transportBox.replaceChildren(); readBox.replaceChildren(); tools.replaceChildren(); card.hidden = true;
      if (!hintDone) {
        hint.textContent = s.hint ?? cfg.hint ?? '拖动旋转 · 滚轮缩放';
        hint.hidden = !hint.textContent;
        clearTimeout(hintTimer); if (!hint.hidden) hintTimer = setTimeout(dismissHint, 9000);
      }
      credit.hidden = true; credit.replaceChildren();
      if (native) {
        if (!fromPage) cfg.select?.(s.id);
      } else {
        frame?.remove();
        frame = h('iframe', 'c2-frame'); frame.title = s.name + '三维模型';
        frame.src = s.src; loading.hidden = false;
        view.prepend(frame);
      }
      ctx = makeContext(s, i);
      cfg.build?.(ctx, s);
      s.build?.(ctx, s);
      if (native) ctx._ready();
      syncTabs();
      // 原页面的渲染器按容器尺寸重新取景；布局稳定后再通知一次
      dispatchEvent(new Event('resize'));
      if (native) for (const t of [60, 300, 900]) setTimeout(() => { dispatchEvent(new Event('resize')); floorAll(); }, t);
    }
    redo.addEventListener('click', () => { const i = current; current = -1; cfg.reset?.(cfg.stations[i].id); select(i); });
    next.addEventListener('click', () => select(Math.min(current + 1, cfg.stations.length - 1)));

    function makeContext(s, index) {
      const stateFns = new Set(), readyFns = new Set();
      let latest = null, ready = false;
      const send = msg => frame?.contentWindow?.postMessage({c2: 'cmd', ...msg}, '*');
      const c = {
        h, fmt, station: s, index, body, native,
        /* —— 原模型 —— */
        lab: {
          click: (sel, i = 0) => send({op: 'click', sel, index: i}),
          clickText: (sel, text) => send({op: 'clickText', sel, text}),
          set: (sel, value) => send({op: 'set', sel, value}),
          call: (path, ...args) => send({op: 'call', path, args}),
          event: name => send({op: 'event', name}),
          get state() { return latest; },
          get ready() { return ready; },
          onState(fn) { stateFns.add(fn); if (latest) fn(latest); },
          onReady(fn) { readyFns.add(fn); if (ready) fn(); },
        },
        _state(data) { latest = data; stateFns.forEach(f => { try { f(data); } catch (err) { console.warn(err); } }); },
        _ready() { if (ready) return; ready = true; readyFns.forEach(f => f()); },
        /** 把原页面里的一个控件（或一组）搬进面板；换工位时自动放回停放处。 */
        adopt(nodes, into) {
          const list = (Array.isArray(nodes) ? nodes : [nodes]).map(n => (typeof n === 'string' ? document.querySelector(n) : n)).filter(Boolean);
          list.forEach(n => { n.dataset.c2Adopted = '1'; n.hidden = false; (into || body).append(n); });
          return list[0];
        },
        /* —— 反馈 —— */
        /** 反馈以提示条形式出现在三维区上方，几秒后自动收起，不挤占面板。 */
        feedback(text, kind = 'info', keep = false) {
          clearTimeout(toastTimer);
          feedback.replaceChildren();
          if (text) feedback.append(h('span', 'c2-toast-icon', kind === 'ok' ? '✓' : kind === 'warn' ? '!' : 'i'), h('span', 'c2-toast-text', text));
          feedback.className = 'c2-feedback ' + kind;
          if (!keep && text) toastTimer = setTimeout(() => { feedback.textContent = ''; feedback.className = 'c2-feedback'; }, kind === 'warn' ? 5000 : 7000);
        },
        showPart(name, desc) {
          if (!name) { card.hidden = true; return; }
          card.replaceChildren(h('strong', '', name), h('span', '', desc || ''));
          const x = h('button', 'c2-x', '×'); x.type = 'button'; x.setAttribute('aria-label', '关闭'); x.onclick = () => { card.hidden = true; };
          card.append(x); card.hidden = false;
        },
        /** 模型来源与许可：面板最底下的 ⓘ，点开才显示。lines 为文字数组，link = {href, label}。 */
        credit(lines, link) {
          lines = [].concat(lines || []).filter(Boolean);
          credit.replaceChildren(); credit.hidden = !lines.length;
          if (!lines.length) return;
          const btn = h('button', 'c2-credit-btn'); btn.type = 'button'; btn.setAttribute('aria-expanded', 'false');
          btn.append(h('i', '', 'i'), document.createTextNode('模型来源'));
          btn.title = lines.join('\n');
          const pop = h('div', 'c2-credit-pop'); pop.hidden = true; pop.id = 'c2-credit-' + s.id;
          btn.setAttribute('aria-controls', pop.id);
          for (const l of lines) pop.append(h('p', '', l));
          if (link?.href) { const a = h('a', '', (link.label || '许可证') + ' ↗'); a.href = link.href; a.target = '_blank'; a.rel = 'noopener'; pop.append(h('p')); pop.lastChild.append(a); }
          btn.addEventListener('click', () => { pop.hidden = !pop.hidden; btn.setAttribute('aria-expanded', String(!pop.hidden)); });
          credit.append(pop, btn);
        },
        /* —— 面板控件 —— */
        section(titleText, extra, into = body) {
          const sec = h('section', 'c2-group');
          if (titleText) { const t = h('h3', ''); t.append(h('span', 'c2-h3-text', titleText)); if (extra) t.append(extra); sec.append(t); }
          into.append(sec); return sec;
        },
        button(text, fn, opts = {}) {
          const b = h('button', 'c2-btn' + (opts.primary ? ' c2-primary' : '') + (opts.small ? ' c2-small' : ''), text);
          b.type = 'button'; b.addEventListener('click', fn); if (opts.title) b.title = opts.title; return b;
        },
        row(...items) { const r = h('div', 'c2-row'); r.append(...items); return r; },
        segmented(options, value, onChange, label) {
          const wrap = h('div', 'c2-seg'); wrap.setAttribute('role', 'radiogroup'); if (label) wrap.setAttribute('aria-label', label);
          let currentValue = value;
          const buttons = options.map(o => {
            const b = h('button', '', o.label); b.type = 'button'; b.setAttribute('role', 'radio'); if (o.title) b.title = o.title;
            b.addEventListener('click', () => { set(o.value); onChange(o.value); });
            wrap.append(b); return [o.value, b];
          });
          const set = v => { currentValue = v; buttons.forEach(([val, b]) => b.setAttribute('aria-checked', String(val === v))); };
          set(value);
          return {el: wrap, set, get: () => currentValue};
        },
        slider({label, min, max, step = 1, value, unit = '', format, onInput}) {
          const wrap = h('label', 'c2-slider');
          const t = h('span', 'c2-slider-top'), name = h('span', '', label), out = h('output', '');
          t.append(name, out);
          const input = h('input'); input.type = 'range'; Object.assign(input, {min, max, step, value});
          const show = v => {
            out.textContent = (format ? format(+v) : v) + (unit ? ' ' + unit : '');
            input.style.setProperty('--p', ((+v - min) / (max - min || 1) * 100).toFixed(1) + '%');
          };
          let touching = 0;
          input.addEventListener('input', () => { touching = performance.now(); show(input.value); onInput(+input.value); });
          show(value); wrap.append(t, input);
          return {
            el: wrap, input,
            /** 跟随模型同步显示；用户正在拖动时不打断。 */
            sync(v) { if (performance.now() - touching < 700 || !Number.isFinite(v)) return; if (Math.abs(+input.value - v) > 1e-9) { input.value = v; show(input.value); } },
            set(v) { input.value = v; show(v); }, get: () => +input.value,
          };
        },
        toggle(label, value, onChange) {
          const b = h('button', 'c2-switch'); b.type = 'button'; b.setAttribute('role', 'switch');
          b.append(h('span', 'c2-knob'), h('span', '', label));
          const set = v => b.setAttribute('aria-checked', String(Boolean(v)));
          b.addEventListener('click', () => { const v = b.getAttribute('aria-checked') !== 'true'; set(v); onChange(v); });
          set(value);
          return {el: b, set};
        },
        /** 部件快捷：点一下镜头飞过去。 */
        chips(items, onPick) {
          const wrap = h('div', 'c2-chips');
          const buttons = items.map(it => {
            const b = h('button', 'c2-chip', it.label); b.type = 'button';
            b.addEventListener('click', () => { buttons.forEach(x => x.setAttribute('aria-pressed', String(x === b))); onPick(it); });
            wrap.append(b); return b;
          });
          return {el: wrap, buttons, clear: () => buttons.forEach(x => x.setAttribute('aria-pressed', 'false'))};
        },
        /** 小问题：只用在“看过结果之后”。 */
        choice({prompt, options, answer, onRight, wrong}) {
          const box = h('div', 'c2-choice');
          if (prompt) box.append(h('p', 'c2-prompt', prompt));
          const row = h('div', 'c2-options');
          options.forEach((o, i) => {
            const b = h('button', 'c2-opt', o); b.type = 'button';
            b.addEventListener('click', () => {
              if (box.dataset.solved) return;
              if (i === answer) { b.classList.add('right'); box.dataset.solved = '1'; [...row.children].forEach(x => { x.disabled = x !== b; }); onRight?.(); }
              else { b.classList.add('wrong'); b.disabled = true; c.feedback(typeof wrong === 'function' ? wrong(i) : (wrong || '再看看模型，再选一次。'), 'warn'); }
            });
            row.append(b);
          });
          box.append(row);
          return box;
        },
        /** 先猜一个数，再让模型跑给你看。onGuess 返回 true/false/undefined。 */
        predict({prompt, unit, onGuess, inline}) {
          const box = h('div', 'c2-predict' + (inline ? ' c2-inline' : ''));
          box.append(h('p', 'c2-prompt', prompt));
          const r = h('div', 'c2-row'), input = h('input'); input.type = 'number'; input.inputMode = 'decimal'; input.setAttribute('aria-label', prompt);
          const go = c.button('试试看', () => {
            const v = parseFloat(input.value);
            if (!Number.isFinite(v)) { c.feedback('先填一个数。', 'warn'); return; }
            const ok = onGuess(v); input.classList.toggle('right', ok === true); input.classList.toggle('wrong', ok === false);
          }, {small: true});
          input.addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); });
          r.append(input, h('span', 'c2-unit', unit || ''), go); box.append(r);
          return {el: box, input};
        },
        /** 试一试：几张挑战卡，不分先后；模型状态满足条件就自动打勾。 */
        challenges(list, titleText = '试一试', into = body) {
          const counter = h('span', 'c2-count');
          const sec = c.section(titleText, counter, into);
          const bar = h('div', 'c2-progress'); const fill = h('span'); bar.append(fill);
          const grid = h('div', 'c2-challenges'); sec.append(bar, grid);
          const done = new Set();
          const items = list.map(ch => {
            const li = h('div', 'c2-challenge');
            const mark = h('span', 'c2-mark', ch.icon || '★');
            const txt = h('div', 'c2-ch-text');
            txt.append(h('b', '', ch.title));
            const sub = h('span', '', ch.hint || ''); txt.append(sub);
            li.append(mark, txt);
            if (ch.action) {
              const go = h('button', 'c2-ch-go', ch.action.label); go.type = 'button';
              go.addEventListener('click', e => { e.stopPropagation(); ch.action.fn(); });
              txt.append(go);
            }
            grid.append(li);
            return {ch, li, sub, mark};
          });
          const update = () => { counter.textContent = `${done.size} / ${list.length}`; fill.style.width = (done.size / list.length * 100) + '%'; };
          const complete = id => {
            if (done.has(id)) return;
            const it = items.find(x => x.ch.id === id); if (!it) return;
            done.add(id); it.li.classList.add('done'); it.mark.textContent = '✓';
            if (it.ch.result) c.feedback(it.ch.title + '：' + it.ch.result, 'ok');
            it.sub.textContent = '完成';
            update();
            if (done.size === list.length) {
              progress[s.id] = true; save(); syncTabs();
              setTimeout(() => {
                if (ctx !== c) return;
                c.feedback(current < cfg.stations.length - 1 ? '这一站的挑战都完成了！' : '本任务的挑战都完成了！还可以接着随便调一调。', 'ok', current < cfg.stations.length - 1);
                if (current < cfg.stations.length - 1) feedback.append(next);
              }, 2600);
            }
          };
          c.lab.onState(st => { for (const it of items) if (!done.has(it.ch.id)) { try { if (it.ch.check?.(st)) complete(it.ch.id); } catch {} } });
          update();
          return {complete, isDone: id => done.has(id), section: sec};
        },
        /* —— 三维区：工具、播放、读数 —— */
        view(text, fn, titleText) { const b = h('button', 'c2-tool', text); b.type = 'button'; if (titleText) b.title = titleText; b.addEventListener('click', fn); tools.append(b); return b; },
        /** 三维区左上角的一组单选（如 剖开 / 完整 / 去掉外壳）。 */
        toolSeg(options, value, onChange, label) {
          const seg = c.segmented(options, value, onChange, label); seg.el.classList.add('c2-toolseg'); tools.append(seg.el); return seg;
        },
        tool(text, onToggle, pressed = false) {
          const b = h('button', 'c2-tool', text); b.type = 'button'; b.setAttribute('aria-pressed', String(pressed));
          b.addEventListener('click', () => { const p = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(p)); onToggle(p); });
          tools.append(b); return {el: b, set: p => b.setAttribute('aria-pressed', String(Boolean(p)))};
        },
        transport({onToggle, onStep, onReset, stepText = '单步', extra, speeds, onSpeed, speed}) {
          const play = h('button', 'c2-play', ''); play.type = 'button';
          const set = p => { play.textContent = p ? '❚❚ 暂停' : '▶ 运行'; play.setAttribute('aria-pressed', String(Boolean(p))); };
          play.addEventListener('click', () => { const p = play.getAttribute('aria-pressed') !== 'true'; set(p); onToggle(p); });
          set(false); transportBox.append(play);
          if (onStep) { const st = h('button', 'c2-tool', stepText); st.type = 'button'; st.addEventListener('click', onStep); transportBox.append(st); }
          if (onReset) { const rs = h('button', 'c2-tool', '复位'); rs.type = 'button'; rs.addEventListener('click', onReset); transportBox.append(rs); }
          let speedSeg = null;
          if (speeds) { speedSeg = c.segmented(speeds.map(([v, l]) => ({value: v, label: l})), speed ?? speeds[0][0], onSpeed, '快慢'); speedSeg.el.classList.add('c2-speed'); transportBox.append(speedSeg.el); }
          if (extra) transportBox.append(extra);
          return {setPlaying: set, setSpeed: v => speedSeg?.set(v)};
        },
        /** 把原页面的元素放进三维区底部一栏。 */
        stripAdopt(nodes) { const list = (Array.isArray(nodes) ? nodes : [nodes]).map(n => (typeof n === 'string' ? document.querySelector(n) : n)).filter(Boolean); list.forEach(n => { n.dataset.c2Adopted = '1'; readBox.append(n); }); },
        readouts(defs) {
          const cells = {};
          readBox.replaceChildren();
          for (const d of defs) {
            const cell = h('div', 'c2-read'), v = h('b', '', '—'), u = h('small', '', d.unit || '');
            const val = h('span', 'c2-val'); val.append(v, u);
            cell.append(h('span', 'c2-read-label', d.label), val);
            readBox.append(cell); cells[d.id] = {v, u, cell};
          }
          return (id, value, unit) => {
            const x = cells[id]; if (!x) return;
            if (x.v.textContent !== String(value)) x.v.textContent = value;
            if (unit != null && x.u.textContent !== unit) x.u.textContent = unit;
          };
        },
        onCleanup(fn) { cleanup.push(fn); },
      };
      return c;
    }

    /* 字号下限与字体统一（原地模式）：搬进外壳的原页面文字——面板、三维区里的浮层与 SVG 标注。
       不小于 13px、面板段落不小于 14px（手机同此）；大屏（≥ 1680×860）上为 14.5 / 15.5px。SVG 标注按屏幕实际大小计，不小于 12px。
       原页面按 1600×900 整页缩放设计，常有 7～11px 的小字，这里统一放大到可读、可投影的字号；
       低价值的小字（英文小标、图号、重复的操作提示）由各任务 stations.css 直接隐藏。
       字体：原页面各用各的（Consolas、Segoe UI、Arial、自带等宽字体……），这里统一成外壳的两种——
       等宽字体写的数字、读数、编号换成 --font-num，其余换成正文字体。 */
    const big = matchMedia('(min-width:1680px) and (min-height:860px)');
    const MONO = /mono|consolas|cascadia|courier|menlo|sf mono/i, OURS = /^"?(PingFang SC|Microsoft YaHei|DIN Alternate)/i;
    const floorText = root => {
      if (!root?.querySelectorAll) return;
      const MIN_TEXT = big.matches ? 14.5 : 13, MIN_PARA = big.matches ? 15.5 : 14;
      for (const el of [root, ...root.querySelectorAll('*')]) {
        if (el.closest('.c2-parking, .c3-legacy, script, style')) continue;
        if (![...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) continue;
        const cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.position === 'absolute' && cs.clip !== 'auto' && /rect\(0/.test(cs.clip)) continue;
        if (!OURS.test(cs.fontFamily) && !el.dataset.c2Font) {
          el.dataset.c2Font = '1';
          el.style.setProperty('font-family', MONO.test(cs.fontFamily) ? 'var(--font-num)' : 'var(--font-ui)', 'important');
          if (MONO.test(cs.fontFamily)) el.style.fontVariantNumeric = 'tabular-nums';
        }
        const size = parseFloat(cs.fontSize);
        if (el instanceof SVGElement) {
          const m = el.getScreenCTM?.(), k = m ? Math.hypot(m.a, m.b) : 1;
          if (k > 0 && size * k < 12 - .05) el.style.fontSize = (12 / k).toFixed(2) + 'px';
          continue;
        }
        const min = el.tagName === 'P' && el.closest('.c2-panel') ? MIN_PARA : MIN_TEXT;
        if (size < min - .05) el.style.setProperty('font-size', min + 'px', 'important');
      }
    };
    if (native) {
      // 观察者回调在本轮脚本结束、画面重绘之前执行：原页面每帧重写的读数也不会先以小字闪现
      const mo = new MutationObserver(recs => {
        const seen = new Set();
        for (const r of recs) for (const n of r.addedNodes) {
          const el = n.nodeType === 1 ? n : n.parentElement;
          if (el && el.isConnected && !seen.has(el)) { seen.add(el); floorText(el); }
        }
      });
      for (const root of [panel, stageBox]) mo.observe(root, {childList: true, subtree: true});
      window.addEventListener('course-theme-change', () => floorText(stageBox));
      floorAll = () => { floorText(panel); floorText(stageBox); };
    }

    /* 原地模式：定时读原页面状态；原页面自己切换了活动时，工位条跟着变 */
    if (native) {
      setInterval(() => {
        let st = null;
        try { st = cfg.poll?.(); } catch (err) { /* 页面尚未就绪 */ }
        if (st && ctx) ctx._state(st);
        const pageStation = cfg.current?.();
        if (pageStation) { const j = cfg.stations.findIndex(s => s.id === pageStation); if (j >= 0 && j !== current) select(j, false, true); }
      }, 200);
    }

    const fromHash = () => {
      const id = location.hash.slice(1), i = cfg.stations.findIndex(s => s.id === id);
      return i >= 0 ? i : 0;
    };
    window.addEventListener('hashchange', () => select(fromHash(), true));
    select(fromHash(), true);
    window.c2Lab = {select, setFull, get ctx() { return ctx; }, get frame() { return frame; }, get current() { return current; }};
  }

  window.LabShell = {
    embedded: start,
    native: cfg => start({...cfg, native: true}),
  };
  window.C2Lab = {start};
})();

/* 原地模式的统一任务页外壳（全课程共用）：把原页面装进 lab-shell。
 * 原页面的全部元素先移入一个隐藏容器（仍在文档里，原有程序照常工作），
 * 各任务的 src/stations.js 再把需要的三维区和控件搬进外壳。
 * 章节标题和本章任务列表来自 shared/lab-shell/chapters.json，由 native-layout.mjs 写进 window.CHAPTER_LAYOUT。
 */
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const all = s => [...document.querySelectorAll(s)];

  // 外壳里的原有滑轨：已走过的一段用主色填充，跟随拖动和程序改值
  const fill = input => {
    const min = +input.min || 0, max = input.max === '' ? 100 : +input.max, v = +input.value;
    input.style.setProperty('--p', (((v - min) / ((max - min) || 1)) * 100).toFixed(1) + '%');
  };
  document.addEventListener('input', e => { if (e.target.matches?.('input[type="range"]')) fill(e.target); }, true);
  setInterval(() => document.querySelectorAll('.c2-panel input[type="range"], .c2-strip input[type="range"]').forEach(fill), 250);

  window.NativeShell = window.C3Shell = {
    $, all,
    start(cfg) {
      const layout = window.CHAPTER_LAYOUT || {}, chapter = layout.chapter || {};
      const legacy = document.createElement('div');
      legacy.className = 'c3-legacy'; legacy.hidden = true;
      [...document.body.children]
        .filter(e => !['SCRIPT', 'STYLE', 'DIALOG', 'TEMPLATE'].includes(e.tagName) && e.id !== 'toast' && !e.matches('.course-theme-toggle'))
        .forEach(e => legacy.append(e));
      document.body.append(legacy);
      document.documentElement.dataset.c3Task = layout.task || '';
      LabShell.native({
        chapter: {title: chapter.title, href: chapter.href},
        tasks: chapter.tasks || [], taskNav: layout.nav, hint: '拖动旋转 · 滚轮缩放', progressKey: layout.nav,
        ...cfg,
      });
    },
  };
})();

/* 任务 8-2 保养排查 —— 统一任务页外壳。四个工位：前两个（点检、润滑）结构对称，后两个（喷涂管路、砂浆管道清洗）结构对称：
 * 三维区上方选情境；三维区底部四格读数；面板依次是 维护流程（准备、隔离、能量确认、逐点检查、资料与材料、处理、复查/移交）→ 试一试 → 交接记录。
 * 所有操作都交给 window.MaintLab.dispatch（src/app.js），状态与存储（localStorage course-maintenance-v2）都在那里。
 */
(() => {
  'use strict';
  const S = window.NativeShell, lab = window.MaintLab, M = window.MaintModel;
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const btn = (cls, text, fn) => { const b = h('button', cls, text); b.type = 'button'; if (fn) b.addEventListener('click', fn); return b; };

  const SPEC = {
    engine: {
      normal: ['🛢', '完成一次班后点检', '选“班后点检”，走完流程再复查', '油位补到刻线之间，复查通过才算完成这一单。'],
      anomaly: ['💧', '发现渗油，停下移交', '选“底部渗油”，看过底部后移交', '有渗漏就不做常规保养，问题原样交给检修。'],
      early: ['🔥', '还烫就开冷却液盖？', '停机后不等冷却，直接点冷却液壶', '机体还烫时冷却系统带压，开盖会喷出热液——先等冷却。'],
      anomalyCases: ['leak', 'belt'], anomalyPoint: 'under',
    },
    excavator: {
      normal: ['🔧', '完成一次班后润滑', '选“班后润滑”，六个点都加注再复查', '每个铰点都有新脂挤出，复查通过才算完成。'],
      anomaly: ['💧', '油缸渗漏，停下移交', '选“动臂油缸渗漏”，看过油缸后移交', '渗漏要检修，加多少润滑脂都盖不住问题。'],
      early: ['⚠', '铲斗悬空就去加注？', '铲斗还没落地时点一个黄油嘴', '铲斗悬在空中，人不能进到工作装置下面——先落地。'],
      anomalyCases: ['seep', 'loose'], anomalyPoint: 'boomRod',
    },
  };

  /* 交接记录（四个工位共用一份） */
  let renderRecords = () => {};
  function recordsSection(c) {
    const count = h('span', 'c2-count');

    const list = h('ul', 'm82-records');
    const tools = h('div', 'm82-rec-tools');
    const bExport = btn('c2-btn c2-small', '导出交接卡', () => lab.exportRecord());
    const bClear = btn('c2-btn c2-small m82-clear', '清空全部记录', () => {
      if (!confirm('清空四个工位的全部处理与交接记录？')) return;
      lab.reset(); c.feedback('记录已清空，四个工位都回到开始。', 'info');
    });
    tools.append(bExport, bClear); gRec.append(list, tools);
    let last = '';
    renderRecords = s => {
      const all = s.records || [], k = JSON.stringify(all); if (k === last) return; last = k;
      count.textContent = `${all.filter(x => x.resolved).length} 复查 · ${all.filter(x => !x.resolved).length} 未解决`;
      list.replaceChildren(...(all.length ? all.slice().reverse().map(x => {
        const li = h('li', x.resolved ? 'ok' : 'open');
        li.append(h('span', 'm82-rec-st', M.STATIONS[x.station].label), h('span', 'm82-rec-case', M.label(M.STATIONS[x.station].cases, x.scenario)), h('b', '', x.resolved ? '已复查' : '未解决'));
        li.title = x.unresolved.join('；'); return li;
      }) : [h('li', 'm82-empty', '还没有记录。复查或移交后会出现在这里。')]));
      bExport.disabled = !all.length;
    };
  }

  const caseBar = h('div', 'm82-cases');
  caseBar.setAttribute('role', 'radiogroup'); caseBar.setAttribute('aria-label', '情境');
  let view = null;

  function buildStation(c) {
    const id = c.station.id, st = M.STATIONS[id], spec = SPEC[id];
    const act = ev => lab.dispatch(ev);

    /* 情境 */
    caseBar.replaceChildren(h('span', 'm82-cases-label', '情境'));
    const caseButtons = st.cases.map(([value, text]) => {
      const b = btn('m82-case', text, () => { if (lab.state().work[id].scenario !== value || closed()) act({type: 'case', value}); });
      b.setAttribute('role', 'radio'); b.dataset.value = value;
      if (value === 'unknown') b.classList.add('unk'); else if (value !== 'normal') b.classList.add('abn');
      caseBar.append(b); return b;
    });
    const closed = () => { const w = lab.state().work[id]; return w.verified || w.handoff; };

    /* 三维区底部读数（与 8-1 同一位置）：四格 */
    const read = c.readouts(id === 'engine'
      ? [{id: 'a', label: '发动机'}, {id: 'b', label: '机体温度', unit: '℃'}, {id: 'c', label: '电源'}, {id: 'd', label: '已检查'}]
      : [{id: 'a', label: '铲斗'}, {id: 'b', label: '液压残压', unit: 'bar'}, {id: 'c', label: '先导锁定'}, {id: 'd', label: '已加注'}]);

    /* 维护流程 */
    const gFlow = c.section('维护流程');
    const flow = h('ol', 'm82-flow'); gFlow.append(flow);
    const step = (text, type) => {
      const li = h('li', 'm82-step'), b = btn('m82-step-btn', null, type ? () => act({type}) : null);
      b.append(h('span', 'm82-dot'), h('span', 'm82-step-text', text)); li.append(b); flow.append(li); return {li, b};
    };
    const sPrep = step(st.steps.prepare, 'prepare');
    const sIso = step(st.steps.isolate, 'isolate');
    const sEnergy = step(st.steps.energy, 'energy');
    const sCheck = step(id === 'engine' ? '逐点检查（点模型上的编号）' : '逐个检查铰点（点模型上的编号）');
    sCheck.b.classList.add('static'); sCheck.b.disabled = true;
    const chips = h('div', 'm82-chips');
    const chipButtons = st.points.map(([p, name], i) => {
      const b = btn('m82-chip', null, () => { const w = lab.state().work[id]; if (w.checked[p] && id === 'excavator' && !w.done[p]) act({type: 'service', point: p}); else if (w.checked[p]) lab.focus(p); else act({type: 'inspect', point: p}); });
      b.dataset.point = p; b.append(h('i', '', String(i + 1)), h('span', '', name)); chips.append(b); return b;
    });
    sCheck.li.append(chips);
    const sRead = step('核对型号与资料', 'read');
    const sMat = step(id === 'engine' ? '选机油' : '选润滑脂');
    sMat.b.classList.add('static'); sMat.b.disabled = true;
    const mats = h('div', 'm82-mats');
    const matButtons = st.materials.map(([value, text]) => { const b = btn('m82-mat' + (value === 'spec' ? ' ok' : ''), text, () => act({type: 'material', value})); b.setAttribute('role', 'radio'); b.dataset.value = value; mats.append(b); return b; });
    sMat.li.append(mats);
    const sService = step(st.service, 'service');
    const pct = h('b', 'm82-pct', '0%'); sService.b.append(pct);
    const bar = h('div', 'm82-bar'), fill = h('span'); bar.append(fill); sService.li.append(bar);
    if (id === 'excavator') sService.li.append(h('p', 'm82-tip', '检查过的黄油嘴再点一次就加注；也可以按这一步，按顺序加注下一个。'));
    const ends = h('li', 'm82-step m82-ends');
    ends.append(btn('c2-btn c2-primary', '复查', () => act({type: 'verify'})), btn('c2-btn m82-hand', '移交检修', () => act({type: 'handoff'})));
    flow.append(ends);
    const verdict = h('div', 'm82-verdict'); verdict.hidden = true; gFlow.append(verdict);

    /* 试一试 */
    const mine = (s, fn) => (s.records || []).some(r => r.station === id && fn(r));
    c.challenges([
      {id: 'normal', icon: spec.normal[0], title: spec.normal[1], hint: spec.normal[2], result: spec.normal[3],
        check: s => mine(s, r => r.scenario === 'normal' && r.resolved)},
      {id: 'anomaly', icon: spec.anomaly[0], title: spec.anomaly[1], hint: spec.anomaly[2], result: spec.anomaly[3],
        check: s => mine(s, r => spec.anomalyCases.includes(r.scenario) && !r.resolved && r.unresolved.some(u => !u.startsWith('未发现')))},
      {id: 'early', icon: spec.early[0], title: spec.early[1], hint: spec.early[2], result: spec.early[3],
        check: s => !!s.tried?.[id]?.early},
      {id: 'unknown', icon: '❓', title: '资料不明时不猜', hint: '选资料不明的情境，核对资料后移交', result: '查不到规格就不补加、不混用，把待确认事项交出去。',
        check: s => mine(s, r => r.scenario === 'unknown' && !r.resolved)},
    ]);

    recordsSection(c);

    c.view('全景', () => lab.frame());
    c.view('俯视', () => lab.top());

    let key = '';
    view = s => {
      const w = s.work[id], r = lab.readouts();
      const k = JSON.stringify([w, s.records, r.temp, r.pressure]);
      if (k === key) return; key = k;
      caseButtons.forEach(b => b.setAttribute('aria-checked', String(b.dataset.value === w.scenario)));
      const nPts = st.points.length, nC = st.points.filter(([p]) => w.checked[p]).length, nD = st.points.filter(([p]) => w.done[p]).length;
      if (id === 'engine') {
        read('a', w.prepared ? '已停机' : '运转中'); read('b', r.temp); read('c', w.isolated ? '断开·挂牌' : '接通'); read('d', nC + ' / ' + nPts);
      } else {
        read('a', w.prepared ? '已落地' : '悬空'); read('b', r.pressure); read('c', w.isolated ? '放下·挂牌' : '未锁定'); read('d', nD + ' / ' + nPts);
      }
      const mark = (s0, done) => s0.li.classList.toggle('done', Boolean(done));
      const nChecked = st.points.filter(([p]) => w.checked[p]).length;
      mark(sPrep, w.prepared); mark(sIso, w.isolated); mark(sEnergy, w.energy);
      mark(sCheck, nChecked === st.points.length); mark(sRead, w.read && w.scenario !== 'unknown');
      sRead.li.classList.toggle('bad', w.read && w.scenario === 'unknown');
      mark(sMat, w.material === 'spec' && w.read && w.scenario !== 'unknown');
      sMat.li.classList.toggle('bad', w.material !== 'spec');
      matButtons.forEach(b => b.setAttribute('aria-checked', String(b.dataset.value === w.material)));
      chipButtons.forEach(b => { const p = b.dataset.point, f = M.finding(id, w.scenario, p); b.dataset.state = w.done[p] ? 'done' : w.checked[p] ? (f.abnormal ? 'bad' : 'ok') : 'todo'; b.title = w.checked[p] ? f.text : '点一下检查'; });
      sCheck.li.classList.toggle('bad', M.abnormal(id, w).length > 0);

      fill.style.width = Math.round(w.progress * 100) + '%'; pct.textContent = Math.round(w.progress * 100) + '%';
      const order = [[sPrep, w.prepared], [sIso, w.isolated], [sEnergy, w.energy], [sCheck, nChecked === st.points.length], [sRead, w.read], [sService, w.progress >= 1]];
      const next = (w.verified || w.handoff) ? null : order.find(([, d]) => !d)?.[0];
      for (const [s0] of order) s0.li.classList.toggle('next', s0 === next);
      verdict.hidden = !(w.verified || w.handoff);
      verdict.className = 'm82-verdict ' + (w.verified ? 'ok' : 'warn');
      verdict.textContent = w.verified ? '✓ 复查通过，已记入交接记录' : '⇢ 已移交 · 未解决：' + w.unresolved.join('；');
      renderRecords(s);
    };

    const off = lab.onChange((s, ev) => {
      if (ev?.type === 'station' || ev?.type === 'look') return;

  }

  /* ===================== 清洗工位：喷涂管路、砂浆管道 ===================== */
  const FLUSH = {
    spray: {
      read: [{id: 'a', label: '喷涂泵'}, {id: 'b', label: '压力表', unit: '格·示意'}, {id: 'c', label: '样杯'}, {id: 'd', label: '已洗件'}],
      cards: [
        {id: 'cup', icon: '🥛', title: '样杯出液变清', hint: '冲洗时盯着样杯，变清了再停泵', result: '出液从涂料色变清，说明管里的残漆冲出来了。',
          check: s => { const w = s.work.spray; return w.flushed && !w.flushing && w.rinse >= M.SPRAY.clear; }},
        {id: 'zero', icon: '⚠', title: '压力回零再拆枪', hint: '压力表没回零时点一下喷嘴', result: '带压拆枪，涂料会射进皮肤造成高压注射伤——先锁枪泄压。',
          check: s => !!s.tried?.spray?.early},
        {id: 'filter', icon: '🔍', title: '找出堵住的滤网', hint: '选“喷幅变窄”，冲洗后拆开看', result: '残漆干结在枪内滤网上，喷幅就变窄；拆洗通透后恢复。',
          check: s => !!s.tried?.spray?.found},
        {id: 'oil', icon: '🧪', title: '油性涂料选对清洗液', hint: '选“油性涂料”，洗完通过复查', result: '油性涂料要用配套溶剂；水性涂料用清水。以说明书为准。',
          check: s => (s.records || []).some(r => r.station === 'spray' && r.scenario === 'oil' && r.resolved)},
      ],
    },
    mortar: {
      read: [{id: 'a', label: '砂浆泵'}, {id: 'b', label: '压力表', unit: '格·示意'}, {id: 'c', label: '停泵计时', unit: '秒·示意'}, {id: 'd', label: '输浆管'}],
      cards: [
        {id: 'ball', icon: '⏱', title: '初凝前推出清洗球', hint: '停泵后抓紧，一次把球推出来', result: '趁残浆还软，清洗球一次就把整条管推干净。',
          check: s => { const w = s.work.mortar; return w.ball === 'out' && !w.stuckOnce; }},
        {id: 'jam', icon: '🔨', title: '找出堵管段', hint: '选“午休忘洗已结块”，泄压后拆管', result: '压力表异常升高、管子发硬的那段就是堵段；泄压后分段拆开、敲击疏通。',
          check: s => !!s.tried?.mortar?.found},
        {id: 'person', icon: '🚫', title: '出口不对人', hint: '出口对着旁边的人去推球', result: '推球时余浆和球会猛地冲出，出口只能对准桶。',
          check: s => !!s.tried?.mortar?.person},
        {id: 'tank', icon: '🪣', title: '废水进沉淀桶', hint: '出口对准沉淀桶，把球推出来', result: '废水进沉淀桶沉淀，清水回用、沉渣按现场要求处理，不进下水口。',
          check: s => { const w = s.work.mortar; return w.ball === 'out' && w.aim === 'tank'; }},
      ],
    },
  };

  function buildFlush(c) {
    const id = c.station.id, st = M.STATIONS[id], spec = FLUSH[id];
    const act = ev => lab.dispatch(ev);
    const ws = () => lab.state().work[id];
    const closed = () => { const w = ws(); return w.verified || w.handoff; };

    caseBar.replaceChildren(h('span', 'm82-cases-label', '情境'));
    const caseButtons = st.cases.map(([value, text], i) => {
      const b = btn('m82-case' + (i ? ' abn' : ''), text, () => { if (ws().scenario !== value || closed()) act({type: 'case', value}); });
      b.setAttribute('role', 'radio'); b.dataset.value = value; caseBar.append(b); return b;
    });
    const read = c.readouts(spec.read);

    const gFlow = c.section('维护流程');
    const flow = h('ol', 'm82-flow'); gFlow.append(flow);
    const step = (text, type) => {
      const li = h('li', 'm82-step'), b = btn('m82-step-btn', null, type ? () => act({type}) : null);
      const t = h('span', 'm82-step-text', text);
      b.append(h('span', 'm82-dot'), t); li.append(b); flow.append(li);
      if (!type) { b.classList.add('static'); b.disabled = true; }
      return {li, b, t};
    };
    const chipRow = (s0, list, onClick, cls = 'm82-mat') => {
      const row = h('div', 'm82-mats');
      const items = list.map(([value, text]) => { const b = btn(cls, text, () => onClick(value)); b.setAttribute('role', 'radio'); b.dataset.value = value; row.append(b); return b; });
      s0.li.append(row); return items;
    };
    const sPrep = step(st.steps.prepare, 'prepare');
    const sIso = step(st.steps.isolate, 'isolate');
    const sEnergy = step(st.steps.energy, 'energy');
    const ui = {};
    if (id === 'spray') {
      ui.liquid = step('选清洗液');
      ui.liquids = chipRow(ui.liquid, st.liquids, value => act({type: 'liquid', value}));
      ui.suction = step('吸料管移到清洗桶', 'suction');
      ui.flush = step('低压循环冲洗', 'flush');
      const cup = h('div', 'm82-cup'); ui.cupDot = h('i'); ui.cupText = h('span', '', '样杯'); ui.cupBar = h('div', 'm82-bar'); ui.cupFill = h('span'); ui.cupBar.append(ui.cupFill);
      cup.append(ui.cupDot, ui.cupText); ui.flush.li.append(cup, ui.cupBar);
      ui.parts = step('拆洗喷嘴和滤网（每件点两次）');
      const chips = h('div', 'm82-chips');
      ui.partChips = st.points.map(([p, name], i) => { const b = btn('m82-chip', null, () => act({type: 'part', point: p})); b.dataset.point = p; b.append(h('i', '', String(i + 1)), h('span', '', name)); chips.append(b); return b; });
      ui.parts.li.append(chips);
      ui.store = step('装回后');
      ui.stores = chipRow(ui.store, st.stores, value => act({type: 'store', value}));
      ui.waste = step('废液倒入回收桶', 'waste');
    } else {
      ui.hopper = step('清水冲洗料斗', 'hopper');
      ui.aim = step('喷枪出口对准');
      ui.aims = chipRow(ui.aim, st.aims, value => act({type: 'aim', value}));
      ui.ball = step('塞清洗球，清水推过整条管', 'ball');
      const chips = h('div', 'm82-chips m82-segs');
      ui.segChips = [0, 1, 2, 3].map(i => {
        const b = btn('m82-chip m82-seg', null, () => act({type: 'segment', seg: i}));
        const bar = h('em'); b.append(h('i', '', String(i + 1)), h('span', '', ''), bar); b._bar = bar; chips.append(b); return b;
      });
      ui.ball.li.append(chips);
      ui.segTip = h('p', 'm82-tip', '堵管时：泄压后点管段——拆开管卡 → 敲击疏通 → 装回。条色是残浆变硬程度（示意）。'); ui.ball.li.append(ui.segTip);
      ui.nozzle = step('拆洗喷枪喷嘴', 'nozzle');
      ui.drain = step('放空存水（冬季必做）', 'drain');
    }
    const ends = h('li', 'm82-step m82-ends');
    ends.append(btn('c2-btn c2-primary', '复查', () => act({type: 'verify'})), btn('c2-btn m82-hand', '移交检修', () => act({type: 'handoff'})));
    flow.append(ends);
    const verdict = h('div', 'm82-verdict'); verdict.hidden = true; gFlow.append(verdict);
    gFlow.append(h('p', 'm82-note', '计时、压力（格）和颜色都是课堂示意。清洗介质与顺序以设备与材料说明书为准。'));

    c.challenges(spec.cards);
    recordsSection(c);
    c.view('全景', () => lab.frame());
    c.view('俯视', () => lab.top());

    let key = '';
    view = s => {
      const w = s.work[id], r = lab.readouts();
      const k = JSON.stringify([w, s.records, r.sprayPressure, r.mortarPressure]);
      if (k === key) return; key = k;
      caseButtons.forEach(b => b.setAttribute('aria-checked', String(b.dataset.value === w.scenario)));
      const mark = (s0, d) => s0.li.classList.toggle('done', Boolean(d));
      mark(sPrep, w.prepared); mark(sIso, w.isolated); mark(sEnergy, w.energy);
      let order;
      if (id === 'spray') {
        const need = M.SPRAY.liquid[w.scenario];
        read('a', w.flushing ? '冲洗中' : w.prepared ? '已停止' : '喷涂中'); read('b', r.sprayPressure);
        read('c', w.flushed || w.flushing ? M.rinseLook(w.rinse) : '—'); read('d', st.points.filter(([p]) => w.done[p]).length + ' / ' + st.points.length);
        ui.liquid.t.textContent = '选清洗液（本单：' + M.SPRAY.paint[w.scenario] + '涂料）';
        ui.liquids.forEach(b => b.setAttribute('aria-checked', String(b.dataset.value === w.liquid)));
        ui.liquids.forEach(b => b.classList.toggle('ok', b.dataset.value === need));
        mark(ui.liquid, w.liquid === need); ui.liquid.li.classList.toggle('bad', !!w.liquid && w.liquid !== need);
        mark(ui.suction, w.suction === 'clean');
        ui.flush.t.textContent = w.flushing ? '冲洗中……够清了就按这里停泵' : w.flushed ? '低压循环冲洗（可以再冲一次）' : '低压循环冲洗';
        ui.flush.li.classList.toggle('running', w.flushing);
        mark(ui.flush, w.flushed && !w.flushing && w.rinse >= M.SPRAY.clear);
        ui.cupText.textContent = '样杯：' + (w.flushed || w.flushing ? M.rinseLook(w.rinse) : '还没接样');
        ui.cupFill.style.width = Math.round(w.rinse * 100) + '%';
        ui.cupDot.dataset.k = w.rinse >= M.SPRAY.clear ? 'clear' : w.rinse >= .25 ? 'mid' : 'paint';
        ui.cupDot.dataset.paint = w.scenario === 'oil' ? 'oil' : 'water';
        ui.partChips.forEach(b => { const p = b.dataset.point, f = M.finding('spray', w.scenario, p); b.dataset.state = w.done[p] ? 'done' : w.checked[p] ? (f.abnormal ? 'bad' : 'ok') : 'todo'; b.title = w.checked[p] ? f.text : '点一下拆下查看'; });
        mark(ui.parts, w.progress >= 1);
        ui.stores.forEach(b => { b.setAttribute('aria-checked', String(b.dataset.value === w.store)); b.classList.add('ok'); });
        mark(ui.store, !!w.store); mark(ui.waste, w.waste);
        const past = w.flushing || w.flushed;           // 冲洗时摘牌送电；停泵后要重新断电、泄压
        order = [[sPrep, w.prepared], [sIso, w.isolated || past], [sEnergy, w.energy || past], [ui.liquid, w.liquid === need], [ui.suction, w.suction === 'clean'],
          [ui.flush, w.flushed && !w.flushing], [sIso, w.isolated], [sEnergy, w.energy], [ui.parts, w.progress >= 1], [ui.store, !!w.store], [ui.waste, w.waste]];
      } else {
        const jam = M.blocked(w);
        read('a', w.ball === 'stuck' && w.pressure > 6 ? '憋压' : w.prepared ? '已停止' : '运转中'); read('b', r.mortarPressure);
        read('c', w.prepared ? Math.round(w.idle) : '—');
        read('d', w.ball === 'out' ? '已冲净' : (jam.length && (w.ball === 'stuck' || w.segs.some(g => g.open))) ? '堵 ' + jam.length + ' 段' : jam.length ? '发硬' : '有残浆');
        mark(ui.hopper, w.hopper);
        ui.aims.forEach(b => { b.setAttribute('aria-checked', String(b.dataset.value === w.aim)); b.classList.toggle('ok', b.dataset.value === 'tank'); });
        mark(ui.aim, w.aim === 'tank'); ui.aim.li.classList.toggle('bad', !!w.aim && w.aim !== 'tank');
        mark(ui.ball, w.ball === 'out'); ui.ball.li.classList.toggle('bad', w.ball === 'stuck');
        ui.segChips.forEach((b, i) => {
          const g = w.segs[i], hard = !g.clear && g.set >= 1;
          b.dataset.state = g.clear ? 'ok' : (g.open && hard) ? 'bad' : g.open ? 'done' : 'todo';
          b._bar.style.setProperty('--k', g.clear ? 0 : g.set.toFixed(2));
          b.title = g.clear ? '清水' : g.open ? (hard ? '已拆开：硬结，点一下敲击疏通' : '已拆开：没堵，点一下装回') : '残浆变硬程度（课堂示意）';
          b.querySelector('span').textContent = g.open ? '拆开' : g.clear ? '清水' : '段';
        });
        ui.segTip.hidden = !(w.ball === 'stuck' || w.segs.some(g => g.open));
        mark(ui.nozzle, w.nozzle); mark(ui.drain, w.drained);
        ui.drain.li.classList.toggle('need', w.scenario === 'winter' && !w.drained);
        const past = w.ball === 'out';
        order = [[sPrep, w.prepared], [sIso, w.isolated || past], [sEnergy, w.energy || past], [ui.hopper, w.hopper], [ui.aim, w.aim === 'tank'], [ui.ball, w.ball === 'out'],
          [sIso, w.isolated], [sEnergy, w.energy], [ui.nozzle, w.nozzle], ...(w.scenario === 'winter' ? [[ui.drain, w.drained]] : [])];
      }
      const next = (w.verified || w.handoff) ? null : order.find(([, d]) => !d)?.[0];
      for (const s0 of new Set(order.map(x => x[0]))) s0.li.classList.toggle('next', s0 === next);
      verdict.hidden = !(w.verified || w.handoff);
      verdict.className = 'm82-verdict ' + (w.verified ? 'ok' : 'warn');
      verdict.textContent = w.verified ? '✓ 复查通过，已记入交接记录' : '⇢ 已移交 · 未解决：' + w.unresolved.join('；');
      renderRecords(s);
    };
    view(lab.state());
    const off = lab.onChange((s, ev) => {
      if (ev?.type === 'station' || ev?.type === 'look') return;
      window.c2Lab?.ctx?._state(s);
      if (s.message && ev) c.feedback(s.message, s.error ? 'warn' : (ev.type === 'verify' ? 'ok' : 'info'));
    });
    c.onCleanup(off);
    c.lab.onState(s => view(s));
  }

  const STATIONS = M.IDS.map(id => {
    const flushing = M.STATIONS[id].kind === 'flush';
    return {id, name: M.STATIONS[id].label, lead: '', hint: flushing ? '拖动旋转 · 滚轮缩放 · 点标记操作' : '拖动旋转 · 滚轮缩放 · 点编号检查', build: flushing ? buildFlush : buildStation};
  });

  // shared/theme.js 会把主题按钮放进第一个 .course-nav；本页没有旧导航，按钮落在外壳页头
  S.start({
    task: '8-2', title: '保养排查',
    stage: document.getElementById('m82Stage'),
    stageTop: caseBar,
    stations: STATIONS,
    current: () => lab.state().station,
    select: id => { if (lab.state().station !== id) lab.dispatch({type: 'station', value: id}); },
    poll: () => lab.state(),
    reset: id => { const w = lab.state().work[id]; lab.dispatch({type: 'case', value: w.scenario}); },
  });
})();
</script></body></html>
