<script id="guide-data" type="application/json">{"id":"8-4","title":"职业健康与维护：看清污染路径，也核对收尾条件。","lead":"把打磨集尘、喷涂漆雾与材料接触分开看，再理解残余压力、清洗分支和未完成项的交接。","tags":["污染路径","残余压力","维护交接"],"topics":[{"title":"打磨与喷涂的污染路径","summary":"不同工艺的污染源、传播和接触环节不同，机器人仍能动作不代表健康控制仍然有效。","points":[["打磨集尘链","从磨头、吸尘管、滤芯到收集桶，关注堵塞、漏尘和密封等不同位置。"],["喷涂与材料","区分漆雾、通风条件和材料接触；不可见蒸气不能被理解为能凭肉眼判断的烟雾。"]],"question":"墙面外观已经达到本例目标，为什么还要检查排气和集尘状态？","hint":"工艺质量与污染控制是不同的判断。墙面外观不能证明管路、滤芯和密封仍然有效。"},{"title":"控制措施的互补","summary":"源头收集、环境与区域管理、材料条件和个人防护作用在不同环节，应对应工艺理解。","points":[["分清作用位置","比较哪些措施面向来源、哪些面向传播，哪些面向人员接触，避免把措施互相替代。"],["对应材料与工艺","仅戴口罩不会使空间污染物消失；喷涂材料和相关防护需依据具体危害与要求核对。"]],"question":"为什么导读把源头控制、区域管理和个人防护分开写？","hint":"它们关注的环节不同。分开记录更容易发现缺项，也避免以一种措施代替其余条件。"},{"title":"残余压力与清洗分支","summary":"泵停止与管路压力解除不是同一个状态，正常收尾、堵塞、泄漏和清洗条件不明需要分别阅读。","points":[["维护条件","喷嘴与管路维护前，需对应设备要求理解停用、隔离、压力解除和验证条件，不能把“关机”当作全部条件。"],["保留分支","正常收尾的清洗条件、堵塞或泄漏的待检修，以及清洗剂不明时的资料核对，不宜合成一条统一拆洗步骤。"]],"question":"同样是“收工”，为什么不能把所有清洗都画成断电后同一条顺序？","hint":"设备、材料与受控清洗所需条件可能不同，异常还会改变处理分支。本页不提供真实压力管路拆卸或统一清洗配方。"},{"title":"维护后复查与交接","summary":"把砂纸、软管、滤芯、收集桶、喷嘴与管路等对象的状态留下来，设备状态与完工质量分开记录。","points":[["记录部件状态","说明磨损、堵塞、污染、已处理结果与尚未确认的条件；具体清洗方法按设备和材料要求核对。"],["保留未完成项","处理以后仍需复查。交接卡保留责任和待办，不因点过维护按钮就只剩“维护完成”。"]],"question":"下一班准备时，为什么既要看完工质量，也要看设备维护记录？","hint":"成品结果与设备可继续使用的条件不同。交接需要同时知道已完成的工作、部件状态与待复查问题。"}],"comparison":{"title":"相同的收尾阶段，也有不同分支。","head":["情境","阅读时核对","交接中保留"],"rows":[["正常收尾","设备与材料对应的受控清洗和维护条件。","已完成项目与复查依据。"],["喷嘴堵塞","异常对象、维护条件与待检修事项。","堵塞状态、已有处理与后续责任。"],["管路泄漏","泄漏部位及对应设备的处置要求。","异常与专业检查结果，未解决项。"],["清洗条件不明","设备、材料与清洗剂说明是否明确。","待核对资料，不能猜定统一配方。"]]},"handoff":"将完工质量、污染控制、部件与压力条件、清洗状态、处理责任和复查分别记录，未确认问题继续留在待办中。","future":"打磨与喷涂的污染路径示意、残压条件和多分支收尾、部件维护与交接卡；当前尚无污染传播或压力清洗仿真。"}</script><script>(()=>{'use strict';
