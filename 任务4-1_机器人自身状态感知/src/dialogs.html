<dialog id="recordsDialog"><div class="dialog-heading"><div><p class="eyebrow">OBSERVATION NOTEBOOK</p><h2>我的观察记录</h2></div><button data-close="recordsDialog" aria-label="关闭记录">×</button></div><div class="notebook-toolbar"><label>姓名 / 小组<input id="studentName" placeholder="例如：第3组" maxlength="40"></label><button id="exportRecords">导出实验单</button><button id="exportCSV">导出 CSV</button><button id="clearRecords">清空记录</button></div><div id="notebook"></div></dialog>
<dialog id="csvDialog"><div class="dialog-heading"><div><p class="eyebrow">PHONE / MEASURED DATA</p><h2>用手机读数做一次对照</h2></div><button data-close="csvDialog" aria-label="关闭手机数据">×</button></div><p class="dialog-note">导入 phyphox 导出的加速度 CSV，核对时间、三轴和单位。手机和机器人可以使用同类传感原理；这里的手机数据单独显示，不控制机器人姿态。</p><input id="csvFile" type="file" accept=".csv,.tsv,.txt" aria-label="导入手机CSV"><div id="csvMapping" hidden><div class="mapping-grid"><label>时间列<select id="csvTime"></select></label><label>时间单位<select id="csvTimeUnit"><option value="1">秒 s</option><option value=".001">毫秒 ms</option></select></label><label>x 轴<select id="csvX"></select></label><label>y 轴<select id="csvY"></select></label><label>z 轴<select id="csvZ"></select></label><label>加速度单位<select id="csvAccelUnit"><option value="1">m/s²</option><option value="9.81">g</option></select></label></div><button id="applyCSV" class="primary">应用列映射</button></div><p id="csvStatus" role="status">尚未导入文件。缺失轴保持缺失，不填 0。</p><div id="importedChart" hidden><h3 id="importedName"></h3><svg id="csvSignal" aria-label="用户导入加速度时序图" role="img"></svg><div class="mapping-grid"><label>窗口起点 / s<input id="csvFrom" type="number" value="2" step=".1"></label><label>窗口终点 / s<input id="csvTo" type="number" value="8" step=".1"></label><label>记录轴<select id="csvAxis"><option value="0">x</option><option value="1">y</option><option value="2" selected>z</option></select></label><button id="saveCSV">保存导入窗口</button></div><p class="control-note">原始数据及采集条件以你的文件和实验记录为准。</p></div></dialog>
