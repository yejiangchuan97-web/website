 7px 7px 0}.reading-question>b{font-size:14px;color:var(--accent)}.reading-question>p{font-size:17px;margin-top:5px}.reading-question details{border-top:1px solid var(--line);padding-top:11px;margin-top:13px}.reading-question summary{cursor:pointer;color:var(--accent);font-size:14px;width:fit-content}.reading-question details p{color:var(--muted);margin-top:10px;font-size:15px}

<script id="guide-data" type="application/json">{"id":"1-1","title":"从施工到智能建造：先看场景，再谈分工。","lead":"围绕同一栋教学楼，认识不同施工阶段的作业对象，把“危、繁、脏、重”与具体动作和现场条件联系起来。","tags":["施工场景","技术用途","人机分工"],"topics":[{"title":"从施工阶段找作业对象","summary":"基础、主体、装修和运维面对的任务不同，先说清在哪里、做什么，再讨论使用哪类设备。","points":[["场景与对象","教学楼中的钢筋网、楼面、墙面和外立面，可分别对应加工绑扎、混凝土作业、打磨喷涂或巡检。"],["跨阶段理解","设备可以服务多个阶段，应用讨论应落到具体对象与作业条件，不能只按阶段给设备贴固定标签。"]],"question":"同一台设备出现在两个阶段，为什么不意味着它在做同一项作业？","hint":"看作用对象、工作装置和目标动作。例如运输材料与处理墙面关注不同结果，阶段名称不能代替任务说明。"},{"title":"用动作说明危繁脏重","summary":"同一作业可能同时具有多种痛点，判断应有可观察的依据。","points":[["找具体证据","外墙喷涂可讨论高处作业位置、喷雾接触与重复往返动作；不同观察指向不同问题。"],["允许多种痛点","“危、繁、脏、重”并非互斥选项。说明哪段动作、什么条件带来了困难，比只选一个标签更清楚。"]],"question":"为什么不能只写“喷涂很危险”，就认定所有问题都已经说明白？","hint":"还需指出人员位置、接触来源、重复动作和现场限制。证据不同，可能需要的设备、组织与人员措施也不同。"},{"title":"技术要对应具体问题","summary":"模型、测量、识别与执行承担不同作用，技术组合需要说明输入信息和实际用途。","points":[["分别说明用途","BIM可提供模型与空间信息；距离传感用于相应距离观测；视觉识别形成待复核线索；执行机构完成设定动作。"],["保留条件缺口","图纸轮廓、实时观测和现场结果不是同一件事。加入技术名称，并不能自动证明现场已经具备作业条件。"]],"question":"遇到墙距变化时，为什么“有模型”仍不能直接替代实时观测？","hint":"模型描述与现场当前状态可能不同。先明确需要知道什么，再讨论数据如何进入判断或控制。"},{"title":"分清替代动作与人员职责","summary":"机器人可承担适合的重复动作，作业面确认、材料准备、异常处理与质量复核仍需明确分工。","points":[["把职责写具体","在规则墙面喷涂的教学情境中，比较自动往复动作、供料、洞口确认、异常恢复与结果复核分别由谁负责。"],["条件改变后再判断","洞口密集、材料未就绪或通道被占，会改变方案条件。机械、机器人与人机协同的选择需要给出依据。"]],"question":"“自动往复喷涂”为什么不能直接推成“所有工作都交给机器人”？","hint":"规则动作只是任务的一部分。准备、监控、异常处理与质量确认仍需说明，未解决的问题应继续保留。"}],"comparison":{"title":"把技术名称，换成能说清的用途。","head":["技术或环节","本章关注的作用","仍需核对"],"rows":[["模型与BIM","提供构件、洞口与空间关系等信息。","模型与当前现场是否对应。"],["距离观测","获得相应位置的距离状态。","观测范围、有效性及如何参与判断。"],["视觉识别","提供目标或疑点线索。","识别结果与实际情况的复核。"],["机器人执行","完成设定的动作与路径。","准备条件、异常分工和完成效果。"]]},"handoff":"接着读任务1-2，从“现场需要做什么”转到“工作装置怎样作用于材料”；在任务1-3再区分感知、控制、执行与人的职责。","future":"教学楼阶段切换、人工与机器人作业对照、痛点多选及分工卡片；这些场景交互尚未实现。"}</script><script>(()=>{'use strict';
const data=JSON.parse(document.getElementById('guide-data').textContent),$=id=>document.getElementById(id),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routes=[["1-1", "建造方式", "任务1-1_从建造施工到智能建造/index.html"], ["1-2", "施工机械", "任务1-2_认识施工机械/index.html"], ["1-3", "施工机器人", "任务1-3_认识施工机器人/index.html"]];
$('chapter-nav').innerHTML='<a class="c1-home" href="../第一章_走进智能建造/index.html">← 第一章总览</a><div class="c1-links">'+routes.map(([id,name,url])=>`<a data-route="${id}" ${id===data.id?'aria-current="page"':''} href="../${url}">${id} ${name}</a>`).join('')+'</div><button id="c1-theme" type="button">切换浅色</button>';
$('c1-theme').onclick=()=>{const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';$('c1-theme').textContent=root.dataset.theme==='dark'?'切换浅色':'切换深色';};
$('eyebrow').textContent=`TASK ${data.id} / READING GUIDE`;$('guide-title').textContent=data.title;$('guide-lead').textContent=data.lead;$('focus-tags').innerHTML=data.tags.map(t=>`<span>${escape(t)}</span>`).join('');
$('topic-list').innerHTML=data.topics.map((t,i)=>`<button type="button" data-topic="${i}" aria-pressed="false" aria-controls="reading-detail"><span>0${i+1}</span>${escape(t.title)}</button>`).join('');
let selected=0;function select(i){const t=data.topics[i];if(!t)return;selected=i;$('topic-number').textContent=`TOPIC 0${i+1} / 0${data.topics.length}`;$('topic-title').textContent=t.title;$('topic-summary').textContent=t.summary;$('topic-evidence').innerHTML=t.points.map(([label,text])=>`<dt>${escape(label)}</dt><dd>${escape(text)}</dd>`).join('');$('topic-question').textContent=t.question;$('hint-text').textContent=t.hint;$('topic-hint').open=false;document.querySelectorAll('[data-topic]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.topic===i)));}
$('topic-list').onclick=e=>{const b=e.target.closest('[data-topic]');if(b)select(+b.dataset.topic);};$('topic-list').onkeydown=e=>{const b=e.target.closest('[data-topic]');if(!b)return;const i=+b.dataset.topic,n=data.topics.length,next=e.key==='ArrowDown'?(i+1)%n:e.key==='ArrowUp'?(i+n-1)%n:e.key==='Home'?0:e.key==='End'?n-1:null;if(next!==null){e.preventDefault();select(next);document.querySelector(`[data-topic="${next}"]`).focus();}};
$('comparison-title').textContent=data.comparison.title;$('comparison-table').innerHTML='<thead><tr>'+data.comparison.head.map(x=>`<th scope="col">${escape(x)}</th>`).join('')+'</tr></thead><tbody>'+data.comparison.rows.map(row=>'<tr>'+row.map((x,i)=>i===0?`<th scope="row">${escape(x)}</th>`:`<td data-label="${escape(data.comparison.head[i])}">${escape(x)}</td>`).join('')+'</tr>').join('')+'</tbody>';
$('handoff-text').textContent=data.handoff;$('future-text').textContent='后续交互规划：'+data.future;
const next=routes[(routes.findIndex(r=>r[0]===data.id)+1)%routes.length];$('next-guide').href=data.id==='1-3'?'../第一章_走进智能建造/index.html':'../'+next[2];$('next-guide').textContent=data.id==='1-3'?'回到本章总览 ↗':`接着读 ${next[0]} · ${next[1]} ↗`;
$('source-note').textContent=`依据任务${data.id}现有教学方案整理。当前为阅读导读，场景交互尚未制作；原教学方案保留在本任务 README。`;
select(0);window.Chapter1Guide={select,state:()=>({id:data.id,selected,topics:data.topics.length,mode:'reading',theme:document.documentElement.dataset.theme})};
})();
</script></body></html>
