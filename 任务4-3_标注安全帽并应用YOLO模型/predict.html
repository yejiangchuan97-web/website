ule,.tag,.image-badge){background:#20334a!important;color:#bad1eb!important;border-color:#3b526c!important}\nhtml[data-theme=dark] :is(.canvas-wrap,.helmet-image-stage){background:radial-gradient(ellipse at 50% 30%,#243b53,#142338)!important}\nhtml[data-theme=dark] :is(.panel-head,.control-section,.toolbar,.evaluation-control-grid>div+div,.ws-tool-rail){border-color:#344b66!important}\nhtml[data-theme=dark] :is(h1,h2,h3,.ws-heading h1,.ws-board .panel-head h2,.ws-knowledge-header h2,.ws-label-heading,.class-choice,.selected-meta,.stage-bottom strong,.range-row output,.metric strong,.code-box){color:#dce9f8!important}\nhtml[data-theme=dark] :is(p,.tiny,.muted,small,label,.switch-row,.range-row,.ws-heading p,.panel-head p,.ws-board .panel-head p,.ws-board .tiny,.ws-board .muted,.box-row small,.coordinate-grid label,.metric span,.metric small,.equations,.review-check,.feedback,.check-result,.evaluation-metric-note,.ws-knowledge-content .lesson-card p){color:#abc0d8!important}\nhtml[data-theme=dark] :is(.btn.primary,.btn.active,.class-choice.active,.box-row.active,.answer-option.selected){background:#2d5b8b!important;color:#fff!important;border-color:#78b9ff!important}\nhtml[data-theme=dark] :is(.btn:hover,.box-row:hover,.class-choice:hover){background:#29445f}\nhtml[data-theme=dark] :is(.class-choice span:first-child,.formula-cell,.metric,.evaluation-rule,.ws-export-shortcut){background:#263d55!important;color:#8ed9ce!important}\nhtml[data-theme=dark] .ws-knowledge-overlay{background:#020a16ac}\nhtml[data-theme=dark] #evaluation-zero-note{background:transparent!important;color:#edc58d!important}\nhtml[data-theme=dark] :is(.tag,.image-badge){box-shadow:none}\n\u003c/style>\u003c/head>\u003cbody data-lesson=\"annotation\">\u003cmain id=\"lesson-main\">\u003cdiv id=\"workbench\">\u003cdiv class=\"workspace\">\r\n \u003csection class=\"panel\" aria-label=\"二维标注实验台\">\r\n  \u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>原图标注台\u003c/h2>\u003cp>一个人头，一个框；框住可见头部及其所戴安全帽。\u003c/p>\u003c/div>\u003cspan class=\"tag\">HUMAN ANNOTATION\u003c/span>\u003c/div>\r\n  \u003cdiv class=\"image-picker\">\u003clabel for=\"imageSelect\" class=\"sr-only\">选择教学图片\u003c/label>\u003cselect id=\"imageSelect\">\u003coption value=\"clear\">练习 A · 五人清晰图 640 × 640\u003c/option>\u003coption value=\"wide\">练习 B · 宽幅场景 960 × 640\u003c/option>\u003coption value=\"occluded\">练习 C · 遮挡复核图 640 × 640\u003c/option>\u003c/select>\u003clabel class=\"btn small upload\" for=\"imageFile\">＋ 导入自己的图片\u003c/label>\u003cinput id=\"imageFile\" type=\"file\" accept=\"image/png,image/jpeg,image/webp\" hidden>\u003c/div>\r\n  \u003cdiv class=\"toolbar\">\u003cbutton class=\"btn small\" id=\"selectTool\" aria-pressed=\"true\">↖ 选择 / V\u003c/button>\u003cbutton class=\"btn small\" id=\"drawTool\" aria-pressed=\"false\">＋ 画框 / R\u003c/button>\u003clabel for=\"drawClass\" class=\"sr-only\">新框类别，切换后进入画框模式\u003c/label>\u003cselect id=\"drawClass\">\u003coption value=\"0\">新框 · 戴安全帽\u003c/option>\u003coption value=\"1\">新框 · 未戴安全帽\u003c/option>\u003coption value=\"review\">新框 · 待复核\u003c/option>\u003c/select>\u003cspan class=\"divider\">\u003c/span>\u003cbutton class=\"btn small\" id=\"undoBtn\" title=\"撤销 Ctrl+Z\">↶ 撤销\u003c/button>\u003cbutton class=\"btn small\" id=\"deleteBtn\" title=\"删除选中框 Delete\">删除\u003c/button>\u003cdiv class=\"toolbar-right\">\u003clabel for=\"zoom\" class=\"sr-only\">画布缩放\u003c/label>\u003cselect id=\"zoom\">\u003coption value=\"1\">适合窗口\u003c/option>\u003coption value=\"1.5\">放大 150%\u003c/option>\u003coption value=\"2\">放大 200%\u003c/option>\u003c/select>\u003clabel class=\"tiny\">\u003cinput id=\"referenceToggle\" type=\"checkbox\"> 参考框\u003c/label>\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"progress-strip\">\u003cdiv class=\"progress-dots\" id=\"progressDots\" aria-hidden=\"true\">\u003c/div>\u003cspan id=\"progressText\">已标注 1 个框 · 请补全其余目标\u003c/span>\u003c/div>\r\n  \u003cdiv class=\"canvas-wrap\" id=\"canvasWrap\">\u003cdiv class=\"canvas-inner\">\u003csvg id=\"annotationSvg\" class=\"annotation-svg\" tabindex=\"0\" role=\"application\" aria-label=\"原图标注画布。R 画框，V 选择，方向键移动选中框，Delete 删除。\">\u003c/svg>\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"stage-bottom\">\u003cspan id=\"imageMeta\">640 × 640 px · 原创教学绘图\u003c/span>\u003cstrong id=\"gestureHint\">拖动框移动 · 拖动角点调整 · 方向键微调\u003c/strong>\u003c/div>\r\n \u003c/section>\r\n \u003caside class=\"side-stack\">\r\n  \u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003ch2>标注检查器\u003c/h2>\u003cspan class=\"tag\" id=\"selectionTag\">BOX 01\u003c/span>\u003c/div>\u003cdiv class=\"control-section\">\u003ch3>\u003csmall>01\u003c/small>\u003cspan id=\"classHeading\">选中框的类别\u003c/span>\u003c/h3>\u003cdiv class=\"class-choices\">\u003cbutton class=\"class-choice\" data-cls=\"0\">\u003cspan>0\u003c/span>\u003cspan>戴安全帽\u003csmall>可见头部 + 所戴安全帽\u003c/small>\u003c/span>\u003ci>↵\u003c/i>\u003c/button>\u003cbutton class=\"class-choice\" data-cls=\"1\">\u003cspan>1\u003c/span>\u003cspan>未戴安全帽\u003csmall>可明确判断的可见头部\u003c/small>\u003c/span>\u003ci>↵\u003c/i>\u003c/button>\u003cbutton class=\"class-choice\" data-cls=\"review\">\u003cspan>?\u003c/span>\u003cspan>待复核\u003csmall>看不清状态，先保留问题\u003c/small>\u003c/span>\u003ci>↵\u003c/i>\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"control-section\">\u003ch3>\u003csmall>02\u003c/small>原图像素坐标\u003c/h3>\u003cdiv class=\"selected-meta\">\u003cspan id=\"boxSize\">160 × 160 px\u003c/span>\u003cspan>左上 → 右下\u003c/span>\u003c/div>\u003cdiv class=\"coordinate-grid\">\u003clabel>x₁\u003cinput id=\"x1\" type=\"number\" step=\"0.1\" min=\"0\" aria-label=\"框左侧 x1\">\u003c/label>\u003clabel>y₁\u003cinput id=\"y1\" type=\"number\" step=\"0.1\" min=\"0\" aria-label=\"框顶部 y1\">\u003c/label>\u003clabel>x₂\u003cinput id=\"x2\" type=\"number\" step=\"0.1\" min=\"0\" aria-label=\"框右侧 x2\">\u003c/label>\u003clabel>y₂\u003cinput id=\"y2\" type=\"number\" step=\"0.1\" min=\"0\" aria-label=\"框底部 y2\">\u003c/label>\u003c/div>\u003cp class=\"tiny muted\" style=\"margin-top:10px\">按原图尺寸计算；缩放显示不会改变标签。\u003c/p>\u003cdiv id=\"boxList\" class=\"box-list\" aria-label=\"标注框列表\">\u003c/div>\u003c/div>\u003c/section>\r\n  \u003csection class=\"panel\">\u003cdiv class=\"control-section\">\u003ch3>\u003csmall>03\u003c/small>检查，再导出\u003c/h3>\u003cbutton id=\"checkBtn\" class=\"btn primary\" style=\"width:100%\">检查这张图的标注 ↗\u003c/button>\u003cdiv class=\"check-result\" id=\"checkResult\" aria-live=\"polite\">先试着找全五个人头。参考框可用于核对，不会替你生成标签。\u003c/div>\u003clabel class=\"review-check\">\u003cinput id=\"reviewed\" type=\"checkbox\">\u003cspan>我已逐个检查目标、类别与边界，并确认没有未解决的头部。\u003c/span>\u003c/label>\u003cdiv class=\"export-stack\">\u003cbutton class=\"btn\" id=\"exportTraining\">导出图片与标签 ZIP\u003c/button>\u003cbutton class=\"btn quiet\" id=\"exportDraft\">保存复核草稿 ZIP\u003c/button>\u003c/div>\u003cp class=\"tiny muted\" id=\"exportNote\" style=\"margin-top:9px\">训练包包含同名 PNG 与五列 TXT；待复核整图只能保存草稿。\u003c/p>\u003c/div>\u003c/section>\r\n \u003c/aside>\r\n\u003c/div>\r\n\u003csection class=\"panel formula-panel\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>一只框，怎样变成一行标签？\u003c/h2>\u003cp>坐标从原图左上角开始。x 向右，y 向下。\u003c/p>\u003c/div>\u003cspan class=\"tag\">YOLO DETECT / 5 COLUMNS\u003c/span>\u003c/div>\u003cdiv class=\"panel-body\">\u003cdiv>\u003cdiv class=\"code-box\" id=\"yoloLine\">0 0.375000 0.250000 0.250000 0.250000\u003c/div>\u003cdiv class=\"formula-grid\" id=\"formulaGrid\">\u003c/div>\u003cdiv class=\"equations\">\u003cspan>x中心 = (x₁ + x₂) ÷ 2 ÷ W\u003cbr>宽 = (x₂ − x₁) ÷ W\u003c/span>\u003cspan>y中心 = (y₁ + y₂) ÷ 2 ÷ H\u003cbr>高 = (y₂ − y₁) ÷ H\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"note\">类别编号从 0 开始；后四项为归一化的中心与宽高，范围在 0～1。训练标签没有置信度这一列。\u003c/div>\u003cp class=\"tiny muted\" id=\"formulaExplanation\" style=\"margin-top:14px\">\u003c/p>\u003cp class=\"tiny muted\" style=\"margin-top:12px\">切换宽幅图，观察同一主角的原始框坐标不变，而 x 中心与宽度随原图宽度变化。两张图各自保存你的当前操作。\u003c/p>\u003c/div>\u003c/div>\u003c/section>\r\n\u003csection class=\"lesson-cards\">\u003carticle class=\"lesson-card\">\u003cspan class=\"num\">POLICY / 01\u003c/span>\u003ch3>先统一“框什么”\u003c/h3>\u003cp>本练习把“头部含所戴帽”作为一个目标。戴帽与未戴帽使用同一种头部口径，不把整个人身子框进去。\u003c/p>\u003c/article>\u003carticle class=\"lesson-card\">\u003cspan class=\"num\">REVIEW / 02\u003c/span>\u003ch3>看不清，就留下问题\u003c/h3>\u003cp>遮挡、过小或画面模糊时，不把“无法判断”硬塞进未戴帽类。待复核是一种工作状态，不是第三个训练类别。\u003c/p>\u003c/article>\u003carticle class=\"lesson-card question\">\u003cspan class=\"num\">TRY IT / 03\u003c/span>\u003ch3>缩放到 200%，标签会改变吗？\u003c/h3>\u003cdiv class=\"answer-options\">\u003cbutton class=\"btn small\" data-answer=\"no\">不会改变\u003c/button>\u003cbutton class=\"btn small\" data-answer=\"yes\">坐标都变为两倍\u003c/button>\u003c/div>\u003cdiv id=\"quizFeedback\" class=\"feedback\" aria-live=\"polite\">试着缩放画布，再观察上方五列数字。\u003c/div>\u003c/article>\u003c/section>\r\n\u003cdiv class=\"next-lesson\">\u003cdiv>\u003cstrong>标注完成后，看看模型的输出。\u003c/strong>\u003cp>下一页使用独立的固定教学预测；不会读取或训练你在本页的图片。\u003c/p>\u003c/div>\u003ca class=\"btn primary\" href=\"predict.html\">进入预测实验 ↗\u003c/a>\u003c/div>\r\n\u003c/div>\u003c/main>\u003cdiv id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>/* Arrange each lesson inside the shared 16:9 teaching screen before it starts. */\r\n(() => {\r\n  const main = document.getElementById('lesson-main');\r\n  const workbench = document.getElementById('workbench');\r\n  if (!main || !workbench) return;\r\n  const lesson = document.body.dataset.lesson;\r\n  const titles = {\r\n    annotation: ['亲手画框，让图像成为数据。', '框住头部 → 指定类别 → 检查标签'],\r\n    predict: ['模型看到了什么？', '固定候选 → 调整阈值 → 比较保留结果'],\r\n    evaluate: ['一次判断，要经得起核对。', '对照真值 → 一对一匹配 → 统计误检与漏检']\r\n  };\r\n  const [title, subtitle] = titles[lesson] || titles.annotation;\r\n  const heading = document.createElement('header');\r\n  heading.className = 'ws-heading';\r\n  heading.innerHTML = `\u003cdiv>\u003ch1>${title}\u003c/h1>\u003cp>${subtitle}\u003c/p>\u003c/div>\u003cbutton type=\"button\" class=\"btn ws-knowledge-open\" aria-haspopup=\"dialog\" aria-controls=\"lesson-knowledge\" aria-expanded=\"false\">\u003cspan aria-hidden=\"true\">▤\u003c/span> 知识与练习 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>`;\r\n  main.prepend(heading);\r\n\r\n  const overlay = document.createElement('div');\r\n  overlay.className = 'ws-knowledge-overlay';\r\n  overlay.hidden = true;\r\n  overlay.innerHTML = '\u003csection class=\"ws-knowledge\" id=\"lesson-knowledge\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"knowledge-title\">\u003cheader class=\"ws-knowledge-header\">\u003cdiv>\u003cspan>LEARNING NOTES\u003c/span>\u003ch2 id=\"knowledge-title\">知识与练习\u003c/h2>\u003c/div>\u003cbutton type=\"button\" class=\"btn ws-knowledge-close\" aria-label=\"关闭知识与练习\">返回实验台 ×\u003c/button>\u003c/header>\u003cdiv class=\"ws-knowledge-content\">\u003c/div>\u003c/section>';\r\n  document.body.append(overlay);\r\n  const knowledge = overlay.querySelector('.ws-knowledge-content');\r\n  const workspace = workbench.querySelector('.workspace');\r\n  const originalRoot = workbench.querySelector('.helmet-main') || workbench;\r\n  const metrics = lesson === 'evaluate' ? document.getElementById('evaluation-metrics').closest('.lesson-section') : null;\r\n  const tools = document.createElement('div');\r\n  tools.className = 'ws-tool-rail';\r\n  const stagePanel = workspace.querySelector(':scope > .panel');\r\n  stagePanel.classList.add('ws-stage-panel');\r\n  stagePanel.append(tools);\r\n\r\n  if (lesson === 'annotation') {\r\n    tools.append(stagePanel.querySelector('.image-picker'), stagePanel.querySelector('.toolbar'), stagePanel.querySelector('.progress-strip'));\r\n    const labelHeading = document.createElement('h3');\r\n    labelHeading.className = 'ws-label-heading';\r\n    labelHeading.textContent = '当前 YOLO 标签';\r\n    tools.append(labelHeading, document.getElementById('yoloLine'));\r\n    const labelHelp = document.createElement('p');\r\n    labelHelp.className = 'tiny muted';\r\n    labelHelp.textContent = '选中或调整框，五列数字同步更新。';\r\n    tools.append(labelHelp);\r\n    const exportShortcut = document.createElement('button');\r\n    exportShortcut.type = 'button';\r\n    exportShortcut.className = 'btn ws-export-shortcut';\r\n    exportShortcut.textContent = '检查与导出 →';\r\n    exportShortcut.onclick = () => {\r\n      const target = document.getElementById('checkBtn');\r\n      target.scrollIntoView({block: 'center', behavior: 'smooth'});\r\n      target.focus({preventScroll: true});\r\n    };\r\n    tools.append(exportShortcut);\r\n  } else if (lesson === 'predict') {\r\n    tools.append(stagePanel.querySelector('.prediction-controls'), workspace.querySelector('.score-note'));\r\n  } else {\r\n    tools.append(originalRoot.querySelector('.evaluation-controls'), originalRoot.querySelector('.evaluation-rule'));\r\n    stagePanel.querySelector('.overlay-toolbar').classList.add('ws-overlay-toolbar');\r\n    metrics.classList.add('ws-metrics');\r\n    const explanations = document.createElement('section');\r\n    explanations.className = 'note';\r\n    explanations.setAttribute('aria-label', '指标说明');\r\n    const note = metrics.querySelector('.evaluation-metric-note:not([id])');\r\n    if (note) explanations.append(note);\r\n    knowledge.append(explanations);\r\n  }\r\n\r\n  // Move existing nodes, including their IDs, so all lesson logic keeps its targets.\r\n  for (const node of Array.from(originalRoot.children)) {\r\n    if (node !== workspace && node !== metrics) knowledge.append(node);\r\n  }\r\n  workbench.append(workspace);\r\n  if (metrics) workbench.append(metrics);\r\n  if (originalRoot !== workbench) originalRoot.remove();\r\n  workbench.classList.add('ws-board');\r\n  if (metrics) workbench.classList.add('ws-board-with-metrics');\r\n\r\n  const opener = heading.querySelector('.ws-knowledge-open');\r\n  const closer = overlay.querySelector('.ws-knowledge-close');\r\n  function setKnowledge(open) {\r\n    overlay.hidden = !open;\r\n    opener.setAttribute('aria-expanded', String(open));\r\n    main.inert = open;\r\n    if (open) closer.focus();\r\n    else opener.focus({preventScroll: true});\r\n  }\r\n  opener.addEventListener('click', () => setKnowledge(true));\r\n  closer.addEventListener('click', () => setKnowledge(false));\r\n  overlay.addEventListener('click', event => { if (event.target === overlay) setKnowledge(false); });\r\n  document.addEventListener('keydown', event => {\r\n    if (overlay.hidden) return;\r\n    if (event.key === 'Escape') {\r\n      event.preventDefault();\r\n      event.stopImmediatePropagation();\r\n      setKnowledge(false);\r\n    } else if (event.key === 'Tab') {\r\n      const focusable = Array.from(overlay.querySelectorAll('button, a[href], input, select, textarea, [tabindex]')).filter(element => !element.disabled && element.tabIndex >= 0 && element.getClientRects().length);\r\n      const first = focusable[0], last = focusable[focusable.length - 1];\r\n      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }\r\n      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }\r\n    }\r\n  }, true);\r\n  window.helmetKnowledge = {open: () => setKnowledge(true), close: () => { if (!overlay.hidden) setKnowledge(false); }};\r\n})();\r\n\nconst LESSON_DATA={\"clear\":{\"width\":640,\"height\":640,\"svg\":\"\u003csvg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"640\\\" viewBox=\\\"0 0 640 640\\\" role=\\\"img\\\" aria-labelledby=\\\"title desc\\\">\\r\\n\u003ctitle id=\\\"title\\\">安全帽标注教学施工场景 · 640 × 640\u003c/title>\u003cdesc id=\\\"desc\\\">教学绘制，非现场照片。蓝白色施工场景中有五名工人，其中三名戴安全帽、两名未戴安全帽。首位工人可见头部含帽的像素边界为（160，80）至（320，240）。\u003c/desc>\\r\\n\u003c!-- Original teaching vector illustration. No external images, fonts, or scripts. Bboxes are original-image pixels. -->\\r\\n\u003cdefs>\\r\\n\u003clinearGradient id=\\\"sky\\\" x2=\\\"0\\\" y2=\\\"1\\\">\u003cstop stop-col osition:absolute;left:137px;top:12px;min-height:24px;padding:3px 7px;font-size:9px}\r\n.ws-board .ws-metrics .evaluation-metrics{grid-column:2;grid-row:1;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;padding:0;min-height:0}\r\n.ws-board .ws-metrics .metric{padding:9px 12px;border-radius:8px;border-color:#d7e7f1;background:#f5faff;min-height:0}\r\n.ws-board .ws-metrics .metric>span{font-size:10px;line-height:1.4;color:#587998}\r\n.ws-board .ws-metrics .metric strong{font-size:24px;line-height:1.15;margin:5px 0 4px}\r\n.ws-board .ws-metrics .metric small{font-size:9px;line-height:1.4;color:#6c88a2;margin:0}\r\n.ws-board .ws-metrics .metric:nth-child(2){background:#fff7ed;border-color:#edddc4}\r\n.ws-board .ws-metrics .metric:nth-child(3){background:#eff9f6;border-color:#cde6dd}\r\n.ws-board .ws-metrics #evaluation-zero-note{position:absolute;left:12px;bottom:9px;max-width:230px;padding:0;font-size:8px;line-height:1.5;background:#fff;color:#83672c}\r\n.ws-knowledge-overlay{position:fixed;inset:0;z-index:120;background:#163b6273;display:flex;justify-content:flex-end;padding:14px;backdrop-filter:blur(3px)}\r\n.ws-knowledge{width:1050px;height:100%;min-height:0;display:flex;flex-direction:column;border:1px solid #c9ddee;border-radius:15px;box-shadow:0 20px 80px #163c4d33;background:#eff6fd;overflow:hidden}\r\n.ws-knowledge-header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:#fff;border-bottom:1px solid #d4e4f0;flex:none}\r\n.ws-knowledge-header span{font:9px/1.5 Consolas,monospace;letter-spacing:1.5px;color:#5689b7}\r\n.ws-knowledge-header h2{font-size:20px;font-weight:650;line-height:1.7;color:#214b70}\r\n.ws-knowledge-close{font-size:12px;background:#f0f7ff;color:#2f6a9d;border-color:#bdd6ea}\r\n.ws-knowledge-content{overflow:auto;padding:20px;min-height:0;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin;scrollbar-color:#a3c4e3 transparent}\r\n.ws-knowledge-content>*{flex:none;margin:0}\r\n.ws-knowledge-content .panel-head{padding:17px 20px}\r\n.ws-knowledge-content .panel-head h2{font-size:16px}\r\n.ws-knowledge-content .panel-head p{font-size:11px;color:#597a99}\r\n.ws-knowledge-content .panel-head .tag{margin-bottom:7px}\r\n.ws-knowledge-content .panel{box-shadow:none}\r\n.ws-knowledge-content .formula-panel .panel-body{grid-template-columns:1.2fr 1fr;gap:20px}\r\n.ws-knowledge-content .formula-grid{margin-top:0}\r\n.ws-knowledge-content .formula-cell b{font-size:12px}\r\n.ws-knowledge-content .formula-cell small,.ws-knowledge-content .formula-cell span{color:#6283a1}\r\n.ws-knowledge-content .lesson-cards{grid-template-columns:repeat(3,1fr);gap:12px}\r\n.ws-knowledge-content .lesson-card{padding:18px}\r\n.ws-knowledge-content .lesson-card p{font-size:11px;color:#597996}\r\n.ws-knowledge-content .lesson-card h3{font-size:14px}\r\n.ws-knowledge-content .answer-options{padding:0 20px 20px;display:flex;gap:12px}\r\n.ws-knowledge-content .answer-option{flex:1}\r\n.ws-knowledge-content .question .answer-options{padding:0;flex-wrap:wrap;gap:6px}\r\n.ws-knowledge-content .note .evaluation-metric-note{padding:0;color:#577b99}\r\n.ws-knowledge-content .page-next{padding:18px 22px}\r\n.ws-knowledge-content .page-next h3{font-size:16px}\r\n.ws-knowledge-content .iou-demo-grid{grid-template-columns:1.2fr 1fr;padding:0 22px 22px;gap:25px}\r\n.ws-knowledge-content .challenge-form{padding:0 20px 20px;gap:10px}\r\n.ws-knowledge-content .challenge-form>label{max-width:150px}\r\n.ws-knowledge-content .evaluation-metric-note{font-size:11px}\r\n#toast{bottom:16px;font-size:12px;z-index:150;max-width:800px}\r\n\n/* Colors only: image pixels, annotation coordinates and experiment state stay intact. */\nhtml[data-theme=dark]{color-scheme:dark;--ink:#dce9f8;--muted:#a5bad2;--blue:#79b6ff;--deep:#387fc6;--soft:#20364e;--line:#344b66;--paper:#0f1b2d;--good:#67d8bb;--bad:#ff9c8e;--warn:#eab86e}\nhtml[data-theme=dark] body{background:var(--paper);color:var(--ink)}\nhtml[data-theme=dark] :is(.panel,.lesson-card,.ws-metrics,.ws-knowledge-header,.class-choice,.box-row,.btn,select,input[type=number],input[type=text],.answer-option){background:#192b41;color:#dce9f8;border-color:#3b526c}\nhtml[data-theme=dark] :is(.ws-tool-rail,.stage-bottom,.ws-overlay-toolbar,.ws-knowledge,.progress-strip,.image-picker,.formula-cell,.metric,.note,.code-box,.next-lesson,.page-next,.evaluation-controls,.evaluation-rule,.tag,.image-badge){background:#20334a!important;color:#bad1eb!important;border-color:#3b526c!important}\nhtml[data-theme=dark] :is(.canvas-wrap,.helmet-image-stage){background:radial-gradient(ellipse at 50% 30%,#243b53,#142338)!important}\nhtml[data-theme=dark] :is(.panel-head,.control-section,.toolbar,.evaluation-control-grid>div+div,.ws-tool-rail){border-color:#344b66!important}\nhtml[data-theme=dark] :is(h1,h2,h3,.ws-heading h1,.ws-board .panel-head h2,.ws-knowledge-header h2,.ws-label-heading,.class-choice,.selected-meta,.stage-bottom strong,.range-row output,.metric strong,.code-box){color:#dce9f8!important}\nhtml[data-theme=dark] :is(p,.tiny,.muted,small,label,.switch-row,.range-row,.ws-heading p,.panel-head p,.ws-board .panel-head p,.ws-board .tiny,.ws-board .muted,.box-row small,.coordinate-grid label,.metric span,.metric small,.equations,.review-check,.feedback,.check-result,.evaluation-metric-note,.ws-knowledge-content .lesson-card p){color:#abc0d8!important}\nhtml[data-theme=dark] :is(.btn.primary,.btn.active,.class-choice.active,.box-row.active,.answer-option.selected){background:#2d5b8b!important;color:#fff!important;border-color:#78b9ff!important}\nhtml[data-theme=dark] :is(.btn:hover,.box-row:hover,.class-choice:hover){background:#29445f}\nhtml[data-theme=dark] :is(.class-choice span:first-child,.formula-cell,.metric,.evaluation-rule,.ws-export-shortcut){background:#263d55!important;color:#8ed9ce!important}\nhtml[data-theme=dark] .ws-knowledge-overlay{background:#020a16ac}\nhtml[data-theme=dark] #evaluation-zero-note{background:transparent!important;color:#edc58d!important}\nhtml[data-theme=dark] :is(.tag,.image-badge){box-shadow:none}\n\u003c/style>\u003c/head>\u003cbody data-lesson=\"predict\">\u003cmain id=\"lesson-main\">\u003cdiv id=\"workbench\">\u003cdiv class=\"helmet-main\">\r\n  \u003cdiv class=\"workspace prediction-workspace\">\r\n    \u003csection class=\"panel\">\r\n      \u003cdiv class=\"panel-head\">\u003cdiv>\u003cspan class=\"tag\">固定候选 · 7 个框\u003c/span>\u003ch2>同一张图，换一个筛选门槛\u003c/h2>\u003cp>拖动阈值，观察哪些候选框被保留。人物与原始预测分数保持不变。\u003c/p>\u003c/div>\u003cspan class=\"image-badge\">640 × 640 px\u003c/span>\u003c/div>\r\n      \u003cdiv class=\"prediction-controls\">\r\n        \u003cdiv class=\"threshold-top\">\u003clabel for=\"prediction-threshold\">置信度阈值\u003c/label>\u003coutput id=\"prediction-threshold-value\" for=\"prediction-threshold\">0.25\u003c/output>\u003c/div>\r\n        \u003cinput id=\"prediction-threshold\" type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.25\" aria-describedby=\"prediction-threshold-help\">\r\n        \u003cdiv class=\"range-labels\">\u003cspan>0.00 · 保留更多\u003c/span>\u003cspan>1.00 · 保留更少\u003c/span>\u003c/div>\r\n        \u003cdiv class=\"toolbar\">\u003cbutton class=\"btn small\" data-prediction-threshold=\"0.25\">观察 0.25\u003c/button>\u003cbutton class=\"btn small\" data-prediction-threshold=\"0.50\">比较 0.50\u003c/button>\u003clabel class=\"toggle-label\">\u003cinput id=\"prediction-show-filtered\" type=\"checkbox\">显示被筛除的框\u003c/label>\u003c/div>\r\n        \u003cp class=\"tiny muted\" id=\"prediction-threshold-help\">保留规则：预测分数 ≥ 阈值。本课刻意保留重复候选供下一页核对；真实检测流程通常还有 NMS（去重），此处未模拟。\u003c/p>\r\n      \u003c/div>\r\n      \u003cdiv class=\"stage helmet-image-stage\">\u003csvg id=\"prediction-svg\" viewBox=\"0 0 640 640\" role=\"img\" aria-label=\"安全帽固定预测回放\">\u003c/svg>\u003cdiv id=\"prediction-empty\" class=\"stage-empty\" hidden>当前阈值没有保留任何候选框。\u003cspan>降低阈值，再观察哪些框出现。\u003c/span>\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"stage-bottom\">\u003cdiv class=\"legend-row\">\u003cspan>\u003ci class=\"legend-line prediction-line\">\u003c/i>保留的预测框\u003c/span>\u003cspan>\u003ci class=\"legend-line filtered-line\">\u003c/i>被筛除的框\u003c/span>\u003c/div>\u003cspan id=\"prediction-image-status\" class=\"tiny\">原创教学示意图 · 非真实施工影像\u003c/span>\u003c/div>\r\n    \u003c/section>\r\n    \u003caside class=\"prediction-sidebar\">\r\n      \u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>候选结果\u003c/h2>\u003cp>点击一项，在图中定位对应框。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"prediction-counts\">\u003cdiv>\u003cstrong id=\"prediction-visible-count\">7\u003c/strong>\u003cspan>个保留\u003c/span>\u003c/div>\u003cdiv>\u003cstrong id=\"prediction-hidden-count\">0\u003c/strong>\u003cspan>个筛除\u003c/span>\u003c/div>\u003c/div>\u003cdiv id=\"prediction-candidate-list\" class=\"candidate-list\" aria-label=\"固定预测候选列表\">\u003c/div>\u003c/section>\r\n      \u003csection class=\"note score-note\">\u003cspan class=\"eyebrow\">读懂这个数字\u003c/span>\u003ch3>0.91 是预测分数\u003c/h3>\u003cp>它表示模型对这个类别的置信程度，不能直接读作“这个框有 91% 的正确率”。是否预测正确，要与人工核对的真值比较。\u003c/p>\u003c/section>\r\n    \u003c/aside>\r\n  \u003c/div>\r\n  \u003csection class=\"panel lesson-section\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003cspan class=\"tag\">动手想一想\u003c/span>\u003ch2>提高阈值，一定会得到更好的结果吗？\u003c/h2>\u003cp>先在图中比较 0.25 和 0.50，再作出判断。\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"answer-options\" id=\"prediction-question\">\u003cbutton class=\"answer-option\" data-prediction-answer=\"always\">\u003cspan>A\u003c/span>\u003cdiv>\u003cstrong>一定更好\u003c/strong>\u003csmall>留下的分数更高，所以所有结果都更正确。\u003c/small>\u003c/div>\u003c/button>\u003cbutton class=\"answer-option\" data-prediction-answer=\"tradeoff\">\u003cspan>B\u003c/span>\u003cdiv>\u003cstrong>需要同时考虑误检与漏检\u003c/strong>\u003csmall>低分错误框可能被筛掉，低分正确框也可能消失。\u003c/small>\u003c/div>\u003c/button>\u003c/div>\u003cdiv id=\"prediction-answer-feedback\" class=\"answer-feedback\" aria-live=\"polite\" hidden>\u003c/div>\u003c/section>\r\n  \u003csection class=\"lesson-cards prediction-flow\">\u003carticle class=\"lesson-card\">\u003cspan class=\"step-kicker\">01 / 输入\u003c/span>\u003ch3>图像 + 已有权重\u003c/h3>\u003cp>真实推理用训练好的权重读取新图像。此页使用固定示例，浏览器没有加载或运行 YOLO 模型。\u003c/p>\u003c/article>\u003carticle class=\"lesson-card\">\u003cspan class=\"step-kicker\">02 / 输出\u003c/span>\u003ch3>框 + 类别 + 分数\u003c/h3>\u003cp>预测结果带有分数。它与标注页导出的五列人工训练标签，是不同用途的数据。\u003c/p>\u003c/article>\u003carticle class=\"lesson-card\">\u003cspan class=\"step-kicker\">03 / 筛选\u003c/span>\u003ch3>改变门槛，保留候选\u003c/h3>\u003cp>本页滑条只筛选已有候选，不重新预测、不训练，也不改变这些框的原始分数。\u003c/p>\u003c/article>\u003c/section>\r\n  \u003cdiv class=\"page-next\">\u003cdiv>\u003cspan class=\"eyebrow\">下一步 · 结果评估\u003c/span>\u003ch3>这些框里，哪些真的找对了？\u003c/h3>\u003cp>带着当前阈值，核对误检、漏检与一对一匹配。\u003c/p>\u003c/div>\u003ca class=\"btn primary\" id=\"prediction-next-evaluation\" href=\"evaluate.html?threshold=0.25\">去评估这些结果 \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\r\n\u003c/div>\r\n\u003c/div>\u003c/main>\u003cdiv id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>/* Arrange each lesson inside the shared 16:9 teaching screen before it starts. */\r\n(() => {\r\n  const main = document.getElementById('lesson-main');\r\n  const workbench = document.getElementById('workbench');\r\n  if (!main || !workbench) return;\r\n  const lesson = document.body.dataset.lesson;\r\n  const titles = {\r\n    annotation: ['亲手画框，让图像成为数据。', '框住头部 → 指定类别 → 检查标签'],\r\n    predict: ['模型看到了什么？', '固定候选 → 调整阈值 → 比较保留结果'],\r\n    evaluate: ['一次判断，要经得起核对。', '对照真值 → 一对一匹配 → 统计误检与漏检']\r\n  };\r\n  const [title, subtitle] = titles[lesson] || titles.annotation;\r\n  const heading = document.createElement('header');\r\n  heading.className = 'ws-heading';\r\n  heading.innerHTML = `\u003cdiv>\u003ch1>${title}\u003c/h1>\u003cp>${subtitle}\u003c/p>\u003c/div>\u003cbutton type=\"button\" class=\"btn ws-knowledge-open\" aria-haspopup=\"dialog\" aria-controls=\"lesson-knowledge\" aria-expanded=\"false\">\u003cspan aria-hidden=\"true\">▤\u003c/span> 知识与练习 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>`;\r\n  main.prepend(heading);\r\n\r\n  const overlay = document.createElement('div');\r\n  overlay.className = 'ws-knowledge-overlay';\r\n  overlay.hidden = true;\r\n  overlay.innerHTML = '\u003csection class=\"ws-knowledge\" id=\"lesson-knowledge\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"knowledge-title\">\u003cheader class=\"ws-knowledge-header\">\u003cdiv>\u003cspan>LEARNING NOTES\u003c/span>\u003ch2 id=\"knowledge-title\">知识与练习\u003c/h2>\u003c/div>\u003cbutton type=\"button\" class=\"btn ws-knowledge-close\" aria-label=\"关闭知识与练习\">返回实验台 ×\u003c/button>\u003c/header>\u003cdiv class=\"ws-knowledge-content\">\u003c/div>\u003c/section>';\r\n  document.body.append(overlay);\r\n  const knowledge = overlay.querySelector('.ws-knowledge-content');\r\n  const workspace = workbench.querySelector('.workspace');\r\n  const originalRoot = workbench.querySelector('.helmet-main') || workbench;\r\n  const metrics = lesson === 'evaluate' ? document.getElementById('evaluation-metrics').closest('.lesson-section') : null;\r\n  const tools = document.createElement('div');\r\n  tools.className = 'ws-tool-rail';\r\n  const stagePanel = workspace.querySelector(':scope > .panel');\r\n  stagePanel.classList.add('ws-stage-panel');\r\n  stagePanel.append(tools);\r\n\r\n  if (lesson === 'annotation') {\r\n    tools.append(stagePanel.querySelector('.image-picker'), stagePanel.querySelector('.toolbar'), stagePanel.querySelector('.progress-strip'));\r\n    const labelHeading = document.createElement('h3');\r\n    labelHeading.className = 'ws-label-heading';\r\n    labelHeading.textContent = '当前 YOLO 标签';\r\n    tools.append(labelHeading, document.getElementById('yoloLine'));\r\n    const labelHelp = document.createElement('p');\r\n    labelHelp.className = 'tiny muted';\r\n    labelHelp.textContent = '选中或调整框，五列数字同步更新。';\r\n    tools.append(labelHelp);\r\n    const exportShortcut = document.createElement('button');\r\n    exportShortcut.type = 'button';\r\n    exportShortcut.className = 'btn ws-export-shortcut';\r\n    exportShortcut.textContent = '检查与导出 →';\r\n    exportShortcut.onclick = () => {\r\n      const target = document.getElementById('checkBtn');\r\n      target.scrollIntoView({block: 'center', behavior: 'smooth'});\r\n      target.focus({preventScroll: true});\r\n    };\r\n    tools.append(exportShortcut);\r\n  } else if (lesson === 'predict') {\r\n    tools.append(stagePanel.querySelector('.prediction-controls'), workspace.querySelector('.score-note'));\r\n  } else {\r\n    tools.append(originalRoot.querySelector('.evaluation-controls'), originalRoot.querySelector('.evaluation-rule'));\r\n    stagePanel.querySelector('.overlay-toolbar').classList.add('ws-overlay-toolbar');\r\n    metrics.classList.add('ws-metrics');\r\n    const explanations = document.createElement('section');\r\n    explanations.className = 'note';\r\n    explanations.setAttribute('aria-label', '指标说明');\r\n    const note = metrics.querySelector('.evaluation-metric-note:not([id])');\r\n    if (note) explanations.append(note);\r\n    knowledge.append(explanations);\r\n  }\r\n\r\n  // Move existing nodes, including their IDs, so all lesson logic keeps its targets.\r\n  for (const node of Array.from(originalRoot.children)) {\r\n    if (node !== workspace && node !== metrics) knowledge.append(node);\r\n  }\r\n  workbench.append(workspace);\r\n  if (metrics) workbench.append(metrics);\r\n  if (originalRoot !== workbench) originalRoot.remove();\r\n  workbench.classList.add('ws-board');\r\n  if (metrics) workbench.classList.add('ws-board-with-metrics');\r\n\r\n  const opener = heading.querySelector('.ws-knowledge-open');\r\n  const closer = overlay.querySelector('.ws-knowledge-close');\r\n  function setKnowledge(open) {\r\n    overlay.hidden = !open;\r\n    opener.setAttribute('aria-expanded', String(open));\r\n    main.inert = open;\r\n    if (open) closer.focus();\r\n    else opener.focus({preventScroll: true});\r\n  }\r\n  opener.addEventListener('click', () => setKnowledge(true));\r\n  closer.addEventListener('click', () => setKnowledge(false));\r\n  overlay.addEventListener('click', event => { if (event.target === overlay) setKnowledge(false); });\r\n  document.addEventListener('keydown', event => {\r\n    if (overlay.hidden) return;\r\n    if (event.key === 'Escape') {\r\n      event.preventDefault();\r\n      event.stopImmediatePropagation();\r\n      setKnowledge(false);\r\n    } else if (event.key === 'Tab') {\r\n      const focusable = Array.from(overlay.querySelectorAll('button, a[href], input, select, textarea, [tabindex]')).filter(element => !element.disabled && element.tabIndex >= 0 && element.getClientRects().length);\r\n      const first = focusable[0], last = focusable[focusable.length - 1];\r\n      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }\r\n      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }\r\n    }\r\n  }, true);\r\n  window.helmetKnowledge = {open: () => setKnowledge(true), close: () => { if (!overlay.hidden) setKnowledge(false); }};\r\n})();\r\n\nconst LESSON_DATA={\"clear\":{\"width\":640,\"height\":640,\"svg\":\"\u003csvg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"640\\\" viewBox=\\\"0 0 640 640\\\" role=\\\"img\\\" aria-labelledby=\\\"title desc\\\">\\r\\n\u003ctitle id=\\\"title\\\">安全帽标注教学施工场景 · 640 × 640\u003c/title>\u003cdesc id=\\\"desc\\\">教学绘制，非现场照片。蓝白色施工场景中有五名工人，其中三名戴安全帽、两名未戴安全帽。首位工人可见头部含帽的像素边界为（160，80）至（320，240）。\u003c/desc>\\r\\n\u003c!-- Original teaching vector illustration. No external images, fonts, or scripts. Bboxes are original-image pixels. -->\\r\\n\u003cdefs>\\r\\n\u003clinearGradient id=\\\"sky\\\" x2=\\\"0\\\" y2=\\\"1\\\">\u003cstop stop-color=\\\"#f6fbff\\\"/>\u003cstop offset=\\\"1\\\" stop ight:0}\r\n.ws-board .ws-metrics .metric{padding:9px 12px;border-radius:8px;border-color:#d7e7f1;background:#f5faff;min-height:0}\r\n.ws-board .ws-metrics .metric>span{font-size:10px;line-height:1.4;color:#587998}\r\n.ws-board .ws-metrics .metric strong{font-size:24px;line-height:1.15;margin:5px 0 4px}\r\n.ws-board .ws-metrics .metric small{font-size:9px;line-height:1.4;color:#6c88a2;margin:0}\r\n.ws-board .ws-metrics .metric:nth-child(2){background:#fff7ed;border-color:#edddc4}\r\n.ws-board .ws-metrics .metric:nth-child(3){background:#eff9f6;border-color:#cde6dd}\r\n.ws-board .ws-metrics #evaluation-zero-note{position:absolute;left:12px;bottom:9px;max-width:230px;padding:0;font-size:8px;line-height:1.5;background:#fff;color:#83672c}\r\n.ws-knowledge-overlay{position:fixed;inset:0;z-index:120;background:#163b6273;display:flex;justify-content:flex-end;padding:14px;backdrop-filter:blur(3px)}\r\n.ws-knowledge{width:1050px;height:100%;min-height:0;display:flex;flex-direction:column;border:1px solid #c9ddee;border-radius:15px;box-shadow:0 20px 80px #163c4d33;background:#eff6fd;overflow:hidden}\r\n.ws-knowledge-header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:#fff;border-bottom:1px solid #d4e4f0;flex:none}\r\n.ws-knowledge-header span{font:9px/1.5 Consolas,monospace;letter-spacing:1.5px;color:#5689b7}\r\n.ws-knowledge-header h2{font-size:20px;font-weight:650;line-height:1.7;color:#214b70}\r\n.ws-knowledge-close{font-size:12px;background:#f0f7ff;color:#2f6a9d;border-color:#bdd6ea}\r\n.ws-knowledge-content{overflow:auto;padding:20px;min-height:0;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin;scrollbar-color:#a3c4e3 transparent}\r\n.ws-knowledge-content>*{flex:none;margin:0}\r\n.ws-knowledge-content .panel-head{padding:17px 20px}\r\n.ws-knowledge-content .panel-head h2{font-size:16px}\r\n.ws-knowledge-content .panel-head p{font-size:11px;color:#597a99}\r\n.ws-knowledge-content .panel-head .tag{margin-bottom:7px}\r\n.ws-knowledge-content .panel{box-shadow:none}\r\n.ws-knowledge-content .formula-panel .panel-body{grid-template-columns:1.2fr 1fr;gap:20px}\r\n.ws-knowledge-content .formula-grid{margin-top:0}\r\n.ws-knowledge-content .formula-cell b{font-size:12px}\r\n.ws-knowledge-content .formula-cell small,.ws-knowledge-content .formula-cell span{color:#6283a1}\r\n.ws-knowledge-content .lesson-cards{grid-template-columns:repeat(3,1fr);gap:12px}\r\n.ws-knowledge-content .lesson-card{padding:18px}\r\n.ws-knowledge-content .lesson-card p{font-size:11px;color:#597996}\r\n.ws-knowledge-content .lesson-card h3{font-size:14px}\r\n.ws-knowledge-content .answer-options{padding:0 20px 20px;display:flex;gap:12px}\r\n.ws-knowledge-content .answer-option{flex:1}\r\n.ws-knowledge-content .question .answer-options{padding:0;flex-wrap:wrap;gap:6px}\r\n.ws-knowledge-content .note .evaluation-metric-note{padding:0;color:#577b99}\r\n.ws-knowledge-content .page-next{padding:18px 22px}\r\n.ws-knowledge-content .page-next h3{font-size:16px}\r\n.ws-knowledge-content .iou-demo-grid{grid-template-columns:1.2fr 1fr;padding:0 22px 22px;gap:25px}\r\n.ws-knowledge-content .challenge-form{padding:0 20px 20px;gap:10px}\r\n.ws-knowledge-content .challenge-form>label{max-width:150px}\r\n.ws-knowledge-content .evaluation-metric-note{font-size:11px}\r\n#toast{bottom:16px;font-size:12px;z-index:150;max-width:800px}\r\n\n/* Colors only: image pixels, annotation coordinates and experiment state stay intact. */\nhtml[data-theme=dark]{color-scheme:dark;--ink:#dce9f8;--muted:#a5bad2;--blue:#79b6ff;--deep:#387fc6;--soft:#20364e;--line:#344b66;--paper:#0f1b2d;--good:#67d8bb;--bad:#ff9c8e;--warn:#eab86e}\nhtml[data-theme=dark] body{background:var(--paper);color:var(--ink)}\nhtml[data-theme=dark] :is(.panel,.lesson-card,.ws-metrics,.ws-knowledge-header,.class-choice,.box-row,.btn,select,input[type=number],input[type=text],.answer-option){background:#192b41;color:#dce9f8;border-color:#3b526c}\nhtml[data-theme=dark] :is(.ws-tool-rail,.stage-bottom,.ws-overlay-toolbar,.ws-knowledge,.progress-strip,.image-picker,.formula-cell,.metric,.note,.code-box,.next-lesson,.page-next,.evaluation-controls,.evaluation-rule,.tag,.image-badge){background:#20334a!important;color:#bad1eb!important;border-color:#3b526c!important}\nhtml[data-theme=dark] :is(.canvas-wrap,.helmet-image-stage){background:radial-gradient(ellipse at 50% 30%,#243b53,#142338)!important}\nhtml[data-theme=dark] :is(.panel-head,.control-section,.toolbar,.evaluation-control-grid>div+div,.ws-tool-rail){border-color:#344b66!important}\nhtml[data-theme=dark] :is(h1,h2,h3,.ws-heading h1,.ws-board .panel-head h2,.ws-knowledge-header h2,.ws-label-heading,.class-choice,.selected-meta,.stage-bottom strong,.range-row output,.metric strong,.code-box){color:#dce9f8!important}\nhtml[data-theme=dark] :is(p,.tiny,.muted,small,label,.switch-row,.range-row,.ws-heading p,.panel-head p,.ws-board .panel-head p,.ws-board .tiny,.ws-board .muted,.box-row small,.coordinate-grid label,.metric span,.metric small,.equations,.review-check,.feedback,.check-result,.evaluation-metric-note,.ws-knowledge-content .lesson-card p){color:#abc0d8!important}\nhtml[data-theme=dark] :is(.btn.primary,.btn.active,.class-choice.active,.box-row.active,.answer-option.selected){background:#2d5b8b!important;color:#fff!important;border-color:#78b9ff!important}\nhtml[data-theme=dark] :is(.btn:hover,.box-row:hover,.class-choice:hover){background:#29445f}\nhtml[data-theme=dark] :is(.class-choice span:first-child,.formula-cell,.metric,.evaluation-rule,.ws-export-shortcut){background:#263d55!important;color:#8ed9ce!important}\nhtml[data-theme=dark] .ws-knowledge-overlay{background:#020a16ac}\nhtml[data-theme=dark] #evaluation-zero-note{background:transparent!important;color:#edc58d!important}\nhtml[data-theme=dark] :is(.tag,.image-badge){box-shadow:none}\n\u003c/style>\u003c/head>\u003cbody data-lesson=\"evaluate\">\u003cmain id=\"lesson-main\">\u003cdiv id=\"workbench\">\u003cdiv class=\"helmet-main\">\r\n  \u003cdiv class=\"evaluation-rule\">\u003cspan class=\"tag\">本课匹配规则\u003c/span>\u003cp>\u003cstrong>同一类别\u003c/strong>\u003ci>＋\u003c/i>\u003cstrong>IoU 达到门槛\u003c/strong>\u003ci>＋\u003c/i>\u003cstrong>一对一匹配\u003c/strong>\u003cspan>按预测分数从高到低核对；一个真值最多配一个预测。本课保留重复候选帮助理解配对，未模拟 NMS 去重。\u003c/span>\u003c/p>\u003c/div>\r\n  \u003csection class=\"panel evaluation-controls\">\u003cdiv class=\"evaluation-control-grid\">\u003cdiv>\u003cdiv class=\"threshold-top\">\u003clabel for=\"evaluation-threshold\">预测分数阈值\u003c/label>\u003coutput id=\"evaluation-threshold-value\">0.25\u003c/output>\u003c/div>\u003cinput id=\"evaluation-threshold\" type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.25\">\u003cdiv class=\"toolbar\">\u003cbutton class=\"btn small\" data-evaluation-threshold=\"0.25\">0.25\u003c/button>\u003cbutton class=\"btn small\" data-evaluation-threshold=\"0.50\">0.50\u003c/button>\u003cspan class=\"tiny muted\">分数 ≥ 阈值的预测参与评估\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"threshold-top\">\u003clabel for=\"evaluation-iou-threshold\">匹配 IoU 门槛\u003c/label>\u003coutput id=\"evaluation-iou-value\">0.50\u003c/output>\u003c/div>\u003cinput id=\"evaluation-iou-threshold\" type=\"range\" min=\"0.10\" max=\"1\" step=\"0.05\" value=\"0.50\">\u003cp class=\"tiny muted\">同类预测还须满足 IoU ≥ 门槛。提高门槛，会对位置要求更严格。\u003c/p>\u003c/div>\u003c/div>\u003c/section>\r\n  \u003cdiv class=\"workspace evaluation-workspace\">\r\n    \u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>把预测与真值对上\u003c/h2>\u003cp>真值来自教学设定的人工核对框。点击右侧记录，追踪每一次匹配。\u003c/p>\u003c/div>\u003cspan class=\"image-badge\">5 个已知目标\u003c/span>\u003c/div>\u003cdiv class=\"toolbar overlay-toolbar\">\u003clabel class=\"toggle-label\">\u003cinput id=\"evaluation-show-truth\" type=\"checkbox\" checked>人工真值\u003c/label>\u003clabel class=\"toggle-label\">\u003cinput id=\"evaluation-show-prediction\" type=\"checkbox\" checked>保留的预测\u003c/label>\u003cbutton class=\"btn small\" id=\"evaluation-clear-selection\">取消高亮\u003c/button>\u003c/div>\u003cdiv class=\"stage helmet-image-stage\">\u003csvg id=\"evaluation-svg\" viewBox=\"0 0 640 640\" role=\"img\" aria-label=\"安全帽预测与真值匹配示意\">\u003c/svg>\u003c/div>\u003cdiv class=\"stage-bottom\">\u003cdiv class=\"legend-row\">\u003cspan>\u003ci class=\"legend-line truth-line\">\u003c/i>真值\u003c/span>\u003cspan>\u003ci class=\"legend-line tp-line\">\u003c/i>正确 TP\u003c/span>\u003cspan>\u003ci class=\"legend-line fp-line\">\u003c/i>误检 FP\u003c/span>\u003c/div>\u003cspan class=\"tiny muted\">同一张教学图 · 固定候选回放\u003c/span>\u003c/div>\u003c/section>\r\n    \u003caside class=\"evaluation-sidebar\">\u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003ch2>逐框核对\u003c/h2>\u003cp id=\"evaluation-list-summary\">7 个预测参与评估\u003c/p>\u003c/div>\u003c/div>\u003cdiv id=\"evaluation-prediction-list\" class=\"candidate-list evaluation-list\" aria-label=\"逐框匹配列表\">\u003c/div>\u003cdiv class=\"missed-section\">\u003cdiv class=\"missed-heading\">\u003ch3>漏检 FN\u003c/h3>\u003cspan id=\"evaluation-missed-count\">1\u003c/span>\u003c/div>\u003cdiv id=\"evaluation-missed-list\" class=\"missed-list\">\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"note evaluation-selection-note\" id=\"evaluation-selection-note\" aria-live=\"polite\">选择一个预测框，查看它为什么匹配成功或失败。\u003c/div>\u003c/aside>\r\n  \u003c/div>\r\n  \u003csection class=\"panel lesson-section\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003cspan class=\"tag\">全图统计\u003c/span>\u003ch2>框对不对，要一起看\u003c/h2>\u003cp id=\"evaluation-metric-context\">仅统计这张图，在当前阈值与 IoU 门槛下的结果。\u003c/p>\u003c/div>\u003cbutton class=\"btn small\" id=\"evaluation-toggle-metrics\" aria-pressed=\"true\">隐藏指标\u003c/button>\u003c/div>\u003cdiv class=\"metric-grid evaluation-metrics\" id=\"evaluation-metrics\">\u003cdiv class=\"metric\">\u003cspan>正确检测 TP\u003c/span>\u003cstrong id=\"evaluation-tp\">4\u003c/strong>\u003csmall>类别和位置都匹配\u003c/small>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>误检 FP\u003c/span>\u003cstrong id=\"evaluation-fp\">3\u003c/strong>\u003csmall>留下但没匹配的预测\u003c/small>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>漏检 FN\u003c/span>\u003cstrong id=\"evaluation-fn\">1\u003c/strong>\u003csmall>没有预测配对的真值\u003c/small>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>精确率 Precision\u003c/span>\u003cstrong id=\"evaluation-precision\">57.1%\u003c/strong>\u003csmall>TP ÷ (TP + FP)\u003c/small>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>召回率 Recall\u003c/span>\u003cstrong id=\"evaluation-recall\">80.0%\u003c/strong>\u003csmall>TP ÷ (TP + FN)\u003c/small>\u003c/div>\u003c/div>\u003cdiv id=\"evaluation-zero-note\" class=\"tiny muted evaluation-metric-note\" hidden>当前没有保留的预测，精确率分母为 0，在本演示中记为“不适用”；召回率仍按全部 5 个真值计算。\u003c/div>\u003cp class=\"tiny muted evaluation-metric-note\">这是单张教学图的计数练习，不能代表模型在完整数据集上的能力，也不能替代 mAP 等正式评估。\u003c/p>\u003c/section>\r\n  \u003csection class=\"panel lesson-section challenge-section\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003cspan class=\"tag\">课堂挑战\u003c/span>\u003ch2>自己数一遍，再核验\u003c/h2>\u003cp>开始挑战后暂时遮住结论。根据人工真值、预测类别与重叠位置，填入 TP、FP、FN。\u003c/p>\u003c/div>\u003cbutton class=\"btn\" id=\"evaluation-start-challenge\">开始独立核验\u003c/button>\u003c/div>\u003cform id=\"evaluation-challenge-form\" class=\"challenge-form\">\u003clabel>TP · 正确\u003cinput id=\"challenge-tp\" type=\"number\" min=\"0\" max=\"7\" step=\"1\" placeholder=\"?\" inputmode=\"numeric\" required>\u003c/label>\u003clabel>FP · 误检\u003cinput id=\"challenge-fp\" type=\"number\" min=\"0\" max=\"7\" step=\"1\" placeholder=\"?\" inputmode=\"numeric\" required>\u003c/label>\u003clabel>FN · 漏检\u003cinput id=\"challenge-fn\" type=\"number\" min=\"0\" max=\"5\" step=\"1\" placeholder=\"?\" inputmode=\"numeric\" required>\u003c/label>\u003cbutton class=\"btn primary\" type=\"submit\">核验答案\u003c/button>\u003cbutton class=\"btn\" type=\"button\" id=\"evaluation-reveal-answer\">查看解析\u003c/button>\u003c/form>\u003cdiv id=\"evaluation-challenge-feedback\" class=\"answer-feedback\" aria-live=\"polite\" hidden>\u003c/div>\u003c/section>\r\n  \u003csection class=\"panel lesson-section\">\u003cdiv class=\"panel-head\">\u003cdiv>\u003cspan class=\"tag\">看清一个概念\u003c/span>\u003ch2>IoU：两个框的位置有多接近？\u003c/h2>\u003cp>拖动预测框，观察重叠面积与并集面积。此处只演示位置，不判断类别。\u003c/p>\u003c/div>\u003cspan class=\"formula-pill\">IoU = 交集面积 ÷ 并集面积\u003c/span>\u003c/div>\u003cdiv class=\"iou-demo-grid\">\u003cdiv>\u003csvg id=\"iou-demo-svg\" viewBox=\"0 0 380 200\" role=\"img\" aria-label=\"交并比演示，可用下方滑条移动预测框\">\u003c/svg>\u003clabel for=\"iou-offset\" class=\"iou-slider-label\">预测框向右移动 \u003coutput id=\"iou-offset-value\">30\u003c/output> px\u003c/label>\u003cinput id=\"iou-offset\" type=\"range\" min=\"0\" max=\"140\" step=\"1\" value=\"30\">\u003c/div>\u003cdiv class=\"iou-readouts\">\u003cdiv>\u003cspan>交集面积\u003c/span>\u003cstrong id=\"iou-intersection-area\" class=\"mono\">5600\u003c/strong>\u003csmall>两个框共同覆盖的区域\u003c/small>\u003c/div>\u003cdiv>\u003cspan>并集面积\u003c/span>\u003cstrong id=\"iou-union-area\" class=\"mono\">10400\u003c/strong>\u003csmall>两框总面积减去重叠部分\u003c/small>\u003c/div>\u003cdiv class=\"iou-score\">\u003cspan>当前 IoU\u003c/span>\u003cstrong id=\"iou-demo-value\">0.538\u003c/strong>\u003csmall id=\"iou-demo-judgment\">达到当前匹配门槛 0.50\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\r\n  \u003csection class=\"lesson-cards evaluation-lessons\">\u003carticle class=\"lesson-card\">\u003cspan class=\"step-kicker\">误检也有不同原因\u003c/span>\u003ch3>错类、重复、背景、偏框\u003c/h3>\u003cp>与目标重叠很大，也可能把类别判断错；同一人出现两个预测框，也只能有一个正确匹配。\u003c/p>\u003c/article>\u003carticle class=\"lesson-card\">\u003cspan class=\"step-kicker\">比较 0.25 与 0.50\u003c/span>\u003ch3>精确率与召回率一起看\u003c/h3>\u003cp>本例提高分数阈值后，误检减少，部分低分正确框也被删去。点击两个预设，自己核对变化。\u003c/p>\u003c/article>\u003carticle class=\"lesson-card\">\u003cspan class=\"step-kicker\">回到真实应用\u003c/span>\u003ch3>先固定评估规则\u003c/h3>\u003cp>使用独立测试图、核对可靠真值，在同一规则下比较结果。单张图的好结果不足以证明模型可靠。\u003c/p>\u003c/article>\u003c/section>\r\n  \u003cdiv class=\"page-next\">\u003cdiv>\u003cspan class=\"eyebrow\">继续练习\u003c/span>\u003ch3>回到标注，检查数据从哪里来\u003c/h3>\u003cp>预测由模型给出；真值由人核对。两者各有用途。\u003c/p>\u003c/div>\u003cdiv class=\"toolbar\">\u003ca class=\"btn\" id=\"evaluation-back-prediction\" href=\"predict.html\">返回预测回放\u003c/a>\u003ca class=\"btn primary\" href=\"index.html\">回到人工标注 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\r\n\u003c/div>\r\n\u003c/div>\u003c/main>\u003cdiv id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>/* Arrange each lesson inside the shared 16:9 teaching screen before it starts. */\r\n(() => {\r\n  const main = document.getElementById('lesson-main');\r\n  const workbench = document.getElementById('workbench');\r\n  if (!main || !workbench) return;\r\n  const lesson = document.body.dataset.lesson;\r\n  const titles = {\r\n    annotation: ['亲手画框，让图像成为数据。', '框住头部 → 指定类别 → 检查标签'],\r\n    predict: ['模型看到了什么？', '固定候选 → 调整阈值 → 比较保留结果'],\r\n    evaluate: ['一次判断，要经得起核对。', '对照真值 → 一对一匹配 → 统计误检与漏检']\r\n  };\r\n  const [title, subtitle] = titles[lesson] || titles.annotation;\r\n  const heading = document.createElement('header');\r\n  heading.className = 'ws-heading';\r\n  heading.innerHTML = `\u003cdiv>\u003ch1>${title}\u003c/h1>\u003cp>${subtitle}\u003c/p>\u003c/div>\u003cbutton type=\"button\" class=\"btn ws-knowledge-open\" aria-haspopup=\"dialog\" aria-controls=\"lesson-knowledge\" aria-expanded=\"false\">\u003cspan aria-hidden=\"true\">▤\u003c/span> 知识与练习 \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>`;\r\n  main.prepend(heading);\r\n\r\n  const overlay = document.createElement('div');\r\n  overlay.className = 'ws-knowledge-overlay';\r\n  overlay.hidden = true;\r\n  overlay.innerHTML = '\u003csection class=\"ws-knowledge\" id=\"lesson-knowledge\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"knowledge-title\">\u003cheader class=\"ws-knowledge-header\">\u003cdiv>\u003cspan>LEARNING NOTES\u003c/span>\u003ch2 id=\"knowledge-title\">知识与练习\u003c/h2>\u003c/div>\u003cbutton type=\"button\" class=\"btn ws-knowledge-close\" aria-label=\"关闭知识与练习\">返回实验台 ×\u003c/button>\u003c/header>\u003cdiv class=\"ws-knowledge-content\">\u003c/div>\u003c/section>';\r\n  document.body.append(overlay);\r\n  const knowledge = overlay.querySelector('.ws-knowledge-content');\r\n  const workspace = workbench.querySelector('.workspace');\r\n  const originalRoot = workbench.querySelector('.helmet-main') || workbench;\r\n  const metrics = lesson === 'evaluate' ? document.getElementById('evaluation-metrics').closest('.lesson-section') : null;\r\n  const tools = document.createElement('div');\r\n  tools.className = 'ws-tool-rail';\r\n  const stagePanel = workspace.querySelector(':scope > .panel');\r\n  stagePanel.classList.add('ws-stage-panel');\r\n  stagePanel.append(tools);\r\n\r\n  if (lesson === 'annotation') {\r\n    tools.append(stagePanel.querySelector('.image-picker'), stagePanel.querySelector('.toolbar'), stagePanel.querySelector('.progress-strip'));\r\n    const labelHeading = document.createElement('h3');\r\n    labelHeading.className = 'ws-label-heading';\r\n    labelHeading.textContent = '当前 YOLO 标签';\r\n    tools.append(labelHeading, document.getElementById('yoloLine'));\r\n    const labelHelp = document.createElement('p');\r\n    labelHelp.className = 'tiny muted';\r\n    labelHelp.textContent = '选中或调整框，五列数字同步更新。';\r\n    tools.append(labelHelp);\r\n    const exportShortcut = document.createElement('button');\r\n    exportShortcut.type = 'button';\r\n    exportShortcut.className = 'btn ws-export-shortcut';\r\n    exportShortcut.textContent = '检查与导出 →';\r\n    exportShortcut.onclick = () => {\r\n      const target = document.getElementById('checkBtn');\r\n      target.scrollIntoView({block: 'center', behavior: 'smooth'});\r\n      target.focus({preventScroll: true});\r\n    };\r\n    tools.append(exportShortcut);\r\n  } else if (lesson === 'predict') {\r\n    tools.append(stagePanel.querySelector('.prediction-controls'), workspace.querySelector('.score-note'));\r\n  } else {\r\n    tools.append(originalRoot.querySelector('.evaluation-controls'), originalRoot.querySelector('.evaluation-rule'));\r\n    stagePanel.querySelector('.overlay-toolbar').classList.add('ws-overlay-toolbar');\r\n    metrics.classList.add('ws-metrics');\r\n    const explanations = document.createElement('section');\r\n    explanations.className = 'note';\r\n    explanations.setAttribute('aria-label', '指标说明');\r\n    const note = metrics.querySelector('.evaluation-metric-note:not([id])');\r\n    if (note) explanations.append(note);\r\n    knowledge.append(explanations);\r\n  }\r\n\r\n  // Move existing nodes, including their IDs, so all lesson logic keeps its targets.\r\n  for (const node of Array.from(originalRoot.children)) {\r\n    if (node !== workspace && node !== metrics) knowledge.append(node);\r\n  }\r\n  workbench.append(workspace);\r\n  if (metrics) workbench.append(metrics);\r\n  if (originalRoot !== workbench) originalRoot.remove();\r\n  workbench.classList.add('ws-board');\r\n  if (metrics) workbench.classList.add('ws-board-with-metrics');\r\n\r\n  const opener = heading.querySelector('.ws-knowledge-open');\r\n  const closer = overlay.querySelector('.ws-knowledge-close');\r\n  function setKnowledge(open) {\r\n    overlay.hidden = !open;\r\n    opener.setAttribute('aria-expanded', String(open));\r\n    main.inert = open;\r\n    if (open) closer.focus();\r\n    else opener.focus({preventScroll: true});\r\n  }\r\n  opener.addEventListener('click', () => setKnowledge(true));\r\n  closer.addEventListener('click', () => setKnowledge(false));\r\n  overlay.addEventListener('click', event => { if (event.target === overlay) setKnowledge(false); });\r\n  document.addEventListener('keydown', event => {\r\n    if (overlay.hidden) return;\r\n    if (event.key === 'Escape') {\r\n      event.preventDefault();\r\n      event.stopImmediatePropagation();\r\n      setKnowledge(false);\r\n    } else if (event.key === 'Tab') {\r\n      const focusable = Array.from(overlay.querySelectorAll('button, a[href], input, select, textarea, [tabindex]')).filter(element => !element.disabled && element.tabIndex >= 0 && element.getClientRects().length);\r\n      const first = focusable[0], last = focusable[focusable.length - 1];\r\n      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }\r\n      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }\r\n    }\r\n  }, true);\r\n  window.helmetKnowledge = {open: () => setKnowledge(true), close: () => { if (!overlay.hidden) setKnowledge(false); }};\r\n})();\r\n\nconst LESSON_DATA={\"clear\":{\"width\":640,\"height\":640,\"svg\":\"\u003csvg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"640\\\" height=\\\"640\\\" viewBox=\\\"0 0 640 640\\\" role=\\\"img\\\" aria-labelledby=\\\"title desc\\\">\\r\\n\u003ctitle id=\\\"title\\\">安全帽标注教学施工场景 · 640 × 640\u003c/title>\u003cdesc id=\\\"desc\\\">教学绘制，非现场照片。蓝白色施工场景中有五名工人，其中三名戴安全帽、两名未戴安全帽。首位工人可见头部含帽的像素边界为（160，80）至（320，240）。\u003c/desc>\\r\\n\u003c!-- Original teaching vector illustration. No external images, fonts, or scripts. Bboxes are original-image pixels. -->\\r\\n\u003cdefs>\\r\\n\u003clinearGradient id=\\\"sky\\\" x2=\\\"0\\\" y2=\\\"1\\\">\u003cstop stop-color=\\\"#f6fbff\\\"/>\u003cstop offset=\\\"1\\\" stop-color=\\\"#e6f2fc\\\"/>\u003c/linearGradient>\\r\\n\u003clinearGradient id=\\\"hat\\\" x2=\\\".8\\\" y2=\\\"1\\\">\u003cstop stop-color=\\\"#ffdc66\\\"/>\u003cstop offset=\\\".55\\\" stop-color=\\\"#f5b92d\\\"/>\u003cstop offset=\\\"1\\\" stop-color=\\\"#d89118\\\"/>\u003c/linearGradient>\\r\\n\u003clinearGradient id=\\\"shirt\\\" x2=\\\"1\\\" y2=\\\".3\\\">\u003cstop stop-color=\\\"#6fa9e8\\\"/>\u003cstop offset=\\\"1\\\" stop-color=\\\"#3979ba\\\"/>\u003c/linearGradient>\\r\\n\u003clinearGradient id=\\\"vest\\\" x2=\\\"1\\\" y2=\\\".5\\\">\u003cstop stop fset, 138];\r\n    const overlapWidth = Math.max(0, 100-state.offset);\r\n    const intersection = overlapWidth * 80, union = 16000 - intersection;\r\n    const value = iou(a, b);\r\n    $('iou-demo-svg').innerHTML = `\u003cdefs>\u003cpattern id=\"iou-grid\" width=\"20\" height=\"20\" patternUnits=\"userSpaceOnUse\">\u003cpath d=\"M20 0H0V20\" fill=\"none\" stroke=\"#dce9f7\" stroke-width=\"1\"/>\u003c/pattern>\u003cpattern id=\"iou-hatch\" width=\"7\" height=\"7\" patternUnits=\"userSpaceOnUse\">\u003cpath d=\"M-2 2L2-2M0 7L7 0M5 9L9 5\" stroke=\"#2176df\" stroke-width=\"1.2\"/>\u003c/pattern>\u003c/defs>\u003crect width=\"380\" height=\"200\" rx=\"12\" fill=\"#f5f9ff\"/>\u003crect x=\"16\" y=\"15\" width=\"348\" height=\"170\" fill=\"url(#iou-grid)\"/>\u003crect x=\"${a[0]}\" y=\"${a[1]}\" width=\"100\" height=\"80\" fill=\"#d7f1ef\" fill-opacity=\"0.6\"/>\u003crect x=\"${b[0]}\" y=\"${b[1]}\" width=\"100\" height=\"80\" fill=\"#c9e2ff\" fill-opacity=\"0.5\"/>${overlapWidth > 0 ? `\u003crect x=\"${b[0]}\" y=\"58\" width=\"${overlapWidth}\" height=\"80\" fill=\"url(#iou-hatch)\"/>` : ''}\u003crect x=\"${a[0]}\" y=\"${a[1]}\" width=\"100\" height=\"80\" fill=\"none\" stroke=\"#168d8b\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\"/>\u003crect x=\"${b[0]}\" y=\"${b[1]}\" width=\"100\" height=\"80\" fill=\"none\" stroke=\"#256fe1\" stroke-width=\"3\"/>\u003ctext x=\"70\" y=\"45\" fill=\"#147f7d\" font-size=\"12\" font-weight=\"700\">人工真值\u003c/text>\u003ctext x=\"${b[0]+100}\" y=\"158\" fill=\"#256fe1\" font-size=\"12\" font-weight=\"700\" text-anchor=\"end\">预测框\u003c/text>`;\r\n    $('iou-offset-value').textContent = state.offset;\r\n    $('iou-intersection-area').textContent = `${intersection.toLocaleString()} px²`;\r\n    $('iou-union-area').textContent = `${union.toLocaleString()} px²`;\r\n    $('iou-demo-value').textContent = value.toFixed(3);\r\n    $('iou-demo-judgment').textContent = `${value >= state.iouThreshold ? '达到' : '未达到'}当前位置门槛 ${state.iouThreshold.toFixed(2)}`;\r\n    $('iou-demo-judgment').classList.toggle('iou-below', value \u003c state.iouThreshold);\r\n  }\r\n  function render() {\r\n    const focused = document.activeElement;\r\n    const focusId = focused?.dataset.evaluationPrediction || focused?.dataset.evaluationTruth;\r\n    const focusType = focused?.dataset.evaluationPrediction ? 'prediction' : 'truth';\r\n    const focusRegion = focused?.closest('#evaluation-svg, #evaluation-prediction-list, #evaluation-missed-list')?.id;\r\n    const result = calculate();\r\n    if (state.selection?.type === 'prediction' && !result.predictions.some(p => p.id === state.selection.id)) state.selection = null;\r\n    $('evaluation-threshold').value = state.threshold;\r\n    $('evaluation-threshold-value').textContent = state.threshold.toFixed(2);\r\n    $('evaluation-iou-threshold').value = state.iouThreshold;\r\n    $('evaluation-iou-value').textContent = state.iouThreshold.toFixed(2);\r\n    $('evaluation-show-truth').checked = state.showTruth;\r\n    $('evaluation-show-prediction').checked = state.showPrediction;\r\n    document.querySelectorAll('[data-evaluation-threshold]').forEach(button => {const active = Number(button.dataset.evaluationThreshold) === state.threshold; button.classList.toggle('active', active); button.setAttribute('aria-pressed', String(active));});\r\n    renderImage(result); renderLists(result); renderMetrics(result); renderIoU();\r\n    $('evaluation-back-prediction').href = `predict.html?threshold=${state.threshold.toFixed(2)}`;\r\n    if (focusId && focusRegion) [...$(focusRegion).querySelectorAll(`[data-evaluation-${focusType}]`)].find(element => element.getAttribute(`data-evaluation-${focusType}`) === focusId)?.focus({preventScroll: true});\r\n  }\r\n  function clearAnswers() {\r\n    ['tp', 'fp', 'fn'].forEach(key => {$(`challenge-${key}`).value = ''; $(`challenge-${key}`).removeAttribute('aria-invalid');});\r\n    $('evaluation-challenge-feedback').hidden = true;\r\n  }\r\n  function changeRule(key, value) {state[key] = value; state.selection = null; clearAnswers(); render();}\r\n  function select(type, id) {\r\n    if (state.selection?.type === type && state.selection.id === id) state.selection = null;\r\n    else state.selection = {type, id};\r\n    if (type === 'truth') state.showTruth = true;\r\n    if (type === 'prediction') state.showPrediction = true;\r\n    render();\r\n  }\r\n  function handleSelection(event) {\r\n    const prediction = event.target.closest('[data-evaluation-prediction]');\r\n    const truth = event.target.closest('[data-evaluation-truth]');\r\n    if (prediction) select('prediction', prediction.dataset.evaluationPrediction);\r\n    else if (truth) select('truth', truth.dataset.evaluationTruth);\r\n  }\r\n  $('evaluation-threshold').addEventListener('input', event => changeRule('threshold', Number(event.target.value)));\r\n  $('evaluation-iou-threshold').addEventListener('input', event => changeRule('iouThreshold', Number(event.target.value)));\r\n  document.querySelectorAll('[data-evaluation-threshold]').forEach(button => button.addEventListener('click', () => changeRule('threshold', Number(button.dataset.evaluationThreshold))));\r\n  $('evaluation-show-truth').addEventListener('change', event => {state.showTruth = event.target.checked; render();});\r\n  $('evaluation-show-prediction').addEventListener('change', event => {state.showPrediction = event.target.checked; render();});\r\n  $('evaluation-clear-selection').addEventListener('click', () => {state.selection = null; render();});\r\n  $('evaluation-prediction-list').addEventListener('click', handleSelection);\r\n  $('evaluation-missed-list').addEventListener('click', handleSelection);\r\n  $('evaluation-svg').addEventListener('click', handleSelection);\r\n  $('evaluation-svg').addEventListener('keydown', event => {if (['Enter', ' '].includes(event.key) && event.target.closest('[data-evaluation-prediction], [data-evaluation-truth]')) {event.preventDefault(); handleSelection(event);}});\r\n  $('evaluation-toggle-metrics').addEventListener('click', () => {state.showMetrics = !state.showMetrics; if (state.showMetrics) state.blind = false; render();});\r\n  $('evaluation-start-challenge').addEventListener('click', () => {clearAnswers(); state.blind = true; state.showMetrics = false; state.selection = null; render(); toast('结论已遮住，请独立核对后填写下方三个计数。'); $('challenge-tp').focus({preventScroll: true});});\r\n  $('evaluation-challenge-form').addEventListener('submit', event => {\r\n    event.preventDefault();\r\n    const result = calculate();\r\n    const answers = ['tp', 'fp', 'fn'].map(key => {\r\n      const input = $(`challenge-${key}`), value = input.value.trim();\r\n      const correct = value !== '' && Number.isInteger(Number(value)) && Number(value) === result[key];\r\n      input.setAttribute('aria-invalid', String(!correct));\r\n      return {key, correct};\r\n    });\r\n    const allCorrect = answers.every(answer => answer.correct);\r\n    const feedback = $('evaluation-challenge-feedback'); feedback.hidden = false; feedback.classList.toggle('is-correct', allCorrect);\r\n    if (allCorrect) {state.blind = false; state.showMetrics = true; render(); feedback.textContent = `核验通过：TP = ${result.tp}，FP = ${result.fp}，FN = ${result.fn}。精确率 ${percent(result.precision)}，召回率 ${percent(result.recall)}。点击逐框记录，检查你的理由是否一致。`;}\r\n    else feedback.textContent = `${answers.map(answer => `${answer.key.toUpperCase()} ${answer.correct ? '✓' : '待复查'}`).join('　')}。先找出同类且位置达标的唯一配对；未配对的预测是 FP，未配对的真值是 FN。`;\r\n  });\r\n  $('evaluation-reveal-answer').addEventListener('click', () => {\r\n    const result = calculate(); state.blind = false; state.showMetrics = true;\r\n    ['tp', 'fp', 'fn'].forEach(key => {$(`challenge-${key}`).value = result[key]; $(`challenge-${key}`).removeAttribute('aria-invalid');});\r\n    render();\r\n    const feedback = $('evaluation-challenge-feedback'); feedback.hidden = false; feedback.classList.add('is-correct');\r\n    const reasons = result.predictions.filter(p => p.status === 'fp').map(p => `${p.id}：${p.reason}`).join('；');\r\n    feedback.textContent = `解析：${result.tp} 个正确配对，${result.fp} 个未配对预测，${result.fn} 个未配对真值。${reasons ? `误检为 ${reasons}。` : '当前没有误检。'}${result.missed.length ? `漏检为 ${result.missed.map(t => t.id).join('、')}。` : '当前没有漏检。'}`;\r\n  });\r\n  $('iou-offset').addEventListener('input', event => {state.offset = Number(event.target.value); renderIoU();});\r\n  window.helmetEvaluationState = () => ({...state, selection: state.selection ? {...state.selection} : null, ...calculate(), iouDemo: {offset: state.offset, intersection: Math.max(0, 100-state.offset) * 80, union: 16000 - Math.max(0, 100-state.offset) * 80, iou: iou([70,58,170,138], [70+state.offset,58,170+state.offset,138])}});\r\n  render();\r\n})();\r\n\n(() => {\r\n  'use strict';\r\n  const routes = {'index.html':'annotation', '4-3.html':'annotation', 'predict.html':'predict', '4-3-predict.html':'predict', 'evaluate.html':'evaluate', '4-3-evaluate.html':'evaluate'};\r\n  document.addEventListener('click', event => {\r\n    const link = event.target.closest('a[href]');\r\n    if (!link) return;\r\n    const url = new URL(link.getAttribute('href'), document.baseURI);\r\n    const view = routes[url.pathname.split('/').pop()];\r\n    if (!view) return;\r\n    event.preventDefault();\r\n    window.parent.postMessage({type:'helmet:navigate', view, threshold:url.searchParams.get('threshold')}, '*');\r\n  });\r\n  window.addEventListener('message', event => {\r\n    if (event.source !== window.parent || event.data?.type !== 'helmet:set-threshold') return;\r\n    const value = Number(event.data.value);\r\n    if (!Number.isFinite(value) || value \u003c 0 || value > 1) return;\r\n    const input = document.getElementById('prediction-threshold') || document.getElementById('evaluation-threshold');\r\n    if (input) {input.value = value; input.dispatchEvent(new Event('input', {bubbles:true}));}\r\n  });\r\n  window.parent.postMessage({type:'helmet:ready'}, '*');\r\n})();\r\n\u003c/script>\u003c/body>\u003c/html>"}</script><script>(() => {
  'use strict';
  const shell = document.getElementById('lesson-shell');
  const frames = [...document.querySelectorAll('.lesson-frame')];
  const tabs = [...document.querySelectorAll('.shell-tab')];
  const documents = JSON.parse(document.getElementById('lesson-documents').textContent);
  const pendingThresholds = new Map();
  let messageTimer;
  function fit() {
    const content=document.getElementById('c4-content');
    const scale = Math.min((content?.clientWidth||window.innerWidth) / 1440, (content?.clientHeight||window.innerHeight) / 810);
    shell.style.transform = `scale(${scale})`;
  }
  function message(text) {
    document.getElementById('shell-message').textContent = text;
    clearTimeout(messageTimer);
    messageTimer = setTimeout(() => {document.getElementById('shell-message').textContent = '';}, 4200);
  }
  function thresholdValue(value) {
    if (value === undefined || value === null || String(value).trim() === '') return null;
    const number = Number(value);
    return Number.isFinite(number) && number >= 0 && number <= 1 ? Math.round(number * 100) / 100 : null;
  }
  function sendThreshold(frame, value) {
    if (value === null) return;
    if (frame.dataset.ready === 'true') frame.contentWindow.postMessage({type:'helmet:set-threshold', value}, '*');
    else pendingThresholds.set(frame.dataset.view, value);
  }
  function show(view, {threshold = null, updateHash = true, focus = false} = {}) {
    if (!Object.hasOwn(documents, view)) view = document.body.dataset.startView;
    frames.forEach(frame => {
      const active = frame.dataset.view === view;
      frame.hidden = !active;
      if (active && !frame.dataset.loaded) {
        frame.dataset.loaded = 'true';
        frame.srcdoc = documents[view];
      }
    });
    tabs.forEach(tab => {
      const active = tab.dataset.view === view;
      tab.setAttribute('aria-selected', String(active));
      tab.tabIndex = active ? 0 : -1;
      if (active && focus) tab.focus();
    });
    sendThreshold(frames.find(frame => frame.dataset.view === view), thresholdValue(threshold));
    document.title = `安全帽与 YOLO · ${tabs.find(tab => tab.dataset.view === view).querySelector('strong').textContent}实验`;
    if (updateHash) {
      const value = thresholdValue(threshold);
      const hash = '#' + view + (value !== null ? `?threshold=${value.toFixed(2)}` : '');
      if (location.hash !== hash) {
        try {history.pushState(null, '', hash);} catch {location.hash = hash;}
      }
    }
    window.dispatchEvent(new Event('c4-route-change'));
  }
  function readRoute() {
    const [hash, query = ''] = location.hash.slice(1).split('?');
    const params = new URLSearchParams(query || location.search);
    show(hash || document.body.dataset.startView, {threshold:params.get('threshold'), updateHash:false});
  }
  tabs.forEach((tab, index) => {
    tab.addEventListener('click', () => show(tab.dataset.view));
    tab.addEventListener('keydown', event => {
      const next = event.key === 'ArrowRight' ? (index + 1) % tabs.length : event.key === 'ArrowLeft' ? (index + tabs.length - 1) % tabs.length : event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : null;
      if (next !== null) {event.preventDefault(); show(tabs[next].dataset.view, {focus:true});}
    });
  });
  window.addEventListener('message', event => {
    const frame = frames.find(frame => frame.contentWindow === event.source);
    if (!frame || !event.data || typeof event.data !== 'object') return;
    if (event.data.type === 'helmet:ready') {
      frame.dataset.ready = 'true';
      if (pendingThresholds.has(frame.dataset.view)) {
        sendThreshold(frame, pendingThresholds.get(frame.dataset.view));
        pendingThresholds.delete(frame.dataset.view);
      }
    }
    if (event.data.type === 'helmet:navigate' && Object.hasOwn(documents, event.data.view)) {
      show(event.data.view, {threshold:thresholdValue(event.data.threshold), focus:true});
    }
  });
  document.getElementById('fullscreen-button').addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      else message('当前浏览器不支持全屏，可使用浏览器的全屏功能。');
    } catch {message('当前浏览器未能进入全屏，可使用浏览器的全屏功能。');}
  });
  document.addEventListener('fullscreenchange', () => {
    document.getElementById('fullscreen-button').textContent = document.fullscreenElement ? '退出全屏 ↙' : '全屏演示 ↗';
    fit();
  });
  document.getElementById('share-button').addEventListener('click', async () => {
    if (location.protocol === 'file:') {
      message('把当前这个 HTML 文件发给对方即可，标注、预测、评估和图片已全部包含在里面。');
      return;
    }
    try {await navigator.clipboard.writeText(location.href); message('已复制当前实验链接，打开后也能切换全部三个实验。');}
    catch {message('复制浏览器地址即可分享，打开后可切换全部三个实验。');}
  });
  window.addEventListener('hashchange', readRoute);
  window.addEventListener('popstate', readRoute);
  window.addEventListener('resize', fit);
  fit();
  readRoute();
})();
</script></body></html>
