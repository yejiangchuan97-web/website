<script id="guide-data" type="application/json">{"id":"8-3","title":"爬壁作业：把吸附、供电与独立防坠分别核对。","lead":"从适用壁面到作业中条件变化，理解不同防护路径的作用，并保留未确认和待检修事项。","tags":["壁面与吸附","独立防坠","条件变化"],"topics":[{"title":"壁面与吸附条件","summary":"磁吸与负压有不同适用条件，壁面的名字不能代替对基材、密封与表面状态的核对。","points":[["方式不同","磁吸关注适用的铁磁性基材；负压关注相应的密封与壁面条件。具体能力需对应机型。"],["条件会变化","板缝、掉粉、污染与接触状态可能改变作业条件；一次观察正常不代表后续始终相同。"]],"question":"看到“钢板”或“玻璃”名称，能否直接认定某台爬壁机适用？","hint":"还需要对应机型、基材与表面、密封或贴合等条件。导读不按墙面名称给出一键放行结果。"},{"title":"供电与防坠的两条路径","summary":"维持吸附或移动的供电，与安全绳及可靠挂点等独立防坠路径，需要分开理解。","points":[["各自关注","看供电、风机或磁吸机型的工作条件，也单独看安全绳、挂点与连接的核实情况。"],["避免混同","备用电源不等于独立机械防坠，吸附正常也不能替代防坠路径的确认。"]],"question":"为什么不能把“备用电源”和“安全绳”合成一个保险图标？","hint":"它们承担的作用与失效路径不同。分开表达才看得出哪些条件已核对，哪些仍然缺失。"},{"title":"分阶段保留检查条件","summary":"作业前、上墙前、作业中与下墙后，各有需要继续核对的条件，未确认事项不能被阶段切换抹掉。","points":[["准备与上墙","对应墙面、挂点、线缆、控制响应与下方人员状态，说明证据及未确认项。"],["下墙与再使用","密封、履带、线缆与绳具的损伤应保留待检修标记，复查以前不将记录直接改为已解决。"]],"question":"检查表勾得多，为什么仍不等于具备再次派工条件？","hint":"关键在具体项目的核实与复查依据，而不是勾选数量。损伤、未知条件和未完成处理仍需要保留。"},{"title":"异常情境与移交重点","summary":"漏气、线缆牵扯、控制迟滞或人员误入，需要结合设备应急方案理解，不把所有异常压成一个动作。","points":[["看危险来源","区分移动、吸附供电、牵缆与人员位置，阅读异常发生时哪些条件正在变化。"],["保留防护关系","原方案强调停止移动、限制下方通行与专业移交的关系；不能把异常处理理解为必然立即切掉维持吸附的全部供电。"]],"question":"为什么“立即切断全部电源”不能作为所有爬壁异常的统一答案？","hint":"某些机型依赖供电维持吸附，处置需对应具体机型与应急条件。导读只比较关系，不提供真实设备的应急控制步骤。"}],"comparison":{"title":"三类条件有分工，不能互相代替。","head":["条件路径","主要关注","不能据此认定"],"rows":[["吸附","机型、基材、密封或贴合及状态变化。","有吸附就不需要独立防坠。"],["供电与控制","供电方案、牵缆、接头、电量与控制响应。","备用电源等同于机械防坠。"],["独立防坠","绳具、连接、挂点与核实依据。","已经连接就能忽略吸附和移动条件。"],["下方区域与交接","人员、隔离、待检修部件与复查事项。","一次检查或没有滑落就能持续放行。"]]},"handoff":"记录机型、壁面与连接的核实依据，说明异常发生时的供电、人员和部件状态；保留待检修与待复查事项。","future":"壁面条件卡、供电与防坠路径、阶段切换及作业异常推演；当前不提供上墙许可、承载计算或设备应急仿真。"}</script><script>(()=>{'use strict';
