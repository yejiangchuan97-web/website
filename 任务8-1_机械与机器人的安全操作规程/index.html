<script id="guide-data" type="application/json">{"id":"8-1","title":"安全操作：先看运动范围，再分清停止与恢复。","lead":"从设备可能经过的位置出发，区分作业前检查、停止状态、重新启动与维修能量条件。","tags":["运动包络","停止与恢复","残余能量"],"topics":[{"title":"运动范围与人员通道","summary":"末端可达区与本体扫掠区关注不同部位，人员路线需要对照完整的运动范围。","points":[["观察对象","同时看本体、工具和载荷可能经过的位置，不能只盯着末端当前朝向。"],["现场组织","把占道材料、人员通道与隔离位置一起考虑，分析路线与设备运动的关系。"]],"question":"工具朝向墙面时，为什么仍要看机械臂肘部附近的通道？","hint":"末端位置不能代表整个本体的运动。肘部可能经过另一个区域，通道布置与协同条件也会影响风险。"},{"title":"作业前检查与发现","summary":"外观、油液和安全装置对应不同检查对象；发现问题后，需要保留与设备相关的待处理事项。","points":[["按对象查看","把结构、轮胎或履带、线缆、油液与保护装置分开观察，说明发现了什么。"],["保留异常","破损线缆或异常保护装置不能因为点过“已检查”就视为问题消失。"]],"question":"“检查过”与“发现的问题已经处理”有什么区别？","hint":"前者记录检查动作，后者需要处理与复查依据。发现、责任和未完成项应继续留在记录中。"},{"title":"停止、复位与再启动","summary":"程序停止、保护停止与急停有不同触发情境；复位与启动是需要分开理解的动作。","points":[["分开看状态","阅读情境时，分别关注程序状态、运行许可和驱动状态，不把三种停止混成一个按钮。"],["恢复需条件","复位不等于自动重新启动；触发原因和现场条件仍需要核对。具体恢复条件取决于设备与系统。"]],"question":"人员撤离后，点了复位，是否就意味着机器人应立即继续动作？","hint":"复位与重新启动分开。导读强调条件核对和明确启动指令，不由页面替现场判断恢复许可。"},{"title":"静止与残余能量","summary":"设备不动与不存在危险能量是两种判断，维修情境还要识别压力和重力载荷等能量路径。","points":[["看能量路径","主电源状态之外，还要认识气源、液压、受压管段和悬挂载荷等不同对象。"],["记录维修条件","隔离、验证与恢复条件需对应具体设备；急停不能被理解为必然消除了全部能量。"]],"question":"电源图标熄灭以后，为什么仍要关注管段与悬挂载荷？","hint":"电源状态不能说明所有压力、储能或重力条件。维修前需要针对相关能量确认条件，而不是只看设备是否静止。"}],"comparison":{"title":"把四种状态判断分开看。","head":["判断对象","本节关注","不能直接推出"],"rows":[["程序停止","程序与动作是否暂停。","全部能量已经解除。"],["保护停止","保护条件、运行许可与恢复要求。","触发原因已排除。"],["急停与复位","紧急停止情境及复位后的待启动状态。","复位会自动重新运行。"],["维修能量条件","相关能量的隔离、验证与现场条件。","只要设备不动就可以维修。"]]},"handoff":"保留设备编号、发现的问题、停止原因、触发条件、处理责任和未完成事项，再交给维护与复查环节。","future":"运动包络对照、停止状态与复位推演、作业前缺陷卡和能量路径示意；这些设备交互尚未实现。"}</script><script>(()=>{'use strict';
const data=JSON.parse(document.getElementById('guide-data').textContent),$=id=>document.getElementById(id),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('topic-list').onclick=e=>{const b=e.target.closest('[data-topic]');if(b)select(+b.dataset.topic);};$('topic-list').onkeydown=e=>{const b=e.target.closest('[data-topic]');if(!b)return;const i=+b.dataset.topic,n=data.topics.length,next=e.key==='ArrowDown'?(i+1)%n:e.key==='ArrowUp'?(i+n-1)%n:e.key==='Home'?0:e.key==='End'?n-1:null;if(next!==null){e.preventDefault();select(next);document.querySelector(`[data-topic="${next}"]`).focus();}};
$('comparison-title').textContent=data.comparison.title;$('comparison-table').innerHTML='<thead><tr>'+data.comparison.head.map(x=>`<th scope="col">${escape(x)}</th>`).join('')+'</tr></thead><tbody>'+data.comparison.rows.map(row=>'<tr>'+row.map((x,i)=>i===0?`<th scope="row">${escape(x)}</th>`:`<td data-label="${escape(data.comparison.head[i])}">${escape(x)}</td>`).join('')+'</tr>').join('')+'</tbody>';
$('handoff-text').textContent=data.handoff;$('future-text').textContent='后续交互规划：'+data.future;
const next=routes[(routes.findIndex(r=>r[0]===data.id)+1)%routes.length];$('next-guide').href=data.id==='8-4'?'../第八章_安全操作与维护/index.html':'../'+next[2];$('next-guide').textContent=data.id==='8-4'?'回到本章总结 ↗':`接着读 ${next[0]} · ${next[1]} ↗`;
$('source-note').textContent=`依据任务${data.id}现有教学方案整理。当前为阅读导读，设备交互仿真尚未制作；原教学方案保留在本任务 README。`;
select(0);window.Chapter8Guide={select,state:()=>({id:data.id,selected,topics:data.topics.length,mode:'reading',theme:document.documentElement.dataset.theme})};
})();
