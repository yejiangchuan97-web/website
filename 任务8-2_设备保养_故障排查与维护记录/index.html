<script id="guide-data" type="application/json">{"id":"8-2","title":"设备维护：从现象出发，用证据区分待查原因。","lead":"把保养对象、运动对照和维护记录联系起来，认识背隙、零点偏移与奇异姿态的不同线索。","tags":["按工具找部件","对照故障线索","维护记录"],"topics":[{"title":"保养对象随工具改变","summary":"喷嘴、夹砖器和绑扎头承担不同功能，检查对象应跟着工具与部件功能变化。","points":[["工具与部件","喷涂关注过滤与密封等对象；夹砖器关注夹持连接；绑扎头关注钢丝通路，另需关注线缆与连接。"],["按功能理解","部件拆解用于认识对象，不能用一张不分设备的勾选清单代替检查。"]],"question":"换了前端工具，原来的保养项目为什么还需要重新核对？","hint":"工具的材料通路、连接和工作方式可能不同，检查对象也随之改变；相同的机械臂不代表工具保养要求相同。"},{"title":"三种运动问题的对照","summary":"背隙、零点偏移与奇异姿态关注不同的运动关系，不能都解释为程序点位有偏差。","points":[["方向与参考","背隙关注换向空程与接近方向；零点偏移关注参考标记、系统角度与姿态之间的关系。"],["姿态相关性","接近奇异姿态时，某些关节速度需求可能增加；这种现象需结合构型与具体姿态理解。"]],"question":"发现重复定位偏差以后，为什么不应先把所有路径点统一补偿？","hint":"方向相关空程、参考零位问题和姿态相关运动学问题的线索不同。先对照证据，不能用统一补偿掩盖不同原因。"},{"title":"让线索组成证据链","summary":"旧油、声音和末端偏差可以提供线索，但单一外观或音色不足以自动确诊。","points":[["说明检查条件","把观察对象、发生姿态、接近方向、已有结果与证据来源放在一起，比较哪些原因仍待查。"],["保留不确定性","允许结论为“证据不足，移交”；真实设备可能多故障并存，模型里的单一因果不能直接替代现场排查。"]],"question":"只有一段异响，能否直接写成某个部件已经损坏？","hint":"声音首先是待查线索，需要与定位、传动、部件检查等证据组合；不足时应保留待确认项。"},{"title":"维护记录与处理后复查","summary":"记录要能追溯现象、证据、责任和复查，处理动作做过并不自动表示问题已解决。","points":[["记录组成","设备与工具编号、现象、检查条件、已有证据、排除项、处理责任和待复查事项。"],["保留未解决状态","处理后复查不合格，仍保留未解决项；需校准的问题应关联设备要求，而不是提供随意改零点的做法。"]],"question":"交接卡为什么既要写“已做什么”，也要写“还有什么未确认”？","hint":"下一班需要理解已有证据和检查条件，避免重复推断或把未完成的复查当成已经闭环。"}],"comparison":{"title":"用不同的对照问题阅读故障现象。","head":["待查问题","可关注的线索","需要继续核对"],"rows":[["背隙","换向时输入输出的空程、正反向接近差异。","机械间隙与其他定位影响，不能只改程序点位。"],["零点偏移","参考标记、系统角度与相同程序下的姿态差别。","设备规定的校准与复查条件。"],["奇异姿态","特定姿态附近的关节速度需求变化。","构型、姿态及预设路径之间的关系。"],["证据不足","现象存在，但可用线索还不能区分原因。","明确下一项检查或移交，保留未确认事项。"]]},"handoff":"交接时写清现象与已有证据，不把声音、油色或末端偏差单独写成确诊；保留处理责任、复查条件与未解决项。","future":"部件拆解、换向空程、零位与奇异姿态对照，以及包含证据不足情形的病例柜；当前尚无这些设备动画或诊断仿真。"}</script><script>(()=>{'use strict';
